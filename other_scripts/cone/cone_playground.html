let _statusTimer = null;
function flashStatus(msg, cls) {
  const el = document.getElementById("status");
  if (!el) return;
  el.textContent = msg;
  el.className = cls || "";
  if (_statusTimer) clearTimeout(_statusTimer);
  _statusTimer = setTimeout(() => {
    _statusTimer = null;
    el.textContent = "";
    el.className = "";
  }, 1800);
}

/* ==========================================================================
   BINDINGS
   ========================================================================== */

(function installPanel() {
  const d  = document.getElementById("depthSlider");
  const a  = document.getElementById("angleSlider");
  const r  = document.getElementById("ringsSlider");
  const m  = document.getElementById("meridiansSlider");
  const sd = document.getElementById("shapeDepthSlider");

  const resetBtn       = document.getElementById("resetBtn");
  const centerBtn      = document.getElementById("centerBtn");
  const addBtn         = document.getElementById("addQuadBtn");
  const cloneBtn       = document.getElementById("cloneQuadBtn");
  const addSqBtn       = document.getElementById("addSquareBtn");
  const cloneSqBtn     = document.getElementById("cloneSquareBtn");
  const exportBtn      = document.getElementById("exportBtn");
  const generateKraBtn = document.getElementById("generateKraBtn");
  const saveSceneBtn   = document.getElementById("saveSceneBtn");
  const loadSceneBtn   = document.getElementById("loadSceneBtn");
  const drawQuadBtn    = document.getElementById("drawQuadBtn");
  const drawFitModeEl  = document.getElementById("drawFitMode");
  const drawNoRotateEl = document.getElementById("drawNoRotate");
  const helpBtn        = document.getElementById("helpBtn");
  const mirrorEl       = document.getElementById("patchMirror");

  if (d) d.addEventListener("input", () => {
    cone.depth = parseFloat(d.value);
    clampApex();
    updatePanelLabels();
    draw();
  });
  if (a) a.addEventListener("input", () => {
    cone.halfAngle = parseFloat(a.value) * Math.PI / 180;
    clampApex();
    updatePanelLabels();
    draw();
  });
  if (r) r.addEventListener("input", () => {
    cone.ringCount = parseInt(r.value, 10);
    updatePanelLabels();
    draw();
  });
  if (m) m.addEventListener("input", () => {
    cone.meridianCount = parseInt(m.value, 10);
    updatePanelLabels();
    draw();
  });
  if (sd) sd.addEventListener("input", () => {
    SHAPE_DEPTH_CONE = parseFloat(sd.value);
    updatePanelLabels();
    draw();
  });

  /* ---- patch-position scrub inputs -------------------------------
     The φ field reads and writes in display units (see the module
     docstring); the s field reads and writes in fraction-of-height
     units, unchanged. */

  const phiInput = document.getElementById("patchPhiVal");
  const sInput   = document.getElementById("patchSVal");

  if (phiInput) _installScrubInput(phiInput, {
    rate: PATCH_PHI_SCRUB_RATE,
    snapStep: PATCH_SNAP_PHI_NORM,
    read: () => {
      if (selectedQuad < 0 || selectedQuad >= quads.length) return 0;
      return _phiToDisplay(_patchPhiCenter(quads[selectedQuad]));
    },
    write: (raw) => {
      if (selectedQuad < 0 || selectedQuad >= quads.length) return;
      _setPatchPhiCenter(quads[selectedQuad], _displayToPhi(raw));
    },
  });

  if (sInput) _installScrubInput(sInput, {
    rate: PATCH_S_SCRUB_RATE,
    read: () => {
      if (selectedQuad < 0 || selectedQuad >= quads.length) return 0;
      return _patchSCenter(quads[selectedQuad]);
    },
    write: (raw) => {
      if (selectedQuad < 0 || selectedQuad >= quads.length) return;
      _setPatchSCenter(quads[selectedQuad], raw);
    },
  });

  /* ---- patch mirror toggle --------------------------------------
     When checked, every square on the selected patch is also drawn
     on the patch's mirror — the same patch shifted by q.mirrorAngle
     in φ, i.e. on the opposite side of the cone.  The mirror is a
     visual clone, not an independent object; it is not hit-tested
     and it does not appear in the square list.  The checkbox's own
     state is kept in sync with the selected patch by
     _syncPatchCoordInputs, called from draw() and syncQuadList(). */
  if (mirrorEl) {
    mirrorEl.addEventListener("change", () => {
      if (selectedQuad < 0 || selectedQuad >= quads.length) return;
      quads[selectedQuad].mirror = mirrorEl.checked;
      draw();
      flashStatus(mirrorEl.checked
                    ? "Mirror on for " + quads[selectedQuad].name
                    : "Mirror off",
                  "ok");
    });
  }

  /* ---- mirror angle scrub input ---------------------------------
     The angular offset at which the mirror patch is drawn, in
     radians in the model and degrees in the field.  No snap on this
     field: the plain drag is continuous, and the Shift-held
     symmetric drag below is also continuous.

     Plain drag: moves only the mirror angle.

     Shift-held drag (the symmetric mode): moves the mirror AND the
     original patch symmetrically about the midpoint they shared at
     drag start.  If the mirror angle advances by Δ, the patch's φ
     shifts by −Δ/2 and the mirror (which sits at patch_φ +
     mirrorAngle) moves by +Δ/2.  The two therefore separate (or
     converge) at equal rates on either side of that fixed midpoint.

     The midpoint is captured at mousedown — not recomputed from
     the current patch position — so a long drag does not
     accumulate drift.  Releasing Shift mid-drag restores the
     patch to its start φ on the next motion event; the write
     callback handles that via drag.startPhi.

     See the MIRROR ANGLE AND FLIP note in the module docstring. */
  const mirrorAngleInput = document.getElementById("patchMirrorAngle");
  if (mirrorAngleInput) _installScrubInput(mirrorAngleInput, {
    rate: MIRROR_ANGLE_SCRUB_RATE_DEG_PER_PX * Math.PI / 180,
    symmetricOnShift: true,

    read: () => {
      if (selectedQuad < 0 || selectedQuad >= quads.length) return Math.PI;
      const q = quads[selectedQuad];
      return (typeof q.mirrorAngle === "number") ? q.mirrorAngle : Math.PI;
    },

    /* Snapshot the patch's φ at drag start so a symmetric drag can
       always be recomputed from the same origin. */
    onDragStart: (drag) => {
      if (selectedQuad < 0 || selectedQuad >= quads.length) return;
      drag.startPhi = _patchPhiCenter(quads[selectedQuad]);
    },

    /* Plain drag: set the mirror angle.  If the drag was in
       symmetric mode at any point, restore the patch's φ to its
       start value so releasing Shift does not leave the patch
       stranded mid-offset. */
    write: (raw, drag) => {
      if (selectedQuad < 0 || selectedQuad >= quads.length) return;
      const q = quads[selectedQuad];
      if (drag && typeof drag.startPhi === "number") {
        _setPatchPhiCenter(q, drag.startPhi);
      }
      q.mirrorAngle = raw;
    },

    /* Shift-held drag: Δ = mirrorAngle − startMirrorAngle.  Mirror
       moves by Δ; patch moves by −Δ/2.  Both are absolute from the
       drag-start snapshot, so repeated mousemoves are idempotent
       and no drift accumulates. */
    writeSymmetric: (raw, drag) => {
      if (selectedQuad < 0 || selectedQuad >= quads.length) return;
      const q = quads[selectedQuad];
      const startAngle = drag.startValue;
      const startPhi   = (typeof drag.startPhi === "number")
                           ? drag.startPhi
                           : _patchPhiCenter(q);
      const delta = raw - startAngle;
      q.mirrorAngle = startAngle + delta;
      _setPatchPhiCenter(q, startPhi - delta / 2);
    },
  });

  /* ---- mirror flip toggle ---------------------------------------
     When checked (the default), the shape's θ is negated for the
     duration of the mirror draw.  The φ-shift of the mirror rotates
     the patch's local U/V frame by the same angle, which would
     otherwise render a tilted, rotated, or anchored shape 180°-
     rotated relative to the original.  See the MIRROR ANGLE AND
     FLIP note in the module docstring. */
  const mirrorFlipEl = document.getElementById("patchMirrorFlip");
  if (mirrorFlipEl) {
    mirrorFlipEl.addEventListener("change", () => {
      if (selectedQuad < 0 || selectedQuad >= quads.length) return;
      quads[selectedQuad].mirrorFlip = mirrorFlipEl.checked;
      draw();
      flashStatus(mirrorFlipEl.checked
                    ? "Mirror flip on for " + quads[selectedQuad].name
                    : "Mirror flip off",
                  "ok");
    });
  }

  /* ---- square-size scrub inputs ---------------------------------
     The two fields read and write the shape's reference-unit size,
     independent of the patch it sits on (see the module
     docstring).  Both are disabled until a square is selected. */

  const wInput = document.getElementById("squareWVal");
  const hInput = document.getElementById("squareHVal");

  if (wInput) _installScrubInput(wInput, {
    rate: SQUARE_SIZE_SCRUB_RATE,
    snapStep: SQUARE_SIZE_SNAP_STEP,
    read: () => {
      if (selectedSquare < 0 || selectedSquare >= floatSquares.length) return 0;
      return squareWorldWidth(floatSquares[selectedSquare]);
    },
    write: (raw) => {
      if (selectedSquare < 0 || selectedSquare >= floatSquares.length) return;
      _setSquareWidth(floatSquares[selectedSquare], raw);
    },
  });

  if (hInput) _installScrubInput(hInput, {
    rate: SQUARE_SIZE_SCRUB_RATE,
    snapStep: SQUARE_SIZE_SNAP_STEP,
    read: () => {
      if (selectedSquare < 0 || selectedSquare >= floatSquares.length) return 0;
      return squareWorldHeight(floatSquares[selectedSquare]);
    },
    write: (raw) => {
      if (selectedSquare < 0 || selectedSquare >= floatSquares.length) return;
      _setSquareHeight(floatSquares[selectedSquare], raw);
    },
  });

  /* ---- slope scrub input ----------------------------------------
     The field reads and writes the shape's pseudo-3D tilt.  The
     model speaks radians; the field speaks degrees (see the SLOPE
     note in the module docstring).  The rate and snap step are
     converted from degrees to radians here so the installer's
     radian-per-pixel contract is honoured. */

  const slopeInput = document.getElementById("squareSlopeVal");

  if (slopeInput) _installScrubInput(slopeInput, {
    rate: SLOPE_SCRUB_RATE_DEG_PER_PX * Math.PI / 180,
    snapStep: SLOPE_SNAP_STEP_DEG * Math.PI / 180,
    read: () => {
      if (selectedSquare < 0 || selectedSquare >= floatSquares.length) return 0;
      return floatSquares[selectedSquare].slope || 0;
    },
    write: (raw) => {
      if (selectedSquare < 0 || selectedSquare >= floatSquares.length) return;
      const s = Math.max(SHAPE_SLOPE_MIN, Math.min(SHAPE_SLOPE_MAX, raw));
      floatSquares[selectedSquare].slope = s;
    },
  });

  /* ---- per-square visual-bottom toggle --------------------------
     A per-square meta option: when checked, the shape's KRA text
     anchor and its four corner senses are read from the visual
     bottom of the scene (the edge of the drawn square whose
     midpoint sits lowest on screen) instead of from the shape's own
     longest edge.  The flag is stored on the square object as
     `visualBottom` and read by pg_kra.py's
     _shapeLabelScreenAngleDeg.  See the VISUAL BOTTOM section in
     the module docstring.  The checkbox's own state follows the
     selected square, kept in sync by _syncSquareSizeInputs. */
  const visualBottomEl = document.getElementById("squareVisualBottom");
  if (visualBottomEl) {
    visualBottomEl.addEventListener("change", () => {
      if (selectedSquare < 0 || selectedSquare >= floatSquares.length) return;
      const sq = floatSquares[selectedSquare];
      sq.visualBottom = visualBottomEl.checked;
      draw();
      flashStatus(visualBottomEl.checked
                    ? "Visual bottom on for " + squareDisplayName(sq)
                    : "Visual bottom off",
                  "ok");
    });
  }

  /* ---- draw tool + help popup -----------------------------------
     Draw Quad toggles the fitting tool (state and fitting logic in
     pg_core.py; event interception in pg_dispatch.py).  The "?"
     button opens the help card in a separate named popup window.
     Both the fit-mode select and the "No rotate" checkbox are read
     at finish time, so changing either mid-draw affects the next
     completed draw. */

  if (drawQuadBtn) drawQuadBtn.addEventListener("click", toggleDrawTool);
  if (helpBtn)     helpBtn.addEventListener("click", openHelpWindow);

  if (drawFitModeEl) {
    drawFitModeEl.addEventListener("change", () => {
      const labels = {
        "shape-first": "shape \u2192 patch",
        "patch-first": "patch \u2192 shape",
      };
      flashStatus("Draw fit: "
                  + (labels[drawFitModeEl.value] || drawFitModeEl.value),
                  "ok");
    });
  }

  if (drawNoRotateEl) {
    drawNoRotateEl.addEventListener("change", () => {
      flashStatus("Rotation: "
                  + (drawNoRotateEl.checked
                       ? "locked to 0 \u00B7 axis-aligned"
                       : "free"),
                  "ok");
    });
  }

  /* ---- buttons and lists ----------------------------------------- */

  if (resetBtn)       resetBtn.addEventListener("click", resetView);
  if (centerBtn)      centerBtn.addEventListener("click", () => {
    cone.ax = 0;
    cone.ay = 0;
    draw();
  });
  if (addBtn)         addBtn.addEventListener("click", addQuad);
  if (cloneBtn)       cloneBtn.addEventListener("click", () => {
    if (selectedQuad < 0 || selectedQuad >= quads.length) {
      flashStatus("No patch selected", "warn");
      return;
    }
    cloneQuad(selectedQuad);
  });
  if (addSqBtn)       addSqBtn.addEventListener("click", () => {
    if (selectedQuad < 0 || selectedQuad >= quads.length) return;
    addSquareAtCenter(selectedQuad);
  });
  if (cloneSqBtn)     cloneSqBtn.addEventListener("click", () => {
    if (selectedSquare < 0 || selectedSquare >= floatSquares.length) {
      flashStatus("No square selected", "warn");
      return;
    }
    cloneSquare(selectedSquare);
  });
  if (exportBtn)      exportBtn.addEventListener("click",
                                                 exportVisualStateJSON);
  if (generateKraBtn) generateKraBtn.addEventListener("click",
                                                 generateKraFromScene);
  if (saveSceneBtn)   saveSceneBtn.addEventListener("click", saveSceneJSON);
  if (loadSceneBtn)   loadSceneBtn.addEventListener("click", promptLoadScene);

  window.addEventListener("keydown", (e) => {
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;

    /* Escape cancels an in-progress draw before anything else. */
    if (e.key === "Escape" && drawTool.active) {
      e.preventDefault();
      cancelDrawTool();
      return;
    }

    const shiftOnly = e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey;
    if (shiftOnly) {
      const k = e.key.toLowerCase();
      if (k === "a") {
        e.preventDefault();
        if (alignSelectedShapeToAxis()) {
          flashStatus("Aligned to axis", "ok");
        }
        return;
      }
    }

    if (e.key === "Delete" || e.key === "Backspace") {
      if (selectedSquare >= 0) {
        e.preventDefault();
        deleteSquare(selectedSquare);
      }
    }
  });
})();

/* ==========================================================================
   SCENE SAVE / LOAD
   ========================================================================== */

const SCENE_VERSION = 1;
const SCENE_TYPE    = "cone_scene";
const SCENE_FILE    = "cone_scene.json";

function buildSceneJSON() {
  return {
    sceneVersion: SCENE_VERSION,
    type:         SCENE_TYPE,
    generatedAt:  new Date().toISOString(),

    cone: {
      ax:            cone.ax,
      ay:            cone.ay,
      depth:         cone.depth,
      halfAngle:     cone.halfAngle,
      ringCount:     cone.ringCount,
      meridianCount: cone.meridianCount,
    },

    shapeDepthCone: SHAPE_DEPTH_CONE,

    nextQuadId:   nextQuadId,
    nextSquareId: nextSquareId,

    patches: quads.map(q => ({
      id:   q.id,
      name: q.name,
      phi0: q.phi0,
      phi1: q.phi1,
      s0:   q.s0,
      s1:   q.s1,
      mirror: !!q.mirror,
      mirrorAngle: (typeof q.mirrorAngle === "number")
                     ? q.mirrorAngle : Math.PI,
      mirrorFlip: q.mirrorFlip !== false,
    })),

    squares: floatSquares.map(sq => ({
      id:     sq.id,
      name:   sq.name,
      quadId: sq.quadId,
      u:      sq.u,
      v:      sq.v,
      scaleU: sq.scaleU,
      scaleV: sq.scaleV,
      theta:  sq.theta || 0,
      slope:  sq.slope || 0,
      visualBottom: !!sq.visualBottom,
    })),

    /* KRA-export meta-options.  The mapping between DOM controls
       and this object is defined entirely inside pg_kra.py, via
       readKraOptionsFromDOM / applyKraOptionsToDOM.  Adding a new
       option there makes it automatically part of the scene. */
    kraOptions: (typeof readKraOptionsFromDOM === "function")
                  ? readKraOptionsFromDOM()
                  : undefined,
  };
}

function saveSceneJSON() {
  const text = JSON.stringify(buildSceneJSON(), null, 2);
  const url  = "data:application/json;charset=utf-8,"
             + encodeURIComponent(text);
  const a = document.createElement("a");
  a.href = url;
  a.download = SCENE_FILE;
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  if (typeof flashStatus === "function") {
    flashStatus("Saved " + quads.length + " patch(es) and "
                + floatSquares.length + " shape(s)", "ok");
  }
}

/* Clear every drag slot on `state` so a load cannot leave a stale
   index pointing into a cleared array.  Also clears the selection
   and any in-progress drawing. */
function _clearTransientState() {
  state.dragApex       = null;
  state.dragQuadVertex = null;
  state.dragSquare     = null;
  state.flatDrag       = null;
  state.flatSquareDrag = null;
  state.dragPatchBody  = null;

  if (state.mouse) {
    state.mouse.sx     = 0;
    state.mouse.sy     = 0;
    state.mouse.inside = false;
  }

  if (typeof drawing        !== "undefined") drawing        = null;
  if (typeof drawingPreview !== "undefined") drawingPreview = null;

  selectedQuad   = -1;
  selectedSquare = -1;
}

function applySceneJSON(data) {
  if (!data || typeof data !== "object") {
    throw new Error("scene: not an object");
  }
  if (data.type && data.type !== SCENE_TYPE) {
    throw new Error("scene: wrong type '" + data.type
                    + "' (expected '" + SCENE_TYPE + "')");
  }
  if (data.sceneVersion !== SCENE_VERSION) {
    throw new Error("scene: unsupported sceneVersion "
                    + data.sceneVersion
                    + " (expected " + SCENE_VERSION + ")");
  }

  /* ---- cone ---------------------------------------------------- */
  if (data.cone && typeof data.cone === "object") {
    const c = data.cone;
    if (typeof c.ax            === "number") cone.ax            = c.ax;
    if (typeof c.ay            === "number") cone.ay            = c.ay;
    if (typeof c.depth         === "number") cone.depth         = c.depth;
    if (typeof c.halfAngle     === "number") cone.halfAngle     = c.halfAngle;
    if (typeof c.ringCount     === "number") cone.ringCount     = c.ringCount;
    if (typeof c.meridianCount === "number") cone.meridianCount = c.meridianCount;
  }

  if (typeof data.shapeDepthCone === "number") {
    SHAPE_DEPTH_CONE = data.shapeDepthCone;
  } else if (typeof data.shapeDepth === "number") {
    /* Legacy scenes stored a single factor; treat it as the cone
       view's, since that is the one the panel now drives. */
    SHAPE_DEPTH_CONE = data.shapeDepth;
  }
  /* SHAPE_DEPTH_FLAT is a fixed const and is not restored. */

  /* ---- KRA meta-options --------------------------------------- */
  /* The DOM ⇄ object mapping lives in pg_kra.py.  Older scenes
     without this field simply leave the panel's option controls
     at whatever the current session already has. */
  if (data.kraOptions && typeof applyKraOptionsToDOM === "function") {
    applyKraOptionsToDOM(data.kraOptions);
  }

  /* ---- patches ------------------------------------------------- */
  const patches = Array.isArray(data.patches) ? data.patches : [];
  const squares = Array.isArray(data.squares) ? data.squares : [];

  /* quads and floatSquares are `const` bindings; the arrays cannot
     be reassigned, but their contents can be cleared and refilled
     in place.  Every module holds the same reference throughout. */
  quads.length = 0;
  for (const p of patches) {
    if (typeof p.id !== "number") continue;
    quads.push({
      id:   p.id,
      name: (typeof p.name === "string" && p.name.length)
              ? p.name : ("Q" + p.id),
      phi0: (typeof p.phi0 === "number") ? p.phi0 : 0,
      phi1: (typeof p.phi1 === "number") ? p.phi1 : Math.PI / 2,
      s0:   (typeof p.s0   === "number") ? p.s0   : 0.10,
      s1:   (typeof p.s1   === "number") ? p.s1   : 0.50,
      mirror: !!p.mirror,
      mirrorAngle: (typeof p.mirrorAngle === "number")
                     ? p.mirrorAngle : Math.PI,
      mirrorFlip: p.mirrorFlip !== false,
    });
  }

  floatSquares.length = 0;
  for (const s of squares) {
    if (typeof s.id     !== "number") continue;
    if (typeof s.quadId !== "number") continue;

    /* Skip a square whose patch is not in the file — it would be
       an orphan with no plane to live on. */
    let quadExists = false;
    for (const q of quads) {
      if (q.id === s.quadId) { quadExists = true; break; }
    }
    if (!quadExists) continue;

    floatSquares.push({
      id:     s.id,
      name:   (typeof s.name === "string" && s.name.length)
                ? s.name : ("S" + s.id),
      quadId: s.quadId,
      u:      (typeof s.u === "number") ? s.u : 0,
      v:      (typeof s.v === "number") ? s.v : 0,
      scaleU: (typeof s.scaleU === "number")
                ? s.scaleU : SHAPE_DEFAULT_SCALE,
      scaleV: (typeof s.scaleV === "number")
                ? s.scaleV : SHAPE_DEFAULT_SCALE,
      theta:  (typeof s.theta === "number") ? s.theta : 0,
      slope:  (typeof s.slope === "number") ? s.slope : 0,
      visualBottom: !!s.visualBottom,
    });
  }

  /* ---- id counters -------------------------------------------- */
  let maxQuadId   = 0;
  let maxSquareId = 0;
  for (const q of quads)        maxQuadId   = Math.max(maxQuadId,   q.id);
  for (const s of floatSquares) maxSquareId = Math.max(maxSquareId, s.id);
  nextQuadId   = Math.max(maxQuadId   + 1,
                          (typeof data.nextQuadId   === "number")
                            ? data.nextQuadId   : 1);
  nextSquareId = Math.max(maxSquareId + 1,
                          (typeof data.nextSquareId === "number")
                            ? data.nextSquareId : 1);

  /* ---- clean up ----------------------------------------------- */
  _clearTransientState();

  /* Re-clamp each shape against the new cone: a sq.v that was legal
     on the old cone may need pulling back on the new one. */
  for (let i = 0; i < floatSquares.length; i++) {
    const sq = floatSquares[i];
    const qi = quadIdxById(sq.quadId);
    if (qi >= 0) sq.v = clampCloneV(qi, sq.v);
  }

  /* ---- refresh views and panel -------------------------------- */
  syncPanelSliders();
  syncQuadList();
  draw();
}

function loadSceneFromText(text) {
  let data;
  try {
    data = JSON.parse(text);
  } catch (e) {
    if (typeof flashStatus === "function") {
      flashStatus("Load failed: not valid JSON", "bad");
    }
    return false;
  }
  try {
    applySceneJSON(data);
  } catch (e) {
    if (typeof flashStatus === "function") {
      flashStatus("Load failed: " + e.message, "bad");
    }
    return false;
  }
  if (typeof flashStatus === "function") {
    flashStatus("Loaded " + quads.length + " patch(es) and "
                + floatSquares.length + " shape(s)", "ok");
  }
  return true;
}

/* A hidden <input type=file> is created on first use and reused
   thereafter, so clicking Load does not create a new element per
   click.  Its value is cleared after each read so the same file can
   be loaded twice in a row. */
let _sceneFileInput = null;

function _installSceneFileInput() {
  if (_sceneFileInput) return _sceneFileInput;
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "application/json,.json";
  inp.style.display = "none";
  inp.addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      loadSceneFromText(String(reader.result || ""));
      inp.value = "";
    };
    reader.onerror = () => {
      if (typeof flashStatus === "function") {
        flashStatus("Load failed: could not read file", "bad");
      }
      inp.value = "";
    };
    reader.readAsText(file);
  });
  document.body.appendChild(inp);
  _sceneFileInput = inp;
  return inp;
}

function promptLoadScene() {
  _installSceneFileInput().click();
}

/* ==========================================================================
   DRAG DELTA CAPS
   ========================================================================== */

const BODY_DRAG_MAX_DU = 4.0;
const BODY_DRAG_MAX_DV = 4.0;

/* ==========================================================================
   DRAW
   ========================================================================== */

function draw() {
  const cw = window.innerWidth;
  const ch = window.innerHeight;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#0a0e14";
  ctx.fillRect(0, 0, cw, ch);

  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, cw, layout.coneH); ctx.clip();
  drawConeView();
  ctx.restore();

  ctx.fillStyle = "#dce6f2";
  ctx.fillRect(0, layout.dividerY,     cw, 1);
  ctx.fillStyle = "#1e2836";
  ctx.fillRect(0, layout.dividerY + 2, cw, 1);

  drawFlatView();

  const M = 6;
  ctx.strokeStyle = "#1e2836";
  ctx.lineWidth = 0.8;
  ctx.strokeRect(M + 0.5, M + 0.5, cw - 2 * M - 1, ch - 2 * M - 1);

  updateStatus();

  /* Draw tool preview: the click chain so far, plus a rubber-band
     segment to the current hover position when the tool is active
     and fewer than four corners have been committed. */
  if (drawTool.active) {
    ctx.save();
    ctx.strokeStyle = "#00e5ff";
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 3]);
    const pts = drawTool.points;
    if (pts.length > 0) {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      if (drawTool.hover && pts.length < 4) {
        ctx.lineTo(drawTool.hover[0], drawTool.hover[1]);
      }
      ctx.stroke();

      for (const [x, y] of pts) {
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = "#00e5ff";
        ctx.fill();
      }
      if (drawTool.hover && pts.length < 4) {
        ctx.beginPath();
        ctx.arc(drawTool.hover[0], drawTool.hover[1], 3, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(0,229,255,0.5)";
        ctx.fill();
      }
    }
    ctx.restore();
  }

  /* Panel refresh: the two patch-position scrub fields follow the
     selected patch's centre.  Called every frame so live drags,
     apex tilts, and depth changes are all reflected.  A focused
     field is left alone by the sync function. */
  _syncPatchCoordInputs();
}

/* ==========================================================================
   STATUS
   ========================================================================== */

function updateStatus() {
  const el = document.getElementById("status");
  if (!el) return;

  if (drawTool.active) {
    const n = drawTool.points.length;
    el.textContent = "DRAW QUAD \u2014 click corner " + (n + 1)
                   + " of 4   (Esc to cancel)";
    el.className = "ok";
    return;
  }

  if (!state.mouse.inside) {
    el.textContent =
      "drag apex to tilt \u00B7 scroll to change depth \u00B7 " +
      "shift+click a patch to drop a shape \u00B7 " +
      "drag corners, rotate handle, or interior to edit \u00B7 " +
      "alt+click a square to grab its patch";
    el.className = "";
    return;
  }

  if (state.mouse.sy >= layout.dividerY) {
    const p = screenToFlat(state.mouse.sx, state.mouse.sy);
    el.textContent =
      "flat   \u03C6 = " + p.phi.toFixed(2) +
      "   s = " + p.s.toFixed(3);
    el.className = "ok";
    return;
  }

  const [wx, wy] = s2w(state.mouse.sx, state.mouse.sy);
  const tiltDeg = Math.atan2(Math.hypot(cone.ax, cone.ay), cone.depth)
                  * 180 / Math.PI;

  let drag = "";
  const ds = state.dragSquare || state.flatSquareDrag;
  if (state.dragQuadVertex) {
    drag = "   \u00B7  shaping " + quads[state.dragQuadVertex.quadIdx].name;
  } else if (ds) {
    const sq = floatSquares[ds.squareIdx];
    if (sq) {
      const dims = squareDims(sq);
      const deg  = Math.round((sq.theta || 0) * 180 / Math.PI);
      const slp  = Math.round((sq.slope || 0) * 180 / Math.PI);
      drag = "   \u00B7  shape #" + sq.id +
             "  W " + dims.w.toFixed(2) +
             "  H " + dims.h.toFixed(2) +
             "  \u2220 " + deg + "\u00B0" +
             "  \u2197 " + slp + "\u00B0";
    }
  } else if (state.dragPatchBody) {
    drag = "   \u00B7  moving " +
           quads[state.dragPatchBody.quadIdx].name;
  } else if (state.flatDrag &&
             state.flatDrag.mode === "body") {
    drag = "   \u00B7  moving " +
           quads[state.flatDrag.quadIdx].name;
  }

  el.textContent =
    "cursor (" + wx.toFixed(1) + ", " + wy.toFixed(1) + ")" +
    "   apex (" + cone.ax.toFixed(1) + ", " + cone.ay.toFixed(1) + ")" +
    "   tilt " + tiltDeg.toFixed(1) + "\u00B0" +
    "   depth " + cone.depth.toFixed(1) +
    drag;
  el.className = "ok";
}

/* ==========================================================================
   HIT TEST — 3D patch corner
   ========================================================================== */

function findQuadVertexAt(sx, sy) {
  const R_HIT = 12;
  let best = null, bestD = R_HIT;

  const order = [];
  if (selectedQuad >= 0 && selectedQuad < quads.length) {
    order.push(selectedQuad);
  }
  for (let i = 0; i < quads.length; i++) {
    if (i !== selectedQuad) order.push(i);
  }

  for (const qi of order) {
    const corners = quadCorners(quads[qi]);
    for (let ci = 0; ci < 4; ci++) {
      const c = corners[ci];
      const [wx, wy]   = surfacePoint(c.phi, c.s);
      const [vsx, vsy] = w2s(wx, wy);
      const d = Math.hypot(sx - vsx, sy - vsy);
      if (d < bestD) {
        bestD = d;
        best = { quadIdx: qi, cornerIdx: ci };
      }
    }
  }
  return best;
}

/* ==========================================================================
   ALT PASS-THROUGH HELPERS
   ==========================================================================
   Both bands' Alt+square paths end in the same action: select the
   patch that the square belongs to, clear the square selection, and
   seed the appropriate patch-body drag state.  Extracting the two
   bodies into named helpers lets the ordinary hit test and the
   mirror fallback share exactly one code path, so their behaviour
   cannot drift apart. */

function _beginConePatchDragFromSquareIdx(squareIdx, sx, sy) {
  const sq = floatSquares[squareIdx];
  const qi = sq ? quadIdxById(sq.quadId) : -1;
  if (qi < 0) return false;

  const q = quads[qi];
  if (qi !== selectedQuad) {
    selectedQuad = qi;
    syncQuadList();
  }
  selectedSquare = -1;

  const [wx, wy] = s2w(sx, sy);
  const p0 = projectToConeSurface(wx, wy, (q.s0 + q.s1) / 2);
  state.dragPatchBody = {
    quadIdx:   qi,
    startPhi:  p0.phi,
    startS:    p0.s,
    startPhi0: q.phi0,
    startPhi1: q.phi1,
    startS0:   q.s0,
    startS1:   q.s1,
  };
  canvas.style.cursor = "grabbing";
  draw();
  return true;
}

function _beginFlatPatchDragFromSquareIdx(squareIdx, sx, sy) {
  const sq = floatSquares[squareIdx];
  const qi = sq ? quadIdxById(sq.quadId) : -1;
  if (qi < 0) return false;

  const q = quads[qi];
  if (qi !== selectedQuad) {
    selectedQuad = qi;
    syncQuadList();
  }
  selectedSquare = -1;

  const p = screenToFlat(sx, sy);
  state.flatDrag = {
    mode:      "body",
    quadIdx:   qi,
    startPhi:  p.phi,
    startS:    p.s,
    startPhi0: q.phi0,
    startPhi1: q.phi1,
    startS0:   q.s0,
    startS1:   q.s1,
  };
  canvas.style.cursor = "grabbing";
  draw();
  return true;
}

/* ==========================================================================
   EVENTS
   ========================================================================== */

canvas.addEventListener("mousedown", (e) => {
  if (e.button !== 0) return;
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;

  /* ---- draw tool intercept ------------------------------------- */
  if (drawTool.active) {
    e.preventDefault();
    addDrawPoint(sx, sy);
    return;
  }

  /* Alt is the "grab the patch under the square" modifier.  When
     held, a click on a square targets the patch that square belongs
     to (identified by the square's quadId, so the pass-through works
     even when the square overhangs its patch).  A click that misses
     every editable square but lands on a MIRROR square does the
     same, via the mirror hit test.  See the module docstring,
     ALT PASS-THROUGH. */
  const passThrough = e.altKey;

  /* ---- cone band ------------------------------------------------ */
  if (sy < layout.dividerY) {

    /* The square hit test always runs, so we know what is under the
       cursor even when Alt is held.  It is the only reliable way to
       name the patch that a clicked square belongs to.  It only
       sees editable squares; the mirror fallback below covers the
       visual clones. */
    const sqHit = squareHitTest(sx, sy);

    if (passThrough) {
      let hit = sqHit;
      if (!hit) {
        /* Ordinary hit missed.  The cursor might be over a mirror
           square — one that the ordinary hit test can't see because
           it exists only inside the mirror state.  Try again with
           the mirror hit test; a hit there resolves to the same
           patch the original square would. */
        hit = squareMirrorHitTest(sx, sy);
      }
      if (hit && _beginConePatchDragFromSquareIdx(hit.squareIdx,
                                                  sx, sy)) {
        return;
      }
    }

    if (!passThrough && e.shiftKey) {
      const patchIdx = findPatchAtScreen(sx, sy);
      if (patchIdx >= 0) {
        const f = patchFrame(patchIdx);
        if (f) {
          const lc = screenToFrame(f, sx, sy);
          addSquareAt(patchIdx, lc.u, lc.v);
          if (patchIdx !== selectedQuad) {
            selectedQuad = patchIdx;
            syncQuadList();
          }
          draw();
          return;
        }
      }
    }

    if (!passThrough && sqHit) {
      const sq = floatSquares[sqHit.squareIdx];
      const qi = quadIdxById(sq.quadId);
      if (qi >= 0 && qi !== selectedQuad) {
        selectedQuad = qi;
        syncQuadList();
      }
      selectedSquare = sqHit.squareIdx;

      if (sqHit.kind === "rotate") {
        state.dragSquare = {
          mode: "rotate",
          squareIdx: sqHit.squareIdx,
          startTheta: sq.theta || 0,
        };
      } else if (sqHit.kind === "corner") {
        /* Capture the anchor (the diagonally-opposite corner's
           local position) at drag start, so the anchored (default)
           resize has it available without recomputing from a
           shape the drag has already reshaped.  See the module
           docstring, SHIFT-HELD CORNER RESIZE. */
        const anchor = squareAnchorCornerLocal(
          sq, sqHit.cornerIdx, effectiveConeDepth());
        state.dragSquare = {
          mode: "corner",
          squareIdx: sqHit.squareIdx,
          cornerIdx: sqHit.cornerIdx,
          anchorU: anchor ? anchor[0] : undefined,
          anchorV: anchor ? anchor[1] : undefined,
        };
      } else {
        const f = qi >= 0 ? patchFrame(qi) : null;
        const c = squareCenterLocal(sq);
        if (f && c) {
          const vMax = shapeVMax(sq);
          const vC   = sq.v * f.vLen;
          const pC   = shapePerspCentre(sq);
          const lc   = cursorToLocalShapeRelativeExactWith(
                           f, qi, vC, pC, vMax, sx, sy);
          state.dragSquare = {
            mode: "body",
            squareIdx: sqHit.squareIdx,
            startCursorU: lc.u,
            startCursorV: lc.v,
            startCenterU: c[0],
            startCenterV: c[1],
            startVc:      vC,
            startPc:      pC,
            startVMax:    vMax,
          };
        }
      }
      canvas.style.cursor = "grabbing";
      draw();
      return;
    }

    if (!passThrough && PATCH_SHAPE_EDIT_ENABLED) {
      const vHit = findQuadVertexAt(sx, sy);
      if (vHit) {
        if (vHit.quadIdx !== selectedQuad) {
          selectedQuad = vHit.quadIdx;
          syncQuadList();
        }
        selectedSquare = -1;
        state.dragQuadVertex = vHit;
        canvas.style.cursor = "grabbing";
        draw();
        return;
      }
    }

    const patchHit = findPatchAtScreen(sx, sy);
    if (patchHit >= 0) {
      const q = quads[patchHit];
      if (patchHit !== selectedQuad) {
        selectedQuad = patchHit;
        syncQuadList();
      }
      selectedSquare = -1;

      const [wx, wy] = s2w(sx, sy);
      const p0 = projectToConeSurface(wx, wy, (q.s0 + q.s1) / 2);
      state.dragPatchBody = {
        quadIdx:   patchHit,
        startPhi:  p0.phi,
        startS:    p0.s,
        startPhi0: q.phi0,
        startPhi1: q.phi1,
        startS0:   q.s0,
        startS1:   q.s1,
      };
      canvas.style.cursor = "grabbing";
      draw();
      return;
    }

    selectedSquare = -1;
    state.dragApex = {
      startSx: sx, startSy: sy,
      startAx: cone.ax, startAy: cone.ay,
    };
    canvas.style.cursor = "grabbing";
    return;
  }

  /* ---- flat band ------------------------------------------------ */

  /* Same shape as the cone band: run the flat square hit test first,
     then fall back to the mirror hit test when Alt is held.  Both
     bands route the pass-through into the same helper, so an alt+click
     on a mirror grabs the same patch the original square would. */
  const sqFlatHit = squareFlatHitTest(sx, sy);

  if (passThrough) {
    let hit = sqFlatHit;
    if (!hit) hit = squareFlatMirrorHitTest(sx, sy);
    if (hit && _beginFlatPatchDragFromSquareIdx(hit.squareIdx,
                                                sx, sy)) {
      return;
    }
  }

  if (!passThrough && sqFlatHit) {
    const sq = floatSquares[sqFlatHit.squareIdx];
    const qi = quadIdxById(sq.quadId);
    if (qi >= 0 && qi !== selectedQuad) {
      selectedQuad = qi;
      syncQuadList();
    }
    selectedSquare = sqFlatHit.squareIdx;

    if (sqFlatHit.kind === "rotate") {
      state.flatSquareDrag = {
        mode: "rotate",
        squareIdx: sqFlatHit.squareIdx,
        startTheta: sq.theta || 0,
      };
    } else if (sqFlatHit.kind === "corner") {
      /* Same anchor capture as the cone band, but with the flat
         band's depth multiplier.  See the module docstring,
         SHIFT-HELD CORNER RESIZE. */
      const anchor = squareAnchorCornerLocal(
        sq, sqFlatHit.cornerIdx, SHAPE_DEPTH_FLAT);
      state.flatSquareDrag = {
        mode: "corner",
        squareIdx: sqFlatHit.squareIdx,
        cornerIdx: sqFlatHit.cornerIdx,
        anchorU: anchor ? anchor[0] : undefined,
        anchorV: anchor ? anchor[1] : undefined,
      };
    } else {
      const lc = flatCursorToShapeLocal(sq, sx, sy);
      if (lc) {
        state.flatSquareDrag = {
          mode: "body",
          squareIdx: sqFlatHit.squareIdx,
          startCursorU: lc.u,
          startCursorV: lc.v,
          startCenterU: sq.u,
          startCenterV: sq.v,
        };
      }
    }
    canvas.style.cursor = "grabbing";
    draw();
    return;
  }

  const hHit = flatHitTest(sx, sy);
  if (!hHit) {
    selectedQuad = -1;
    selectedSquare = -1;
    syncQuadList();
    draw();
    return;
  }
  if (hHit.quadIdx !== selectedQuad) {
    selectedQuad = hHit.quadIdx;
    syncQuadList();
  }
  selectedSquare = -1;

  const p = screenToFlat(sx, sy);
  const q = quads[hHit.quadIdx];

  let flatDrag = {
    mode: "body",
    quadIdx:   hHit.quadIdx,
    startPhi:  p.phi,
    startS:    p.s,
    startPhi0: q.phi0,
    startPhi1: q.phi1,
    startS0:   q.s0,
    startS1:   q.s1,
  };

  if (!passThrough && PATCH_SHAPE_EDIT_ENABLED) {
    if (hHit.kind === "corner") {
      flatDrag = {
        mode: "corner",
        quadIdx: hHit.quadIdx,
        cornerIdx: hHit.cornerIdx,
      };
    } else if (hHit.kind === "edge") {
      flatDrag = {
        mode: "edge",
        quadIdx: hHit.quadIdx,
        edge: hHit.edge,
      };
    }
  }

  state.flatDrag = flatDrag;
  canvas.style.cursor = "grabbing";
  draw();
});

window.addEventListener("mousemove", (e) => {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  state.mouse.sx = sx; state.mouse.sy = sy;
  state.mouse.inside = (sx >= 0 && sy >= 0 &&
                        sx < window.innerWidth &&
                        sy < window.innerHeight);

  /* Draw tool: just track the hover position for the preview. */
  if (drawTool.active) {
    drawTool.hover = [sx, sy];
    draw();
    return;
  }

  if (state.dragQuadVertex) {
    const { quadIdx, cornerIdx } = state.dragQuadVertex;
    const q = quads[quadIdx];
    const corner = quadCorners(q)[cornerIdx];
    const [wx, wy] = s2w(sx, sy);
    const np = projectToConeSurface(wx, wy, corner.s);
    flatMoveCorner(q, cornerIdx, np.phi, np.s);
  } else if (state.dragSquare) {
    const ds = state.dragSquare;
    const sq = floatSquares[ds.squareIdx];
    if (!sq) {
      state.dragSquare = null;
    } else {
      const qi = quadIdxById(sq.quadId);
      const f = qi >= 0 ? patchFrame(qi) : null;
      if (f) {
        if (ds.mode === "body") {
          const lc = cursorToLocalShapeRelativeExactWith(
                       f, qi, ds.startVc, ds.startPc, ds.startVMax,
                       sx, sy);
          let dU = lc.u - ds.startCursorU;
          let dV = lc.v - ds.startCursorV;

          /* Shift held: constrain to the patch's V axis, which
             points from the patch's base midpoint toward the apex.
             Both directions along that axis remain free. */
          if (e.shiftKey) dU = 0;

          const maxDU = BODY_DRAG_MAX_DU * f.uLen;
          const maxDV = BODY_DRAG_MAX_DV * f.vLen;
          if (dU >  maxDU) dU =  maxDU;
          if (dU < -maxDU) dU = -maxDU;
          if (dV >  maxDV) dV =  maxDV;
          if (dV < -maxDV) dV = -maxDV;

          const newU = ds.startCenterU + dU;
          const newV = ds.startCenterV + dV;
          setClonePosition(sq, newU, newV);
        } else if (ds.mode === "corner") {
          /* Default: anchor the diagonally-opposite corner.
             Shift held: resize about the shape's centre.  The
             anchor was captured at mousedown; see the module
             docstring, SHIFT-HELD CORNER RESIZE. */
          const [wx, wy] = s2w(sx, sy);
          const useAnchor = !e.shiftKey && ds.anchorU !== undefined &&
                                           ds.anchorV !== undefined;
          resizeSquareFromCorner(
            sq, ds.cornerIdx, wx, wy,
            useAnchor ? ds.anchorU : undefined,
            useAnchor ? ds.anchorV : undefined);
        } else if (ds.mode === "rotate") {
          const [wx, wy] = s2w(sx, sy);
          rotateSquareToCursor(sq, wx, wy, e.shiftKey, ds.startTheta);
        }
      }
    }
  } else if (state.dragApex) {
    const dSx = sx - state.dragApex.startSx;
    const dSy = sy - state.dragApex.startSy;
    cone.ax = state.dragApex.startAx + dSx / view.scale;
    cone.ay = state.dragApex.startAy - dSy / view.scale;
    clampApex();
  } else if (state.dragPatchBody) {
    const dp = state.dragPatchBody;
    const q = quads[dp.quadIdx];
    if (!q) {
      state.dragPatchBody = null;
    } else {
      const [wx, wy] = s2w(sx, sy);
      const p = projectToConeSurface(wx, wy, dp.startS);
      applyPatchDragFromStart(q, dp, p.phi, p.s, e.shiftKey);
    }
  } else if (state.flatSquareDrag) {
    const fsd = state.flatSquareDrag;
    const sq = floatSquares[fsd.squareIdx];
    if (!sq) {
      state.flatSquareDrag = null;
    } else {
      if (fsd.mode === "body") {
        const lc = flatCursorToShapeLocal(sq, sx, sy);
        if (lc) {
          const qi = quadIdxById(sq.quadId);
          const f  = qi >= 0 ? patchFrame(qi) : null;
          if (f) {
            let dU = lc.u - fsd.startCursorU;
            let dV = lc.v - fsd.startCursorV;

            /* Shift held: constrain to the patch's V axis, which
               points from the patch's base midpoint toward the
               apex.  Both directions along that axis remain free. */
            if (e.shiftKey) dU = 0;

            const maxDU = BODY_DRAG_MAX_DU * f.uLen;
            const maxDV = BODY_DRAG_MAX_DV * f.vLen;
            if (dU >  maxDU) dU =  maxDU;
            if (dU < -maxDU) dU = -maxDU;
            if (dV >  maxDV) dV =  maxDV;
            if (dV < -maxDV) dV = -maxDV;

            const uWorld = fsd.startCenterU * f.uLen + dU;
            const vWorld = fsd.startCenterV * f.vLen + dV;
            setClonePosition(sq, uWorld, vWorld);
          }
        }
      } else if (fsd.mode === "corner") {
        /* Same anchored / centred split as the cone band, with the
           default roles flipped: no Shift anchors, Shift centres.
           See the module docstring, SHIFT-HELD CORNER RESIZE. */
        const useAnchor = !e.shiftKey && fsd.anchorU !== undefined &&
                                         fsd.anchorV !== undefined;
        flatResizeSquareFromCornerIdx(
          sq, sx, sy, fsd.cornerIdx,
          useAnchor ? fsd.anchorU : undefined,
          useAnchor ? fsd.anchorV : undefined);
      } else if (fsd.mode === "rotate") {
        flatRotateSquareToCursor(sq, sx, sy, e.shiftKey, fsd.startTheta);
      }
    }
  } else if (state.flatDrag) {
    const fd = state.flatDrag;
    const q  = quads[fd.quadIdx];
    const p  = screenToFlat(sx, sy);
    if (fd.mode === "corner") {
      flatMoveCorner(q, fd.cornerIdx, p.phi, p.s);
    } else if (fd.mode === "edge") {
      flatMoveEdge(q, fd.edge, p.phi, p.s);
    } else if (fd.mode === "body") {
      applyPatchDragFromStart(q, fd, p.phi, p.s, e.shiftKey);
    }
  }
  draw();
});

window.addEventListener("mouseup", () => {
  if (drawTool.active) return;
  if (state.dragQuadVertex || state.dragApex ||
      state.flatDrag || state.dragSquare || state.flatSquareDrag ||
      state.dragPatchBody) {
    state.dragQuadVertex = null;
    state.dragApex       = null;
    state.flatDrag       = null;
    state.dragSquare     = null;
    state.flatSquareDrag = null;
    state.dragPatchBody  = null;
    canvas.style.cursor  = "crosshair";
  }
});

canvas.addEventListener("wheel", (e) => {
  if (drawTool.active) return;
  const rect = canvas.getBoundingClientRect();
  const sy = e.clientY - rect.top;
  if (sy >= layout.dividerY) return;
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.08 : 1 / 1.08;
  cone.depth = Math.max(3, Math.min(40, cone.depth * factor));
  clampApex();
  syncPanelSliders();
  draw();
}, { passive: false });

canvas.style.cursor = "crosshair";

(function installShellControls() {
  const ui          = document.getElementById("ui");
  const restoreBtn  = document.getElementById("restoreBtn");
  const collapseBtn = document.getElementById("collapseBtn");

  const collapse = () => {
    ui.classList.add("collapsed");
    restoreBtn.classList.add("visible");
  };
  const restore = () => {
    ui.classList.remove("collapsed");
    restoreBtn.classList.remove("visible");
  };

  collapseBtn.addEventListener("click", collapse);
  restoreBtn.addEventListener("click", restore);

  window.addEventListener("keydown", (e) => {
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
    if (e.key === "h" || e.key === "H") {
      if (ui.classList.contains("collapsed")) restore();
      else                                     collapse();
    }
  });
})();

syncPanelSliders();
syncQuadList();
resize();
</script>
</body>
</html>
