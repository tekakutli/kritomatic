# =============================================================================
# capabilities.yaml — shipped menu of invocable capabilities.
# =============================================================================
# Maintained by the project. Users do NOT edit this file. The user-facing
# surface is ~/.config/kritomatic/bindings.yaml (see bindings.example.yaml).
#
# A capability is a name plus the command template to invoke it.
# Users reference capabilities by name from their bindings.yaml.
#
# `command[0] == "kritomatic"` is special: kritomatic-xremap expands it to
# the resolved `kritomatic` CLI invocation at render time. Users who have
# `kritomatic` on PATH get the bare command; users inside a checkout get
# the /usr/bin/env PYTHONPATH=... python .../main.py form. No text
# substitution is performed anywhere else — commands are used verbatim
# apart from that first-element expansion.
# =============================================================================

capabilities:

  # --- clipboard / Krita integration ---------------------------------------
  clipboard2krita:
    description: "Open the clipboard image as a new Krita document"
    command: ["python", "scripts/clipboard2krita.py"]

  clipboard2caption:
    description: "Caption the clipboard image and open the result in Emacs"
    command: ["python", "scripts/clipboard2caption.py"]

  clipboard2cropped:
    description: "Crop the clipboard image and store it"
    command: ["python", "scripts/clipboard2cropped.py"]

  viewer_toggle_default:
    description: "Toggle the default image viewer between Krita and imv"
    command: ["python", "scripts/viewer_toggle_default.py"]

  util_call_bash_function:
    description: "Source ~/.zshenv and call a bash function"
    command: ["python", "scripts/util_call_bash_function.py"]

  # --- Krita window management ---------------------------------------------
  toggle_detached:
    description: "Toggle detached canvas in Krita"
    command: ["kritomatic", "window", "toggle_detached"]

  focus_docker_palettedocker:
    description: "Focus the PaletteDocker"
    command: ["bash", "scripts/bash_commands/kritomatic_window_focus_docker_name_PaletteDocker.sh"]

  focus_docker_kislayerbox:
    description: "Focus the KisLayerBox"
    command: ["bash", "scripts/bash_commands/kritomatic_window_focus_docker_name_KisLayerBox.sh"]

  focus_docker_colorselectorng:
    description: "Focus the ColorSelectorNg"
    command: ["bash", "scripts/bash_commands/kritomatic_window_focus_docker_name_ColorSelectorNg.sh"]

  # --- Krita brush presets -------------------------------------------------
  brush_eraser_circle:
    description: "Brush preset: Eraser Circle"
    command: ["kritomatic", "brush", "set_brush_preset", "--value", "Eraser Circle"]

  brush_basic_1:
    description: "Brush preset: Basic-1"
    command: ["kritomatic", "brush", "set_brush_preset", "--value", "Basic-1"]

  brush_ink_3_gpen:
    description: "Brush preset: Ink-3 Gpen"
    command: ["kritomatic", "brush", "set_brush_preset", "--value", "Ink-3 Gpen"]

  # --- Krita layers --------------------------------------------------------
  layer_normal7:
    description: "Create a Normal7 blend layer (Normal mode)"
    command: ["kritomatic", "layer", "create_blend_layer", "--name", "Normal7", "--blend_mode", "Normal"]

  layer_overlay3:
    description: "Create an Overlay3 blend layer (Overlay mode)"
    command: ["kritomatic", "layer", "create_blend_layer", "--name", "Overlay3", "--blend_mode", "Overlay"]
