<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cone interior — viewer</title>
<style>
  html, body {
    margin:0; padding:0; height:100%; overflow:hidden;
    background:#0a0e14; color:#dce6f2;
    font-family: 'JetBrains Mono', 'Fira Code', 'Consolas',
                 'SF Mono', monospace;
  }

  #ui {
    position:absolute; top:12px; left:12px; z-index:10;
    background:#0b1018;
    padding:12px 14px;

    border-radius:3px;

    width:288px; box-sizing:border-box;

  #ui.collapsed { display:none; }

  #ui h3 {
    display:flex; align-items:center; gap:6px;
    margin:0 0 10px; padding:0 0 8px;
    border-bottom:1px solid #1e2836;
    font-size:11px; font-weight:700;
    letter-spacing:0.16em; text-transform:uppercase;
    color:#dce6f2;
  }

  #ui .field { display:flex; align-items:center; gap:8px; margin:7px 0; }
  #ui .field label {
    flex:0 0 78px;
    font-size:9px; color:#5a6774;
    letter-spacing:0.14em; text-transform:uppercase;
    font-weight:700;
  }
  #ui .field input[type=range] {
    flex:1 1 auto; min-width:0;
    accent-color:#00e5ff;
  }
  #ui .field input[type=checkbox] {
    flex:0 0 auto;
    margin-left:auto;
    accent-color:#00e5ff;
    cursor:pointer;
    width:14px; height:14px;
  }
  #ui .field .val {
    flex:0 0 44px;
    font-size:11px; color:#00e5ff;
    text-align:right; font-weight:700;
    font-variant-numeric: tabular-nums;
  }

  #ui .field input.scrubInput {
    flex:1 1 auto;
    min-width:0;
    background:transparent;
    border:0;
    border-bottom:1px solid #223040;
    color:#00e5ff;
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    font-variant-numeric: tabular-nums;
    text-align:right;
    padding:2px 4px;
    margin:0;
    outline:none;
    cursor:ew-resize;
    user-select:none;
    transition: border-color 0.1s ease;
  }
  #ui .field input.scrubInput:hover {
    border-bottom-color:#34445a;
  }
  #ui .field input.scrubInput:focus {
    border-bottom-color:#00e5ff;
    cursor:text;
    user-select:text;
  }
  #ui .field input.scrubInput:disabled {
    color:#3d4756;
    border-bottom-color:#1e2836;
    cursor:not-allowed;
  }

  #ui .field select {
    flex:1 1 auto;
    min-width:0;
    background:#0e1622;
    color:#b8c4d2;
    border:1px solid #223040;
    font-family:inherit;
    font-size:11px;
    padding:2px 4px;
    border-radius:2px;
    outline:none;
    cursor:pointer;
  }
  #ui .field select:hover {
    border-color:#34445a;
    color:#dce6f2;
  }
  #ui .field select:focus {
    border-color:#00e5ff;
  }

  #ui .row { display:flex; gap:6px; margin:6px 0; }
  #ui .row button { flex:1 1 auto; }

  #ui button {
    padding:5px 10px; cursor:pointer;
    border:1px solid #223040; background:transparent;
    color:#b8c4d2; border-radius:2px;
    font-family:inherit; font-size:10px;
    letter-spacing:0.10em; text-transform:uppercase;

  #ui button:hover {
    border-color:#34445a; color:#dce6f2;
    background:rgba(220,230,242,0.03);
  }
  #ui button:active { background:rgba(220,230,242,0.07); }

  /* The "Generate .kra" button carries a red accent — the export
     action reads as destructive-tier in the palette, distinct from
     the neutral grey/cyan sliders and the amber patch lists.  The
     resting text is deliberately bright (a light rose) so the
     label stays legible at 10px uppercase; the faint text-shadow
     adds body to the glyphs without creating a glow. */
  #ui button#generateKraBtn {
    border-color: rgba(255, 105, 125, 0.80);
    color: #ffb0bc;
    text-shadow: 0 0 4px rgba(255, 80, 100, 0.45);
  }
  #ui button#generateKraBtn:hover {
    border-color: rgba(255, 130, 150, 1.00);
    color: #ffd0d8;
    background: rgba(220, 90, 110, 0.12);
    text-shadow: 0 0 6px rgba(255, 80, 100, 0.65);

  #ui button#generateKraBtn:active {
    background: rgba(220, 90, 110, 0.20);
  }

  #ui hr { border:0; border-top:1px solid #1e2836; margin:10px 0; }

  .quadList {
    display:flex; flex-direction:column;
    gap:3px; margin:6px 0 0;
    max-height:160px; overflow-y:auto;
  }
  .quadList::-webkit-scrollbar { width:6px; }
  .quadList::-webkit-scrollbar-thumb {
    background:#1e2836; border-radius:3px;
  }
  .quadList .empty {
    font-size:10px; color:#3d4756;
    font-style:italic; padding:3px 4px;
  }
  .quadRow {
    display:flex; align-items:center; gap:7px;
    padding:3px 6px;
    border:1px solid #223040;
    border-radius:2px;
    cursor:pointer;
    font-size:10px;
    color:#a8b5c4;
    letter-spacing:0.04em;
    flex:0 0 auto;
  }
  .quadRow:hover {
    border-color:#34445a; color:#dce6f2;
    background:rgba(220,230,242,0.03);
  }
  .quadRow.selected {
    border-color:rgba(255,180,60,0.65);
    color:#ffc966;
    background:rgba(255,180,60,0.06);
  }
  .quadSwatch {
    width:9px; height:9px;
    background:rgba(255,200,90,0.55);
    border:1px solid rgba(255,200,90,0.85);
    border-radius:1px;
    flex:0 0 auto;
  }
  .quadRow.selected .quadSwatch {
    background:rgba(255,200,90,0.95);
    border-color:#ffc966;
  }
  .quadRow.squareRow.selected {
    border-color:rgba(120,220,255,0.65);
    color:#b8ecff;
    background:rgba(120,220,255,0.06);
  }
  .quadRow.squareRow .quadSwatch {
    background:rgba(120,220,255,0.55);
    border-color:rgba(140,225,255,0.85);
  }
  .quadRow.squareRow.selected .quadSwatch {
    background:rgba(180,240,255,0.95);
    border-color:#b8ecff;

  }

  .quadLabelInput {
    flex:1 1 auto;
    min-width:0;
    background:transparent;
    border:0;
    border-bottom:1px solid transparent;
    color:inherit;
    font-family:inherit;
    font-size:inherit;
    font-weight:700;
    letter-spacing:inherit;
    padding:0;
    margin:0;
    outline:none;
    overflow:hidden;
    text-overflow:ellipsis;
    transition: border-color 0.1s ease;

  .quadLabelInput:hover {
    border-bottom-color:#223040;
  }
  .quadLabelInput:focus {
    border-bottom-color:#00e5ff;

    padding:1px 6px !important;
    font-size:12px !important;
    line-height:1 !important;
    border-color:#4a2830 !important;
    color:#d48590 !important;
    letter-spacing:0 !important;

  .quadDel:hover {

    border-color:#7a3e4a !important;

    min-height:14px;

  #status.bad  { color:#d48590; }
  #status.warn { color:#ffe600; }

  canvas { display:block; touch-action:none; background:#0a0e14; }

  #restoreBtn {
    position:absolute; top:12px; left:12px; z-index:10;
    display:none;
    padding:6px 12px; cursor:pointer;
    border:1px solid #1e2836; background:#0b1018;

    font-size:10px; font-weight:700; letter-spacing:0.10em;

<div id="ui">
  <h3>Cone interior
    <button id="helpBtn" title="Help (opens a separate window)"
      style="margin-left:auto; width:auto; padding:0 6px;
             height:20px; font-size:11px; line-height:1;">?</button>
    <button id="collapseBtn" title="Collapse (H)"
      style="width:auto; padding:0 6px;
             height:20px; font-size:11px; line-height:1;">−</button>
  </h3>

  <div class="field">
    <label>Depth</label>
    <input type="range" id="depthSlider"
           min="3" max="40" step="0.5" value="15">
    <span class="val" id="depthVal">15.0</span>
  </div>
  <div class="field">
    <label>Half-angle</label>
    <input type="range" id="angleSlider"
           min="10" max="60" step="1" value="30">
    <span class="val" id="angleVal">30°</span>
  </div>
  <div class="field">
    <label>Rings</label>
    <input type="range" id="ringsSlider"
           min="4" max="40" step="1" value="14">
    <span class="val" id="ringsVal">14</span>
  </div>
  <div class="field">
    <label>Meridians</label>
    <input type="range" id="meridiansSlider"
           min="4" max="48" step="1" value="24">
    <span class="val" id="meridiansVal">24</span>
  </div>
  <div class="field">
    <label>Shape depth</label>
    <input type="range" id="shapeDepthSlider"
           min="0.05" max="2.00" step="0.05" value="1.00">
    <span class="val" id="shapeDepthVal">1.00</span>
  </div>

  <hr>

  <div class="field">
    <label>Patch &phi;</label>
    <input type="text" id="patchPhiVal" class="scrubInput"
           value="&#8212;" autocomplete="off" spellcheck="false"
           disabled>
  </div>
  <div class="field">
    <label>Patch s</label>
    <input type="text" id="patchSVal" class="scrubInput"
           value="&#8212;" autocomplete="off" spellcheck="false"
           disabled>
  </div>
  <div class="field">
    <label>Mirror</label>
    <input type="checkbox" id="patchMirror"

  <div class="field">
    <label>Mirror &ang;</label>
    <input type="text" id="patchMirrorAngle" class="scrubInput"

  <div class="field">
    <label>Mirror flip</label>
    <input type="checkbox" id="patchMirrorFlip"
           title="Negate the mirror's rotation so tilted shapes are

  </div>

  <hr>

  <div class="field">
    <label>Square W</label>
    <input type="text" id="squareWVal" class="scrubInput"
           value="&#8212;" autocomplete="off" spellcheck="false"
           disabled>
  </div>
  <div class="field">
    <label>Square H</label>
    <input type="text" id="squareHVal" class="scrubInput"

    <label>Slope</label>

  </div>
  <div class="field">
    <label>Visual bot.</label>
    <input type="checkbox" id="squareVisualBottom"
           title="When checked, the shape's text anchor and corner

  </div>

  <hr>

  <div class="field" style="margin-bottom:2px;">
    <label>Patches</label>

  </div>

  <div id="status">drag apex to tilt · scroll to change depth</div>

<button id="restoreBtn" title="Show panel (H)">☰ Show panel</button>

<canvas id="c"></canvas>
<script>
"use strict";

/* ==========================================================================
   CANVAS
   ========================================================================== */

const canvas = document.getElementById("c");
const ctx    = canvas.getContext("2d");
let dpr = window.devicePixelRatio || 1;

/* ==========================================================================
   LAYOUT
   ========================================================================== */

const layout = {
  coneH:     0,
  dividerY:  0,
  reservedY: 0,
  reservedH: 0,
};

/* ==========================================================================
   VIEW
   ========================================================================== */

const view = {
  scale: 20, tx: 0, ty: 0,
  zoom: 1, panX: 0, panY: 0,
};

function w2s(x, y) { return [x * view.scale + view.tx,
                             -y * view.scale + view.ty]; }
function s2w(sx, sy) { return [(sx - view.tx) / view.scale,
                               -(sy - view.ty) / view.scale]; }

/* ==========================================================================
   CONE
   ========================================================================== */

const cone = {
  ax: 0, ay: 0,
  depth: 15,
  halfAngle: Math.PI / 6,
  ringCount: 14,
  meridianCount: 24,
};

function clampApex() {
  const R = cone.depth * Math.tan(cone.halfAngle);
  const maxR = R * 0.98;
  const dr = Math.hypot(cone.ax, cone.ay);
  if (dr > maxR && dr > 1e-9) {
    const s = maxR / dr;
    cone.ax *= s;
    cone.ay *= s;
  }
}

function coneR() { return cone.depth * Math.tan(cone.halfAngle); }

function surfacePoint(phi, s) {
  const R = coneR();
  const r = (1 - s) * R;
  return [s * cone.ax + r * Math.cos(phi),
          s * cone.ay + r * Math.sin(phi)];
}

/* ==========================================================================
   PATCH MODEL
   ==========================================================================
   Every patch:  [phi0, phi1] × [s0, s1].  Corner order:

       0   (phi0, s1)   top-left    near apex
       1   (phi1, s1)   top-right   near apex
       2   (phi1, s0)   bottom-right near base
       3   (phi0, s0)   bottom-left  near base

   The lateral edges lie on meridians; every meridian ends at the
   apex, so both lateral edges point at the peak.  S_MAX < 1 keeps a
   patch from collapsing into the apex. */

const S_MIN = 0.00;
const S_MAX = 0.90;

/* Default patch dimensions.  These are the parameters the "+ Patch"
   button uses when it creates a patch, and the parameters both draw
   modes use when they size the patch they create.  The three are
   kept in one place so they cannot drift apart. */

const DEFAULT_PATCH_PHI_SPAN = 0.72;
const DEFAULT_PATCH_S_SPAN   = 0.50;
const DEFAULT_PATCH_S_CENTER = 0.47;

/* Shape editing of patches is locked away.  Set true to re-enable
   corner / edge / body dragging on patches in either band; the
   underlying drag math is unaffected by this flag and would take
   over on the very next click. */
const PATCH_SHAPE_EDIT_ENABLED = false;

const quads = [];
let nextQuadId = 1;
let selectedQuad = -1;

function quadCorners(q) {
  return [
    { phi: q.phi0, s: q.s1 },
    { phi: q.phi1, s: q.s1 },
    { phi: q.phi1, s: q.s0 },
    { phi: q.phi0, s: q.s0 },
  ];
}

function addQuad() {
  const id  = nextQuadId++;
  const idx = quads.length;
  const halfPhi = DEFAULT_PATCH_PHI_SPAN / 2;
  const halfS   = DEFAULT_PATCH_S_SPAN   / 2;

  let phiCenter = Math.PI / 2 + idx * 0.70;
  phiCenter = ((phiCenter % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  if (phiCenter - halfPhi < 0)                phiCenter = halfPhi;
  if (phiCenter + halfPhi > 2 * Math.PI)      phiCenter = 2 * Math.PI - halfPhi;

  quads.push({
    id, name: "Q" + id,
    phi0: phiCenter - halfPhi,
    phi1: phiCenter + halfPhi,
    s0: DEFAULT_PATCH_S_CENTER - halfS,
    s1: DEFAULT_PATCH_S_CENTER + halfS,
    mirror: false,
    mirrorAngle: Math.PI,   // NEW: angular offset around the cone
    mirrorFlip: true,       // NEW: negate θ so the mirror isn't 180°-rotated
  });
  selectedQuad = quads.length - 1;
  syncQuadList();
  draw();
}

/* Duplicate a patch, together with every square that lives on it.
   The clone gets a fresh id and default name; its squares likewise.
   The clone is placed one patch-width to the right in φ so it does
   not sit on top of the source.  φ wraps harmlessly, so pushing past
   2π is fine.  Square (u, v, scaleU, scaleV, θ, slope, visualBottom)
   are copied as-is, so the clone's squares sit in the same spot on
   the new patch as they did on the old, with the same per-square
   text-anchor mode. */
function cloneQuad(idx) {
  if (idx < 0 || idx >= quads.length) return;
  const src = quads[idx];
  const id  = nextQuadId++;
  const dPhi = src.phi1 - src.phi0;

  quads.push({
    id,
    name: "Q" + id,
    phi0: src.phi0 + dPhi,
    phi1: src.phi1 + dPhi,
    s0:   src.s0,
    s1:   src.s1,
    mirror: !!src.mirror,
    mirrorAngle: (typeof src.mirrorAngle === "number")
                   ? src.mirrorAngle : Math.PI,
    mirrorFlip:  src.mirrorFlip !== false,
  });

  for (let i = 0; i < floatSquares.length; i++) {
    const sq = floatSquares[i];
    if (sq.quadId !== src.id) continue;
    const newSqId = nextSquareId++;
    floatSquares.push({
      id:     newSqId,
      name:   "S" + newSqId,
      quadId: id,
      u:      sq.u,
      v:      sq.v,
      scaleU: sq.scaleU,
      scaleV: sq.scaleV,
      theta:  sq.theta || 0,
      slope:  sq.slope || 0,
      visualBottom: !!sq.visualBottom,
    });
  }

  selectedQuad   = quads.length - 1;
  selectedSquare = -1;
  syncQuadList();
  draw();
}

function deleteQuad(idx) {
  if (idx < 0 || idx >= quads.length) return;
  const removed = quads.splice(idx, 1)[0];
  if (typeof deleteSquaresForQuad === "function") {
    deleteSquaresForQuad(removed.id);
  }
  if (selectedQuad >= quads.length) selectedQuad = quads.length - 1;
  syncQuadList();
  draw();
}

/* ==========================================================================
   INVERSE PROJECTION — cursor world point → (phi, s) on the surface
   ==========================================================================
   For fixed s, the closest surface point to T is on the ring at that
   s, with squared distance expressed as a quadratic in s:

       A·s² + B·s + C = 0
       A = |apex|² − R²
       B = −2 · (apex·T − R²)
       C = |T|² − R²

   Two real roots: the one nearer the caller's current s wins, so a
   drag stays on one branch of the surface.  No real root: forty-step
   sample over [S_MIN, S_MAX]. */
function projectToConeSurface(wx, wy, currentS) {
  const Px = cone.ax, Py = cone.ay;
  const R  = coneR();
  const R2 = R * R;
  const p2 = Px * Px + Py * Py;
  const t2 = wx * wx + wy * wy;
  const pt = Px * wx + Py * wy;

  const A = p2 - R2;
  const B = -2 * (pt - R2);
  const C = t2 - R2;

  const roots = [];
  if (Math.abs(A) < 1e-6) {
    if (Math.abs(B) > 1e-9) roots.push(-C / B);
  } else {
    const disc = B * B - 4 * A * C;
    if (disc >= 0) {
      const sq = Math.sqrt(disc);
      roots.push((-B - sq) / (2 * A));
      roots.push((-B + sq) / (2 * A));
    }
  }

  let bestS = null, bestDelta = Infinity;
  for (const s of roots) {
    if (s < S_MIN - 0.01 || s > S_MAX + 0.01) continue;
    const c = Math.max(S_MIN, Math.min(S_MAX, s));
    const d = Math.abs(c - currentS);
    if (d < bestDelta) { bestDelta = d; bestS = c; }
  }

  if (bestS === null) {
    bestDelta = Infinity;
    for (let i = 0; i <= 40; i++) {
      const s = S_MIN + (S_MAX - S_MIN) * i / 40;
      const cx = s * Px, cy = s * Py;
      const r  = (1 - s) * R;
      const d  = Math.abs(Math.hypot(wx - cx, wy - cy) - r);
      if (d < bestDelta) { bestDelta = d; bestS = s; }
    }
    if (bestS === null) bestS = Math.max(S_MIN, Math.min(S_MAX, currentS));
  }

  const cx = bestS * Px, cy = bestS * Py;
  const dx = wx - cx, dy = wy - cy;
  const phi = (Math.abs(dx) < 1e-9 && Math.abs(dy) < 1e-9)
              ? 0 : Math.atan2(dy, dx);
  return { phi, s: bestS };
}

/* ==========================================================================
   TRANSIENT STATE
   ==========================================================================
   Five drag modes, mutually exclusive at any moment:

       dragApex        apex tilt / depth pull from the cone band
       dragQuadVertex  a patch's corner, either band (gated)
       dragSquare      a floating square from the cone band
       flatDrag        a patch's corner/edge/body from the flat band
                       (gated)
       flatSquareDrag  a floating square from the flat band */

const state = {
  dragApex:       null,
  dragQuadVertex: null,
  dragSquare:     null,
  flatDrag:       null,
  flatSquareDrag: null,
  dragPatchBody:  null,
  mouse: { sx: 0, sy: 0, inside: false },
};

/* ==========================================================================
   DRAW TOOL
   ==========================================================================
   The Draw Quad workflow.  Toggled by the panel button; while active,
   the canvas mousedown handler diverts clicks into addDrawPoint
   instead of the usual hit-test chain.  On the fourth click
   finishDrawTool runs, which fits a patch + rectangle and clears the
   transient points.

   The fit mode and the rotation lock are both read from the panel at
   finish time, so either can be changed mid-draw. */

const drawTool = {
  active: false,
  points: [],
  hover: null,
};

function toggleDrawTool() {
  drawTool.active = !drawTool.active;
  drawTool.points = [];
  drawTool.hover = null;
  const btn = document.getElementById("drawQuadBtn");
  if (btn) {
    btn.textContent = drawTool.active ? "Cancel Draw" : "Draw Quad";
    btn.style.borderColor = drawTool.active ? "#00e5ff" : "";
    btn.style.color = drawTool.active ? "#00e5ff" : "";
  }
  canvas.style.cursor = "crosshair";
  draw();
}

function cancelDrawTool() {
  drawTool.active = false;
  drawTool.points = [];
  drawTool.hover = null;
  const btn = document.getElementById("drawQuadBtn");
  if (btn) {
    btn.textContent = "Draw Quad";
    btn.style.borderColor = "";
    btn.style.color = "";
  }
  canvas.style.cursor = "crosshair";
  draw();
}

function addDrawPoint(sx, sy) {
  if (!drawTool.active) return;
  if (drawTool.points.length >= 4) return;
  drawTool.points.push([sx, sy]);
  if (drawTool.points.length === 4) {
    finishDrawTool();
  } else {
    draw();
  }
}

function finishDrawTool() {
  if (drawTool.points.length !== 4) return;
  const pts = drawTool.points.slice();

  const modeEl   = document.getElementById("drawFitMode");
  const noRotEl  = document.getElementById("drawNoRotate");
  const mode     = modeEl  ? modeEl.value       : "shape-first";
  const noRotate = noRotEl ? !!noRotEl.checked  : false;

  const result = _fitPatchAndShape(pts, mode, noRotate);
  if (!result) {
    flashStatus("Could not fit patch/shape", "bad");
    cancelDrawTool();
    return;
  }

  const tag = (mode === "shape-first") ? "shape\u2192patch" : "patch\u2192shape";
  const rot = noRotate ? " \u00B7 axis-aligned" : "";
  flashStatus(tag + rot + ":  " + result.patch.name
              + " + " + result.shape.name, "ok");
  cancelDrawTool();
  syncQuadList();
  draw();
}

/* ==========================================================================
   LEAST-SQUARES RECTANGLE FIT
   ==========================================================================
   Given four local (u, v) points and an assignment of each to one of
   the reference rectangle's corners (signs = TL, TR, BR, BL as
   [sx, sy] pairs), recover the centre, rotation, and two reference
   half-extents in closed form.  Exact when the assigned points form
   a rotated rectangle under the patch's aspect scaling.

   When noRotate is true, the rotation is forced to zero and only the
   centre and the two half-extents are fitted.  The half-extents are
   then the signed projections of the points onto the patch's U and
   V axes, divided by the aspect scales — the closed-form LS solution
   for an axis-aligned rectangle.  This makes the shape read as
   north/south aligned in the flat view: its edges are parallel to
   the φ and s axes there. */

function _fitShapeFromFourPoints(localPts, f, signs, noRotate) {
  const cx = localPts.reduce((a, p) => a + p[0], 0) / 4;
  const cy = localPts.reduce((a, p) => a + p[1], 0) / 4;

  let a = 0, b = 0, c = 0, d = 0;
  for (let i = 0; i < 4; i++) {
    const sx = signs[i][0], sy = signs[i][1];
    const ox = localPts[i][0] - cx;
    const oy = localPts[i][1] - cy;
    a += ox * sx;
    b += ox * sy;
    c += oy * sx;
    d += oy * sy;
  }
  a /= 4; b /= 4; c /= 4; d /= 4;

  const Ku = f.uLen / SHAPE_U_REF;
  const Kv = f.vLen / SHAPE_V_REF;

  if (noRotate) {
    const refHW = Math.abs(a) / Ku;
    const refHH = Math.abs(d) / Kv;
    if (refHW < 1e-6 || refHH < 1e-6) return null;
    return {
      u: cx / f.uLen,
      v: cy / f.vLen,
      theta: 0,
      scaleU: refHW / (SHAPE_REL_SIZE / 2),
      scaleV: refHH / (SHAPE_REL_SIZE / 2),
    };
  }

  const refHW = Math.sqrt((a * a) / (Ku * Ku) + (c * c) / (Kv * Kv));
  const refHH = Math.sqrt((b * b) / (Ku * Ku) + (d * d) / (Kv * Kv));
  if (refHW < 1e-6 || refHH < 1e-6) return null;

  const cosT = a / (Ku * refHW);
  const sinT = c / (Kv * refHW);
  const theta = Math.atan2(sinT, cosT);

  return {
    u: cx / f.uLen,
    v: cy / f.vLen,
    theta: theta,
    scaleU: refHW / (SHAPE_REL_SIZE / 2),
    scaleV: refHH / (SHAPE_REL_SIZE / 2),
  };
}

/* Local (u, v) of a corner of the fitted shape, given the fit
   parameters and the reference-frame sign of that corner. */
function _shapeLocalCorner(fit, sign, f) {
  const Ku = f.uLen / SHAPE_U_REF;
  const Kv = f.vLen / SHAPE_V_REF;
  const refHW = fit.scaleU * SHAPE_REL_SIZE / 2;
  const refHH = fit.scaleV * SHAPE_REL_SIZE / 2;
  const du = sign[0] * refHW;
  const dv = sign[1] * refHH;
  const cosT = Math.cos(fit.theta);
  const sinT = Math.sin(fit.theta);
  const duR = du * cosT - dv * sinT;
  const dvR = du * sinT + dv * cosT;
  return [fit.u * f.uLen + duR * Ku, fit.v * f.vLen + dvR * Kv];
}

/* Try all 24 assignments of the four local points to the four
   reference corners; return the fit whose rectangle best reproduces
   the assigned points, in local (u, v). */
function _bestRectangleFit(localPts, f, noRotate) {
  const signs = [[-1, 1], [1, 1], [1, -1], [-1, -1]];
  let best = null;

  function* permutations(arr, k = 0) {
    if (k === arr.length) { yield arr.slice(); return; }
    for (let i = k; i < arr.length; i++) {
      [arr[k], arr[i]] = [arr[i], arr[k]];
      yield* permutations(arr, k + 1);
      [arr[k], arr[i]] = [arr[i], arr[k]];
    }
  }

  for (const perm of permutations([0, 1, 2, 3])) {
    const assigned = perm.map(i => localPts[i]);
    const fit = _fitShapeFromFourPoints(assigned, f, signs, noRotate);
    if (!fit) continue;

    let err = 0;
    for (let i = 0; i < 4; i++) {
      const pred = _shapeLocalCorner(fit, signs[i], f);
      err += Math.hypot(pred[0] - assigned[i][0],
                        pred[1] - assigned[i][1]);
    }
    if (!best || err < best.err) best = { fit, err };
  }
  return best;
}

/* ==========================================================================
   DRAW TOOL — PROJECT CLICKS TO (φ, s)
   ==========================================================================
   Returns { params: [[φ, s] × 4], isFlat: bool } or null on a mixed-
   band click sequence.  The φ coordinates are unwrapped around the
   first point so a click sequence crossing the seam does not blow up
   the bounding box into a full-turn span. */

function _projectDrawPoints(screenPts) {
  const isFlat = screenPts.every(p => p[1] >= layout.dividerY);
  const isCone = screenPts.every(p => p[1] <  layout.dividerY);
  if (!isFlat && !isCone) return null;

  const params = screenPts.map(([sx, sy]) => {
    if (isFlat) {
      const p = screenToFlat(sx, sy);
      return [p.phi, p.s];
    } else {
      const [wx, wy] = s2w(sx, sy);
      const p = projectToConeSurface(wx, wy, 0.5);
      return [p.phi, p.s];
    }
  });

  let basePhi = params[0][0];
  for (let i = 1; i < 4; i++) {
    while (params[i][0] - basePhi >  Math.PI) params[i][0] -= 2 * Math.PI;
    while (params[i][0] - basePhi < -Math.PI) params[i][0] += 2 * Math.PI;
  }

  return { params, isFlat };
}

/* ==========================================================================
   DRAW TOOL — BUILD A DEFAULT-SIZED PATCH AROUND A CENTRE
   ==========================================================================
   Both fit modes produce a patch of DEFAULT_PATCH_PHI_SPAN ×
   DEFAULT_PATCH_S_SPAN, centred on a (φ, s) point the mode computed.
   The s-bounds are clamped to [FLAT_S_MIN, FLAT_S_MAX] the same way
   the panel's patch-move does: when one edge hits a wall, the whole
   interval slides and the other edge advances.  Returns
   { phi0, phi1, s0, s1 }. */

function _defaultPatchAround(phiC, sC) {
  const halfPhi = DEFAULT_PATCH_PHI_SPAN / 2;
  const halfS   = DEFAULT_PATCH_S_SPAN   / 2;

  let p0 = phiC - halfPhi;
  let p1 = phiC + halfPhi;
  let s0 = sC - halfS;
  let s1 = sC + halfS;

  if (s0 < FLAT_S_MIN) { s1 += FLAT_S_MIN - s0; s0 = FLAT_S_MIN; }
  if (s1 > FLAT_S_MAX) { s0 -= s1 - FLAT_S_MAX; s1 = FLAT_S_MAX; }
  if (s0 < FLAT_S_MIN) s0 = FLAT_S_MIN;

  return { phi0: p0, phi1: p1, s0, s1 };
}

/* ==========================================================================
   DRAW TOOL — CREATE PATCH + SHAPE FROM PARAMS
   ==========================================================================
   Common tail for both fit modes.  Given the four (φ, s) points, the
   desired patch bounds, and the rotation lock flag, push the patch
   and shape onto the model.  Returns { patch, shape } or null. */

function _pushPatchAndShapeFromParams(params, phiMin, phiMax, sMin, sMax,
                                      noRotate) {
  const id = nextQuadId++;
  const q = {
    id, name: "Q" + id,
    phi0: phiMin, phi1: phiMax,
    s0:   sMin,   s1:   sMax,
    mirror: false,
  };
  quads.push(q);
  const qi = quads.length - 1;
  selectedQuad = qi;

  const f = patchFrame(qi);
  if (!f) { quads.pop(); return null; }

  const phiC = (q.phi0 + q.phi1) / 2;
  const sC   = (q.s0   + q.s1)   / 2;
  const dPhi = q.phi1 - q.phi0;
  const dS   = q.s1   - q.s0;

  const localPts = params.map(([phi, s]) => {
    const uHat = (phi - phiC) / dPhi;
    const vHat = (s   - sC)   / dS;
    return [uHat * f.uLen, vHat * f.vLen];
  });

  const best = _bestRectangleFit(localPts, f, noRotate);
  if (!best) { quads.pop(); return null; }

  const fit = best.fit;
  const sqId = nextSquareId++;
  const sq = {
    id: sqId,
    name: "S" + sqId,
    quadId: q.id,
    u: fit.u,
    v: fit.v,
    scaleU: fit.scaleU,
    scaleV: fit.scaleV,
    theta: fit.theta,
    slope: 0,
  };
  clampShapeScales(sq);
  floatSquares.push(sq);
  selectedSquare = floatSquares.length - 1;

  return { patch: q, shape: sq };
}

/* ==========================================================================
   DRAW TOOL — MODE 1: PATCH-FIRST
   ==========================================================================
   The four clicks are projected to (φ, s); their centroid defines
   the patch's centre.  A patch of the default size is created,
   centred on that centroid, with the s-bounds sliding off the sheet
   walls the same way the panel's patch-move does.  The shape is
   fitted by least squares to the clicks mapped into that patch's
   local (u, v) frame.

   This is the mode that keeps the patch's plane where the clicks
   put it (their centroid) without letting the patch's size follow
   the clicks' spread.  The patch is always DEFAULT_PATCH_PHI_SPAN ×
   DEFAULT_PATCH_S_SPAN, regardless of how wide or narrow the four
   points were. */

function _fitPatchAndShape_patchFirst(screenPts, noRotate) {
  if (screenPts.length !== 4) return null;
  const proj = _projectDrawPoints(screenPts);
  if (!proj) {
    flashStatus("Draw all four points in one band", "warn");
    return null;
  }
  const params = proj.params;

  const phis = params.map(p => p[0]);
  const ss   = params.map(p => p[1]);

  const phiC = (Math.min(...phis) + Math.max(...phis)) / 2;
  const sC   = (Math.min(...ss)   + Math.max(...ss))   / 2;

  const bounds = _defaultPatchAround(phiC, sC);

  return _pushPatchAndShapeFromParams(
    params, bounds.phi0, bounds.phi1, bounds.s0, bounds.s1, noRotate
  );
}

/* ==========================================================================
   DRAW TOOL — MODE 2: SHAPE-FIRST  (default)
   ==========================================================================
   Run the patch-first fit as a preliminary to get a shape.  Then:

     1.  Compute the shape's (φ, s) footprint via squareFlatCorners,
         which is the correspondence the flat view draws with.
     2.  Create a patch of the SAME SIZE as the "+ Patch" button
         produces — DEFAULT_PATCH_PHI_SPAN × DEFAULT_PATCH_S_SPAN —
         centred on the footprint's (φ, s) centroid.
     3.  Re-fit the shape in the new patch's frame, using the
         footprint corners as the fit target, so the shape's (φ, s)
         footprint is preserved.

   The visible result: a default-sized patch at the drawn location,
   with the fitted rectangle sitting at its centre.  The patch's size
   does not depend on how wide or narrow the four clicks were.

   Step 3 is a re-projection through a different frame, so the final
   shape is the least-squares rectangle in the new frame that best
   matches the old footprint.  Because the new patch differs from
   the preliminary one only by its frame's origin and scale, and the
   correspondence (u, v) → (φ, s) is linear, the refit is exact when
   the original footprint was already a rectangle under that
   correspondence.

   Both the preliminary fit and the refit are performed with the
   same noRotate flag, so when the rotation lock is on the final
   shape is axis-aligned in the flat view: its edges run parallel to
   the φ and s axes. */

function _fitPatchAndShape_shapeFirst(screenPts, noRotate) {
  const prelim = _fitPatchAndShape_patchFirst(screenPts, noRotate);
  if (!prelim) return null;
  const P = prelim.patch;
  const S = prelim.shape;

  const qi = quadIdxById(P.id);
  if (qi < 0) return prelim;

  /* Snapshot the shape's (φ, s) footprint BEFORE the patch moves;
     after P is resized, squareFlatCorners would return different
     values because it reads the patch's frame. */
  const corners = squareFlatCorners(S);
  if (!corners || corners.length < 4) return prelim;

  let phiMin = Infinity, phiMax = -Infinity;
  let sMin   = Infinity, sMax   = -Infinity;
  for (const [phi, s] of corners) {
    phiMin = Math.min(phiMin, phi);
    phiMax = Math.max(phiMax, phi);
    sMin   = Math.min(sMin, s);
    sMax   = Math.max(sMax, s);
  }

  const phiC = (phiMin + phiMax) / 2;
  const sC   = (sMin   + sMax)   / 2;

  const bounds = _defaultPatchAround(phiC, sC);
  P.phi0 = bounds.phi0;
  P.phi1 = bounds.phi1;
  P.s0   = bounds.s0;
  P.s1   = bounds.s1;

  const f1 = patchFrame(qi);
  if (!f1) return prelim;

  /* Map the snapshotted (φ, s) corners into the new patch's local
     (u, v).  This is the same linear correspondence used by
     squareFlatCorners, applied to the shape's old footprint. */
  const phiC1 = (P.phi0 + P.phi1) / 2;
  const sC1   = (P.s0   + P.s1)   / 2;
  const dPhi1 = P.phi1 - P.phi0;
  const dS1   = P.s1   - P.s0;

  const newLocalPts = corners.map(([phi, s]) => {
    const uHat = (phi - phiC1) / dPhi1;
    const vHat = (s   - sC1)   / dS1;
    return [uHat * f1.uLen, vHat * f1.vLen];
  });

  const best = _bestRectangleFit(newLocalPts, f1, noRotate);
  if (!best) return prelim;

  const fit = best.fit;
  S.u      = fit.u;
  S.v      = fit.v;
  S.theta  = fit.theta;
  S.scaleU = fit.scaleU;
  S.scaleV = fit.scaleV;
  clampShapeScales(S);

  return { patch: P, shape: S };
}

/* ==========================================================================
   DRAW TOOL — MODE DISPATCHER
   ========================================================================== */

function _fitPatchAndShape(screenPts, mode, noRotate) {
  if (screenPts.length !== 4) return null;
  if (mode === "patch-first") {
    return _fitPatchAndShape_patchFirst(screenPts, noRotate);
  }
  return _fitPatchAndShape_shapeFirst(screenPts, noRotate);
}

/* ==========================================================================
   RESIZE / FIT
   ========================================================================== */

function resize() {
  dpr = window.devicePixelRatio || 1;
  const cw = window.innerWidth;
  const ch = window.innerHeight;

  canvas.width  = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width  = cw + "px";
  canvas.style.height = ch + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  layout.coneH     = Math.round(ch * 0.58);
  layout.dividerY  = layout.coneH;
  layout.reservedY = layout.coneH + 4;
  layout.reservedH = ch - layout.reservedY;

  fitView();
  draw();
}
window.addEventListener("resize", resize);

function fitView() {
  view.scale = 20 * view.zoom;
  view.tx = window.innerWidth / 2 + view.panX;
  view.ty = layout.coneH / 2 + view.panY;
}

function resetView() {
  view.zoom = 1; view.panX = 0; view.panY = 0;
  cone.ax = 0; cone.ay = 0;
  cone.depth = 15;
  cone.halfAngle = Math.PI / 6;
  cone.ringCount = 14;
  cone.meridianCount = 24;
  syncPanelSliders();
  fitView();
  draw();
}

function drawConeView() {
  const cw = window.innerWidth;
  const ch = layout.coneH;

  const R_world = cone.depth * Math.tan(cone.halfAngle);
  const [Bx, By] = w2s(0, 0);
  const [Ax, Ay] = w2s(cone.ax, cone.ay);
  const Rs = R_world * view.scale;

  /* depth gradient */
  const apexDist  = Math.hypot(Ax - Bx, Ay - By);
  const gradientR = Math.max(apexDist + Rs, 40);
  const bg = ctx.createRadialGradient(Ax, Ay, 0, Ax, Ay, gradientR);
  bg.addColorStop(0.00, "#05080c");
  bg.addColorStop(0.32, "#070c12");
  bg.addColorStop(0.68, "#0a1018");
  bg.addColorStop(1.00, "#0e1622");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, cw, ch);

  /* meridians */
  const M = cone.meridianCount;
  ctx.lineCap = "round";
  for (let i = 0; i < M; i++) {
    const phi = i * 2 * Math.PI / M;
    const [ex, ey] = w2s(R_world * Math.cos(phi),
                         R_world * Math.sin(phi));
    const lg = ctx.createLinearGradient(Ax, Ay, ex, ey);
    lg.addColorStop(0.00, "rgba(0, 229, 255, 0.00)");
    lg.addColorStop(0.10, "rgba(0, 229, 255, 0.09)");
    lg.addColorStop(0.60, "rgba(0, 229, 255, 0.20)");
    lg.addColorStop(1.00, "rgba(0, 229, 255, 0.40)");
    ctx.beginPath(); ctx.moveTo(Ax, Ay); ctx.lineTo(ex, ey);
    ctx.strokeStyle = lg; ctx.lineWidth = 0.9; ctx.stroke();
  }

  /* rings */
  const N = cone.ringCount;
  for (let k = 0; k <= N; k++) {
    const s = k / N;
    const [cx, cy] = w2s(s * cone.ax, s * cone.ay);
    const rs = (1 - s) * R_world * view.scale;
    if (rs < 0.5) continue;
    const u = 1 - s;
    const alpha = 0.10 + 0.55 * u * u;
    ctx.beginPath(); ctx.arc(cx, cy, rs, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(0, 229, 255, " + alpha.toFixed(3) + ")";
    ctx.lineWidth = (k === 0) ? 2.0 : 0.9;
    ctx.stroke();
  }

  /* axis */
  if (apexDist > 6) {
    ctx.save();
    ctx.setLineDash([5, 4]);
    ctx.strokeStyle = "rgba(255, 43, 214, 0.45)";
    ctx.lineWidth = 1.0;
    ctx.beginPath(); ctx.moveTo(Bx, By); ctx.lineTo(Ax, Ay); ctx.stroke();
    ctx.restore();
  }

  /* base direction tick */
  if (Rs > 20) {
    ctx.beginPath();
    ctx.arc(Bx, By, Rs, -Math.PI / 2 - 0.15, -Math.PI / 2 + 0.15);
    ctx.strokeStyle = "rgba(255, 43, 214, 0.9)";
    ctx.lineWidth = 2.4; ctx.stroke();
  }

  /* base centre dot */
  ctx.beginPath(); ctx.arc(Bx, By, 2.2, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(220, 230, 242, 0.55)"; ctx.fill();

  /* patches — unselected first, selected on top */
  for (let i = 0; i < quads.length; i++) {
    if (i === selectedQuad) continue;
    drawQuadPatch(quads[i], false);
  }
  if (selectedQuad >= 0 && selectedQuad < quads.length) {
    drawQuadPatch(quads[selectedQuad], true);
  }

  /* floating shapes on the patches' planes */
  drawFloatSquares();

  /* apex marker */
  const haloR = 22;
  const halo = ctx.createRadialGradient(Ax, Ay, 0, Ax, Ay, haloR);
  halo.addColorStop(0.0, "rgba(255, 230, 0, 0.34)");
  halo.addColorStop(1.0, "rgba(255, 230, 0, 0.00)");
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(Ax, Ay, haloR, 0, Math.PI * 2); ctx.fill();

  ctx.beginPath(); ctx.arc(Ax, Ay, 5.5, 0, Math.PI * 2);
  ctx.fillStyle = "#ffe600"; ctx.fill();
  ctx.strokeStyle = "#0a0e14"; ctx.lineWidth = 2; ctx.stroke();

  /* corner caption */
  ctx.save();
  ctx.font = "700 10px 'JetBrains Mono', 'Fira Code', monospace";
  ctx.fillStyle = "#5a6774";
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  const halfDeg = Math.round(cone.halfAngle * 180 / Math.PI);
  const tiltDeg = Math.atan2(Math.hypot(cone.ax, cone.ay), cone.depth)
                  * 180 / Math.PI;
  ctx.fillText(
    "APEX (" + cone.ax.toFixed(1) + ", " + cone.ay.toFixed(1) + ")" +
    "   TILT " + tiltDeg.toFixed(1) + "\u00B0" +
    "   DEPTH " + cone.depth.toFixed(1) +
    "   HALF-ANGLE " + halfDeg + "\u00B0" +
    "   PATCHES " + quads.length +
    "   SQUARES " + floatSquares.length,
    14, 14);
  ctx.restore();

  /* Labels last, so they sit above the patches and shapes. */
  drawShapeLabelsCone();
}

/* The patch is the plane a shape sits on.  It gets a DASHED outline,
   a very faint fill, and no corner or rotate handles.  Everything
   the eye reads as "an object on the sheet" — solid stroke, handles,
   a filled body — belongs to the shapes, not to the patches.

   When shape-editing is enabled the patch corners carry small dots,
   drawn in the patch hue; those dots are the only handle-like
   feature a patch has, and they are dormant while the flag is off. */
function drawQuadPatch(q, selected) {
  const hue = patchHue(q);
  const pts = quadCorners(q).map(c => {
    const [wx, wy] = surfacePoint(c.phi, c.s);
    return w2s(wx, wy);
  });

  ctx.save();

  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = _huergb(hue, selected ? 0.07 : 0.03);
  ctx.fill();

  ctx.lineJoin = "round";
  ctx.setLineDash([6, 4]);
  ctx.strokeStyle = _huergb(hue, selected ? 0.75 : 0.42);
  ctx.lineWidth = selected ? 1.6 : 1.1;
  ctx.stroke();
  ctx.setLineDash([]);

  if (PATCH_SHAPE_EDIT_ENABLED) {
    const rDot = selected ? 5.0 : 2.8;
    for (const [sx, sy] of pts) {
      ctx.beginPath(); ctx.arc(sx, sy, rDot, 0, Math.PI * 2);
      ctx.fillStyle = selected ? _huergbLight(hue) : _huergb(hue, 0.75);
      ctx.fill();
      ctx.strokeStyle = "#0a0e14"; ctx.lineWidth = 1.4; ctx.stroke();
    }
  }

  ctx.restore();
}

/* ==========================================================================
   FLAT VIEW
   ========================================================================== */

const FLAT_PHI_MIN  = 0;
const FLAT_PHI_MAX  = 2 * Math.PI;
const FLAT_PHI_SPAN = FLAT_PHI_MAX - FLAT_PHI_MIN;
const FLAT_S_MIN    = 0;
const FLAT_S_MAX    = 1;

const QUAD_MIN_SIZE_PHI = 0.06;
const QUAD_MIN_SIZE_S   = 0.04;

/* ==========================================================================
   PATCH DRAG SNAP STEPS
   ==========================================================================
   PATCH_SNAP_PHI — one fifteenth of a full turn, matching the default
   meridian spacing of 24 (2π / 24 = 15°).  A patch snapped with
   Shift advances in meridian-sized increments along phi.

   PATCH_SNAP_S   — one twentieth of the parameter rectangle's height.
   For a patch whose own s-extent is 0.5, this is one tenth of its
   own height; the eye reads the jump as "a small but visible step". */

const PATCH_SNAP_PHI = Math.PI / 12;
const PATCH_SNAP_S   = 0.05;

/* ==========================================================================
   PHI-WRAP HELPERS
   ========================================================================== */

function _phiCopies(phi0, phi1) {
  const kMin = Math.floor((FLAT_PHI_MIN - phi1) / FLAT_PHI_SPAN);
  const kMax = Math.ceil ((FLAT_PHI_MAX - phi0) / FLAT_PHI_SPAN);
  const out = [];
  for (let k = kMin; k <= kMax; k++) out.push(k * FLAT_PHI_SPAN);
  return out;
}

function _phiShiftForPatch(phiCursor, phi0, phi1) {
  const phiMid = (phi0 + phi1) / 2;
  return Math.round((phiMid - phiCursor) / FLAT_PHI_SPAN) * FLAT_PHI_SPAN;
}

function flatRect() {
  const W = window.innerWidth;
  const H = layout.reservedH;
  const MARGIN_X = 44;
  const TOP_PAD  = 26;
  const BOT_PAD  = 26;
  const maxW = W - 2 * MARGIN_X;
  const maxH = H - TOP_PAD - BOT_PAD - 4;

  const w = Math.min(maxW, maxH * 2.5);
  const h = Math.min(maxH, w / 2.5);
  const x0 = (W - w) / 2;
  const y0 = layout.reservedY + TOP_PAD + (maxH - h) / 2;
  return { x0, y0, w, h };
}

function flatToScreen(phi, s) {
  const r = flatRect();
  const u = (phi - FLAT_PHI_MIN) / (FLAT_PHI_MAX - FLAT_PHI_MIN);
  const v = s;
  return [r.x0 + u * r.w, r.y0 + (1 - v) * r.h];
}

function screenToFlat(sx, sy) {
  const r = flatRect();
  return {
    phi: FLAT_PHI_MIN +
         (sx - r.x0) / r.w * (FLAT_PHI_MAX - FLAT_PHI_MIN),
    s:   1 - (sy - r.y0) / r.h,
  };
}

function _flatInsideRect(sx, sy) {
  const r = flatRect();
  return sx >= r.x0 && sx <= r.x0 + r.w &&
         sy >= r.y0 && sy <= r.y0 + r.h;
}

function drawFlatView() {
  const cw = window.innerWidth;
  ctx.fillStyle = "#060a10";
  ctx.fillRect(0, layout.reservedY, cw, layout.reservedH);

  const r = flatRect();

  /* ---- static chrome: grid, frame, captions --------------------- */
  ctx.save();

  const N_RINGS = 6;
  for (let k = 1; k < N_RINGS; k++) {
    const s = k / N_RINGS;
    const [sx0, sy] = flatToScreen(FLAT_PHI_MIN, s);
    const [sx1]     = flatToScreen(FLAT_PHI_MAX, s);
    ctx.strokeStyle = "rgba(0, 229, 255, " + (0.03 + s * 0.09) + ")";
    ctx.lineWidth = 0.7;
    ctx.beginPath(); ctx.moveTo(sx0, sy); ctx.lineTo(sx1, sy); ctx.stroke();
  }

  const N_MERID = 12;
  for (let k = 0; k <= N_MERID; k++) {
    const phi = FLAT_PHI_MIN +
                (FLAT_PHI_MAX - FLAT_PHI_MIN) * k / N_MERID;
    const [sx, sy0] = flatToScreen(phi, FLAT_S_MAX);
    const [,   sy1] = flatToScreen(phi, FLAT_S_MIN);
    ctx.strokeStyle = "rgba(0, 229, 255, 0.05)";
    ctx.lineWidth = 0.7;
    ctx.beginPath(); ctx.moveTo(sx, sy0); ctx.lineTo(sx, sy1); ctx.stroke();
  }

  ctx.strokeStyle = "#1e2836";
  ctx.lineWidth = 1;
  ctx.strokeRect(r.x0 + 0.5, r.y0 + 0.5, r.w - 1, r.h - 1);

  {
    const [sx0, sy] = flatToScreen(FLAT_PHI_MIN, 1);
    const [sx1]     = flatToScreen(FLAT_PHI_MAX, 1);
    ctx.strokeStyle = "rgba(255, 43, 214, 0.55)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sx0, sy); ctx.lineTo(sx1, sy); ctx.stroke();
  }

  {
    const [sxL, sy0] = flatToScreen(FLAT_PHI_MIN, FLAT_S_MAX);
    const [,   sy1]  = flatToScreen(FLAT_PHI_MIN, FLAT_S_MIN);
    const [sxR]      = flatToScreen(FLAT_PHI_MAX, 0);
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = "rgba(255, 43, 214, 0.30)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sxL, sy0); ctx.lineTo(sxL, sy1);
    ctx.moveTo(sxR, sy0); ctx.lineTo(sxR, sy1);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();

  /* captions */
  ctx.save();
  ctx.font = "700 9px 'JetBrains Mono', 'Fira Code', monospace";

  ctx.fillStyle = "#3d4756";
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillText("UNFOLDED CONE  \u00B7  PARAMETER SPACE",
               r.x0, r.y0 - 16);

  ctx.textAlign = "right"; ctx.fillStyle = "#5a6774";
  ctx.fillText("\u03C6 = 0", r.x0 - 6, r.y0);
  ctx.textAlign = "left";
  ctx.fillText("\u03C6 = 2\u03C0", r.x0 + r.w + 6, r.y0);

  ctx.textAlign = "left"; ctx.textBaseline = "bottom";
  ctx.fillStyle = "#3d4756";
  ctx.fillText("s = 0  \u00B7  base", r.x0, r.y0 + r.h + 14);

  ctx.textBaseline = "top";
  ctx.fillStyle = "rgba(255, 43, 214, 0.75)";
  ctx.fillText("s = 1  \u00B7  apex", r.x0, r.y0 + 4);
  ctx.restore();

  /* ---- patches and shapes, together, clipped to the sheet ------- */

  ctx.save();
  ctx.beginPath();
  ctx.rect(r.x0, r.y0, r.w, r.h);
  ctx.clip();

  for (let i = 0; i < quads.length; i++) {
    if (i === selectedQuad) continue;
    drawFlatQuad(quads[i], false);
  }
  if (selectedQuad >= 0 && selectedQuad < quads.length) {
    drawFlatQuad(quads[selectedQuad], true);
  }

  if (selectedQuad >= 0 && selectedQuad < quads.length) {
    const activeQ = quads[selectedQuad];

    for (let i = 0; i < floatSquares.length; i++) {
      const sq = floatSquares[i];
      if (sq.quadId !== activeQ.id) continue;
      const isSel = (i === selectedSquare);

      _drawFlatSquareOne(sq, isSel, false);

      if (activeQ.mirror) {
        _withSquareMirror(sq, () => _drawFlatSquareOne(sq, false, true));
      }
    }
  }

  /* Labels, drawn inside the clip so a wrapped copy that has drifted
     past the sheet boundary is trimmed along with everything else. */
  drawShapeLabelsFlat();

  /* Cardinal direction markers, drawn last so they sit above
     everything on the sheet.  See the module docstring,
     CARDINAL DIRECTION MARKERS. */
  drawFlatCardinalMarkers();

  ctx.restore();
}

/* ==========================================================================
   CARDINAL DIRECTION MARKERS
   ==========================================================================
   Small pins at the base line, at φ = 0, π/2, π, 3π/2.  Each pin is
   a dark disc with an amber ring and a single letter, E / N / W / S,
   sitting just above the s = 0 line.

   The four base points are fixed at (R, 0), (0, R), (−R, 0), (0, −R)
   in world coordinates, where R = coneR().  The apex can be dragged
   anywhere within the cone's own reach limit, but it does not move
   the base ring, so the pins never move.

   Drawn without a save/restore of its own — it inherits the clip
   and the coordinate system of drawFlatView. */

function drawFlatCardinalMarkers() {
  const r     = flatRect();
  const yBase = r.y0 + r.h;

  const R_PIN = 9;
  const yPin  = yBase - R_PIN - 3;

  const cards = [
    { key: "E", phi: 0               },
    { key: "N", phi: Math.PI / 2     },
    { key: "W", phi: Math.PI         },
    { key: "S", phi: 3 * Math.PI / 2 },
  ];

  ctx.save();
  ctx.font = "700 11px 'JetBrains Mono', 'Fira Code', monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  for (const c of cards) {
    const [sx] = flatToScreen(c.phi, 0);

    /* Short stem connecting the pin to the base line, so the pin
       reads as "anchored here on the s = 0 edge". */
    ctx.beginPath();
    ctx.moveTo(sx, yBase);
    ctx.lineTo(sx, yBase - 4);
    ctx.strokeStyle = "rgba(255, 200, 90, 0.35)";
    ctx.lineWidth = 1.0;
    ctx.stroke();

    /* Pin: dark fill so it reads over any underlying shape, amber
       ring and letter for the marker itself. */
    ctx.beginPath();
    ctx.arc(sx, yPin, R_PIN, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(11, 16, 24, 0.88)";
    ctx.fill();
    ctx.strokeStyle = "rgba(255, 200, 90, 0.85)";
    ctx.lineWidth = 1.3;
    ctx.stroke();

    ctx.fillStyle = "rgba(255, 200, 90, 0.95)";
    ctx.fillText(c.key, sx, yPin + 0.5);
  }

  ctx.restore();
}

function drawFlatQuad(q, selected) {
  const shifts = _phiCopies(q.phi0, q.phi1);
  for (const shift of shifts) {
    drawFlatQuadShifted(q, selected, shift);
  }
}

/* The patch is the plane a shape sits on.  It gets a DASHED outline,
   a very faint fill, and no corner or rotate handles.  Everything
   the eye reads as "an object on the sheet" — solid stroke, handles,
   a filled body — belongs to the shapes.

   When shape-editing is enabled the patch corners carry small dots
   drawn in the patch hue; those dots are the only handle-like
   feature a patch has, and they are dormant while the flag is off. */
function drawFlatQuadShifted(q, selected, shift) {
  const hue = patchHue(q);
  const pts = quadCorners(q).map(c =>
    flatToScreen(c.phi + shift, c.s));

  ctx.save();

  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < 4; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = _huergb(hue, selected ? 0.07 : 0.03);
  ctx.fill();

  ctx.lineJoin = "round";
  ctx.setLineDash([6, 4]);
  ctx.strokeStyle = _huergb(hue, selected ? 0.75 : 0.42);
  ctx.lineWidth = selected ? 1.6 : 1.1;
  ctx.stroke();
  ctx.setLineDash([]);

  if (PATCH_SHAPE_EDIT_ENABLED) {
    const rDot = selected ? 5.0 : 2.8;
    for (const [sx, sy] of pts) {
      ctx.beginPath(); ctx.arc(sx, sy, rDot, 0, Math.PI * 2);
      ctx.fillStyle = selected ? _huergbLight(hue) : _huergb(hue, 0.75);
      ctx.fill();
      ctx.strokeStyle = "#0a0e14"; ctx.lineWidth = 1.4; ctx.stroke();
    }
  }

  ctx.restore();
}

/* ==========================================================================
   PER-SQUARE DRAWING IN THE FLAT BAND
   ==========================================================================
   Extracted so both the original and the mirror copy can be drawn
   through the same code.  The mirror copy is dimmed and carries no
   handles; the original carries handles when it is the selected
   square.  The wrapping by `_phiCopies` and the intersection hint
   are the same in both cases. */

function _drawFlatSquareOne(sq, isSel, isMirror) {
  const corners = squareFlatCorners(sq);
  if (!corners) return;

  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return;
  const q = quads[qi];
  if (!q) return;
  const hue = patchHue(q);

  const phis = corners.map(c => c[0]);
  const shifts = _phiCopies(Math.min(...phis), Math.max(...phis));

  const fillAlpha   = isMirror ? 0.06 : (isSel ? 0.30 : 0.16);
  const strokeAlpha = isMirror ? 0.55 : (isSel ? 1.00 : 0.78);
  const lineW       = isMirror ? 1.0  : (isSel ? 1.8  : 1.2);

  for (const shift of shifts) {
    const screen = corners.map(([phi, s]) =>
      flatToScreen(phi + shift, s));

    ctx.beginPath();
    ctx.moveTo(screen[0][0], screen[0][1]);
    for (let k = 1; k < 4; k++) {
      ctx.lineTo(screen[k][0], screen[k][1]);
    }
    ctx.closePath();
    ctx.fillStyle = _huergb(hue, fillAlpha);
    ctx.fill();

    ctx.lineJoin = "round";
    ctx.strokeStyle = _huergb(hue, strokeAlpha);
    ctx.lineWidth = lineW;
    ctx.stroke();

    /* Intersection with the patch plane, when tilted.  Drawn
       per wrapped copy, same as the polygon and its handles. */
    if (sq.slope && Math.abs(sq.slope) > 1e-6) {
      const isect = squarePlaneIntersectionFlat(sq);
      if (isect) {
        const [p0, p1] = isect.map(([phi, s]) =>
          flatToScreen(phi + shift, s));
        ctx.save();
        ctx.setLineDash([4, 3]);
        ctx.strokeStyle = _huergb(hue,
          isMirror ? 0.32 : (isSel ? 0.65 : 0.42));
        ctx.lineWidth   = 1.0;
        ctx.beginPath();
        ctx.moveTo(p0[0], p0[1]);
        ctx.lineTo(p1[0], p1[1]);
        ctx.stroke();
        ctx.restore();
      }
    }

    if (!isSel || isMirror) continue;

    for (const [hx, hy] of screen) {
      ctx.beginPath();
      ctx.arc(hx, hy, 4.2, 0, Math.PI * 2);
      ctx.fillStyle = _huergbLight(hue);
      ctx.fill();
      ctx.strokeStyle = "#0a0e14";
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }

    const rh = squareFlatRotateHandleScreen(sq, shift);
    if (rh) {
      let topIdx = 0;
      for (let k = 1; k < screen.length; k++) {
        if (screen[k][1] < screen[topIdx][1]) topIdx = k;
      }
      ctx.beginPath();
      ctx.moveTo(screen[topIdx][0], screen[topIdx][1]);
      ctx.lineTo(rh[0], rh[1]);
      ctx.strokeStyle = _huergb(hue, 0.45);
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.beginPath();
      ctx.arc(rh[0], rh[1], 6.0, 0, Math.PI * 2);
      ctx.fillStyle = _huergbLight(hue);
      ctx.fill();
      ctx.strokeStyle = "#0a0e14";
      ctx.lineWidth = 1.6;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(rh[0], rh[1], 3.0, Math.PI * 0.15, Math.PI * 1.85);
      ctx.strokeStyle = "#0a0e14";
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
  }
}

/* ---- Hit testing ------------------------------------------------ */

const FLAT_HANDLE_R = 10;
const FLAT_EDGE_R   = 6;

function _flatPtSegDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const l2 = dx * dx + dy * dy;
  if (l2 < 1e-9) return Math.hypot(px - ax, py - ay);
  let t = ((px - ax) * dx + (py - ay) * dy) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}

function _flatPtInQuad(px, py, c) {
  let inside = false;
  const n = c.length;
  for (let i = 0, j = n - 1; i < n; j = i++) {
    const xi = c[i][0], yi = c[i][1];
    const xj = c[j][0], yj = c[j][1];
    if (((yi > py) !== (yj > py)) &&
        (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) {
      inside = !inside;
    }
  }
  return inside;
}

function flatHitTest(sx, sy) {
  if (!_flatInsideRect(sx, sy)) return null;

  const order = [];
  if (selectedQuad >= 0 && selectedQuad < quads.length) {
    order.push(selectedQuad);
  }
  for (let i = 0; i < quads.length; i++) {
    if (i !== selectedQuad) order.push(i);
  }

  for (const qi of order) {
    const q = quads[qi];
    const shifts = _phiCopies(q.phi0, q.phi1);

    for (const shift of shifts) {
      const corners = quadCorners(q).map(c =>
        flatToScreen(c.phi + shift, c.s));

      for (let ci = 0; ci < 4; ci++) {
        const [csx, csy] = corners[ci];
        if (Math.hypot(sx - csx, sy - csy) < FLAT_HANDLE_R) {
          return { kind: "corner", quadIdx: qi, cornerIdx: ci };
        }
      }

      const edges = [
        { name: "top",    a: corners[0], b: corners[1] },
        { name: "right",  a: corners[1], b: corners[2] },
        { name: "bottom", a: corners[2], b: corners[3] },
        { name: "left",   a: corners[3], b: corners[0] },
      ];
      let bestEdge = null, bestD = FLAT_EDGE_R;
      for (const e of edges) {
        const d = _flatPtSegDist(sx, sy, e.a[0], e.a[1], e.b[0], e.b[1]);
        if (d < bestD) { bestD = d; bestEdge = e.name; }
      }
      if (bestEdge) return { kind: "edge", quadIdx: qi, edge: bestEdge };

      if (_flatPtInQuad(sx, sy, corners)) {
        return { kind: "body", quadIdx: qi };
      }
    }
  }
  return null;
}

/* ---- Shape re-clamp after a patch mutation ---------------------- */

function _reclampShapesOnPatch(q) {
  if (!q) return;
  const qi = quadIdxById(q.id);
  if (qi < 0) return;
  for (let i = 0; i < floatSquares.length; i++) {
    const sq = floatSquares[i];
    if (sq.quadId === q.id) {
      sq.v = clampCloneV(qi, sq.v);
    }
  }
}

/* ---- Patch drag -------------------------------------------------
   Start-anchored, with the Shift-held constraint to the patch's
   centre→apex axis.

   On the cone's lateral surface, the direction from a patch's
   centre toward the apex is the meridian: φ stays put, only s
   moves.  Constraining the drag to that axis therefore drops the φ
   component of the delta and lets s move freely in both directions
   — the axis is fixed, the sign is not.

   Both the cone view's drag handler and the flat view's route
   through this same function, so a constrained patch drag behaves
   identically in both bands. */

function applyPatchDragFromStart(q, dp, curPhi, curS, constrain) {
  let rawPhi = curPhi - dp.startPhi;
  while (rawPhi >  Math.PI) rawPhi -= 2 * Math.PI;
  while (rawPhi < -Math.PI) rawPhi += 2 * Math.PI;
  const rawS = curS - dp.startS;

  let dPhi = rawPhi;
  const dS = rawS;

  /* Shift held: the drag is constrained to the direction from the
     patch's centre toward the apex.  On the cone surface that is
     the meridian — φ stays put, only s moves.  Both directions
     along the meridian are allowed; the axis is fixed, not the
     sign. */
  if (constrain) {
    dPhi = 0;
  }

  q.phi0 = dp.startPhi0 + dPhi;
  q.phi1 = dp.startPhi1 + dPhi;

  let ns0 = dp.startS0 + dS;
  let ns1 = dp.startS1 + dS;
  if (ns0 < FLAT_S_MIN) { ns1 += FLAT_S_MIN - ns0; ns0 = FLAT_S_MIN; }
  if (ns1 > FLAT_S_MAX) { ns0 -= ns1 - FLAT_S_MAX; ns1 = FLAT_S_MAX; }
  if (ns0 < FLAT_S_MIN) ns0 = FLAT_S_MIN;
  q.s0 = ns0;
  q.s1 = ns1;

  _reclampShapesOnPatch(q);
}

/* ---- Drag application -------------------------------------------
   The three mutators below are the shape-editing paths for patches.
   They are unreferenced while PATCH_SHAPE_EDIT_ENABLED is false, but
   they remain fully functional. */

function flatMoveCorner(q, cornerIdx, phi, s) {
  if (cornerIdx === 0) {
    q.phi0 = Math.max(FLAT_PHI_MIN,
                      Math.min(phi, q.phi1 - QUAD_MIN_SIZE_PHI));
    q.s1   = Math.min(FLAT_S_MAX,
                      Math.max(s, q.s0 + QUAD_MIN_SIZE_S));
  } else if (cornerIdx === 1) {
    q.phi1 = Math.min(FLAT_PHI_MAX,
                      Math.max(phi, q.phi0 + QUAD_MIN_SIZE_PHI));
    q.s1   = Math.min(FLAT_S_MAX,
                      Math.max(s, q.s0 + QUAD_MIN_SIZE_S));
  } else if (cornerIdx === 2) {
    q.phi1 = Math.min(FLAT_PHI_MAX,
                      Math.max(phi, q.phi0 + QUAD_MIN_SIZE_PHI));
    q.s0   = Math.max(FLAT_S_MIN,
                      Math.min(s, q.s1 - QUAD_MIN_SIZE_S));
  } else if (cornerIdx === 3) {
    q.phi0 = Math.max(FLAT_PHI_MIN,
                      Math.min(phi, q.phi1 - QUAD_MIN_SIZE_PHI));
    q.s0   = Math.max(FLAT_S_MIN,
                      Math.min(s, q.s1 - QUAD_MIN_SIZE_S));
  }
  _reclampShapesOnPatch(q);
}

function flatMoveEdge(q, edge, phi, s) {
  if (edge === "top") {
    q.s1 = Math.min(FLAT_S_MAX, Math.max(s, q.s0 + QUAD_MIN_SIZE_S));
  } else if (edge === "bottom") {
    q.s0 = Math.max(FLAT_S_MIN, Math.min(s, q.s1 - QUAD_MIN_SIZE_S));
  } else if (edge === "left") {
    q.phi0 = Math.max(FLAT_PHI_MIN,
                      Math.min(phi, q.phi1 - QUAD_MIN_SIZE_PHI));
  } else if (edge === "right") {
    q.phi1 = Math.min(FLAT_PHI_MAX,
                      Math.max(phi, q.phi0 + QUAD_MIN_SIZE_PHI));
  }
  _reclampShapesOnPatch(q);
}

/* Incremental patch translation.  Kept as the low-level mutator and
   as the reference implementation for the clamp/wrap behaviour that
   applyPatchDragFromStart mirrors; the drag handlers now use the
   start-anchored version. */
function flatMoveBody(q, dPhi, dS) {
  q.phi0 += dPhi;
  q.phi1 += dPhi;

  let ns0 = q.s0 + dS, ns1 = q.s1 + dS;
  if (ns0 < FLAT_S_MIN) { ns1 += FLAT_S_MIN - ns0; ns0 = FLAT_S_MIN; }
  if (ns1 > FLAT_S_MAX) { ns0 -= ns1 - FLAT_S_MAX; ns1 = FLAT_S_MAX; }
  if (ns0 < FLAT_S_MIN) ns0 = FLAT_S_MIN;

  q.s0 = ns0; q.s1 = ns1;

  _reclampShapesOnPatch(q);
}

/* ==========================================================================
   STATE
   ========================================================================== */

const floatSquares = [];
let nextSquareId = 1;
let selectedSquare = -1;

/* ==========================================================================
   SHAPE DIMENSIONS
   ==========================================================================
   A shape is a square in a REFERENCE frame.  The reference
   half-extents are

       refHW = SHAPE_REL_SIZE / 2 · scaleU
       refHH = SHAPE_REL_SIZE / 2 · scaleV · depthScale

   The reference offset (du, dv) maps to the patch's (û, v̂) through
   a per-patch diagonal (Ku, Kv), then to local (u, v) through
   (uLen, vLen).  See the module docstring, "SHAPE DIMENSIONS —
   REFERENCE FRAME". */

/* The reference square's side, in REFERENCE units.  Its world size
   is this times (scaleU · Ku, scaleV · Kv · depthScale); with the
   patch-relative aspect scaling defined below, that makes the shape
   cover a fixed FRACTION SHAPE_REL_SIZE / SHAPE_U_REF of its
   patch's U-extent (and SHAPE_REL_SIZE / SHAPE_V_REF of its
   V-extent), independent of the cone's depth or half-angle. */
const SHAPE_REL_SIZE = 2.0;

/* Per-shape multipliers on the two reference axes.  Set to 1.0 for
   a reference square; corner-drag resizes move them. */
const SHAPE_DEFAULT_SCALE = 1.0;
const SHAPE_MIN_SCALE     = 0.03;
const SHAPE_MAX_SCALE     = 10.00;

/* ==========================================================================
   SHAPE SLOPE
   ==========================================================================
   How far a shape may tilt out of the patch plane, about its own
   reference U axis.  Zero leaves the shape flat on the patch.
   Positive slope tips the +v edge (the one that points toward the
   apex) INTO the cavity of the cone; negative slope tips the −v
   edge.  See the SLOPE section in the module docstring.

   ±85° is the hard bound.  At ±90° the shape would be edge-on to
   the patch plane, the projection would collapse to a line, and
   the corner/rotate handle offsets would become singular. */

const SHAPE_SLOPE_MIN = -85 * Math.PI / 180;
const SHAPE_SLOPE_MAX =  85 * Math.PI / 180;

/* ==========================================================================
   PATCH-RELATIVE ASPECT SCALING
   ==========================================================================
   The shape is a sticker on the patch: its size is defined as a
   fraction of the patch's own U- and V-extents, so that patches and
   the shapes on them scale together — in both bands — whenever the
   cone's depth or half-angle changes.

   The aspect scales are

       Ku = f.uLen / SHAPE_U_REF
       Kv = f.vLen / SHAPE_V_REF

   The reference lengths SHAPE_U_REF, SHAPE_V_REF are the patch's
   typical uLen and vLen at the DEFAULT cone configuration (depth
   15, half-angle 30°, default patch at s0 = 0.22, s1 = 0.72,
   φ-span 0.72).  At that configuration Ku = Kv = 1, so a fresh
   scene's shapes look exactly as they did under the previous
   world-anchored scheme (Ku = Kv = 1 everywhere).  Scaling away
   from the reference is now coherent: a bigger patch means a
   bigger shape, always, at the same fraction of the patch.

   Compare the module docstring, "PATCH-RELATIVE SHAPE SIZE". */
const SHAPE_U_REF = 3.2;
const SHAPE_V_REF = 4.0;

function _shapeAspectScales(f) {
  if (!f || f.uLen <= 0 || f.vLen <= 0) {
    return { Ku: 1, Kv: 1 };
  }
  return { Ku: f.uLen / SHAPE_U_REF, Kv: f.vLen / SHAPE_V_REF };
}

/* ==========================================================================
   SHAPE DEPTH — ONE PER VIEW
   ==========================================================================
   Two independent depth multipliers, one per view.  The panel's
   "Shape depth" slider drives SHAPE_DEPTH_CONE only; the flat view
   reads SHAPE_DEPTH_FLAT, a fixed constant.

   The unit is 1.00: at the default slider position the two bands
   agree exactly and edge-to-edge contiguity holds across bands.
   Any other slider value deliberately opens a gap between the
   bands' drawn heights. */

const SHAPE_DEPTH_CONE_UNIT = 1.00;
let   SHAPE_DEPTH_CONE      = 1.00;
const SHAPE_DEPTH_FLAT      = 1.00;

function effectiveConeDepth() {
  return SHAPE_DEPTH_CONE * SHAPE_DEPTH_CONE_UNIT;
}

const WEDGE_BASE_REACH = 2.50;

/* ROTATE_HANDLE_OFFSET is in REFERENCE units — the handle sits this
   far past the reference square's +v̂ edge. */
const ROTATE_HANDLE_OFFSET = 0.25;
const ROTATE_HANDLE_R      = 10;

const ROTATE_JUMP_STEP = Math.PI / 12;

const U_LIMIT = 3.0;

/* ==========================================================================
   PATCH HUE PALETTE
   ========================================================================== */

const PATCH_HUES = [
  { r: 255, g: 200, b:  90 },   // amber
  { r: 120, g: 220, b: 255 },   // cyan
  { r: 255, g: 130, b: 210 },   // magenta
  { r: 140, g: 225, b: 160 },   // green
  { r: 180, g: 155, b: 255 },   // violet
  { r: 255, g: 165, b: 105 },   // orange
  { r: 110, g: 220, b: 210 },   // teal
  { r: 220, g: 230, b: 120 },   // lime
];

function patchHue(q) {
  if (!q) return PATCH_HUES[0];
  const n = PATCH_HUES.length;
  const idx = ((q.id - 1) % n + n) % n;
  return PATCH_HUES[idx];
}

function _huergb(h, a) {
  return "rgba(" + h.r + ", " + h.g + ", " + h.b + ", " + a + ")";
}

function _huergbLight(h) {
  const r = Math.round(h.r * 0.7 + 255 * 0.3);
  const g = Math.round(h.g * 0.7 + 255 * 0.3);
  const b = Math.round(h.b * 0.7 + 255 * 0.3);
  return "rgb(" + r + ", " + g + ", " + b + ")";
}

/* ==========================================================================
   PATCH FRAME
   ========================================================================== */

function patchFrame(quadIdx) {
  if (quadIdx < 0 || quadIdx >= quads.length) return null;
  const q = quads[quadIdx];
  const c = quadCorners(q).map(v => surfacePoint(v.phi, v.s));
  const C0 = c[0], C1 = c[1], C2 = c[2], C3 = c[3];

  const Cx = (C0[0] + C1[0] + C2[0] + C3[0]) / 4;
  const Cy = (C0[1] + C1[1] + C2[1] + C3[1]) / 4;

  let Ux = (C1[0] + C2[0]) / 2 - (C0[0] + C3[0]) / 2;
  let Uy = (C1[1] + C2[1]) / 2 - (C0[1] + C3[1]) / 2;

  let Vx = (C0[0] + C1[0]) / 2 - (C3[0] + C2[0]) / 2;
  let Vy = (C0[1] + C1[1]) / 2 - (C3[1] + C2[1]) / 2;

  const uLen = Math.hypot(Ux, Uy) || 1;
  const vLen = Math.hypot(Vx, Vy) || 1;

  Ux /= uLen; Uy /= uLen;
  Vx /= vLen; Vy /= vLen;

  const det = Ux * Vy - Uy * Vx;
  if (Math.abs(det) < 1e-9) return null;

  return { Cx, Cy, Ux, Uy, Vx, Vy, det, uLen, vLen };
}

function frameToWorld(f, u, v) {
  return [f.Cx + u * f.Ux + v * f.Vx,
          f.Cy + u * f.Uy + v * f.Vy];
}

function frameToScreen(f, u, v) {
  const [wx, wy] = frameToWorld(f, u, v);
  return w2s(wx, wy);
}

function screenToFrame(f, sx, sy) {
  const [wx, wy] = s2w(sx, sy);
  const dx = wx - f.Cx;
  const dy = wy - f.Cy;
  return {
    u: (dx * f.Vy - dy * f.Vx) / f.det,
    v: (f.Ux * dy - f.Uy * dx) / f.det,
  };
}

function quadIdxById(id) {
  for (let i = 0; i < quads.length; i++) {
    if (quads[i].id === id) return i;
  }
  return -1;
}

/* ==========================================================================
   MIRROR
   ==========================================================================
   Every patch carries a boolean `mirror`.  When it is true, every
   square on the patch is drawn a second time on the patch's mirror —
   the same patch shifted by `mirrorAngle` in φ (default π), i.e. on
   the opposite side of the cone.  The mirror copy shares the
   square's full local state and is a pure visual clone, not an
   independent object.

   The renderer shifts the patch's φ bounds in place, flips the
   square's local state if `mirrorFlip` is on, runs the caller's
   drawing/export routine, then restores everything in a `finally`.
   Every square geometry function reads the patch through
   `quads[qi]`, so the shifted patch is what they see; nothing in
   the per-square math needs to know a mirror is being drawn. */

function _withQuadPhiShifted(q, dPhi, fn) {
  const phi0 = q.phi0, phi1 = q.phi1;
  q.phi0 = phi0 + dPhi;
  q.phi1 = phi1 + dPhi;
  try { fn(); } finally {
    q.phi0 = phi0;
    q.phi1 = phi1;
  }
}

function _squareHasMirror(sq) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return false;
  const q = quads[qi];
  return !!(q && q.mirror);
}

/* Run `fn` with the square in its mirror state and restore on exit.

   With `mirrorFlip` on (the default), the flip is a reflection
   across the patch's V axis: θ → −θ, slope → −slope, u → −u.  This
   is the transformation that makes a rotated or tilted shape read
   as a true left-right reflection of the original on the mirror,
   rather than as a rotated ghost.

   With `mirrorFlip` off, only the patch's φ bounds shift; the
   square keeps its local state and renders as a straight copy at
   the mirror location (which, since the patch itself is now on the
   opposite side of the cone, usually looks wrong — that's what the
   toggle exists for).

   The `finally` restores every field that was mutated, so an
   exception inside `fn` cannot leave the model in a mirror state. */
function _withSquareMirror(sq, fn) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return;
  const q = quads[qi];
  if (!q || !q.mirror) return;

  const angle = (typeof q.mirrorAngle === "number")
                  ? q.mirrorAngle : Math.PI;
  const flip  = q.mirrorFlip !== false;

  const phi0   = q.phi0;
  const phi1   = q.phi1;
  const theta0 = sq.theta || 0;
  const slope0 = sq.slope || 0;
  const u0     = sq.u;

  q.phi0 = phi0 + angle;
  q.phi1 = phi1 + angle;

  if (flip) {
    sq.theta = -theta0;
    sq.slope = -slope0;
    sq.u     = -u0;
  }

  try {
    fn();
  } finally {
    q.phi0   = phi0;
    q.phi1   = phi1;
    sq.theta = theta0;
    sq.slope = slope0;
    sq.u     = u0;
  }
}

/* The direction that the patch's outward surface normal projects to,
   in the cone view, is the radial direction at the patch's angular
   centre.  When the apex is off-centre the axis is not vertical,
   but the projection of "outward" is still radial in the xy plane,
   so this is the correct screen direction to slide the tilted shape
   along.  Returned in world φ (radians, [0, 2π)). */
function _patchNormalPhi(qi) {
  if (qi < 0 || qi >= quads.length) return 0;
  const q = quads[qi];
  const TAU = 2 * Math.PI;
  let phi = (q.phi0 + q.phi1) / 2;
  phi = ((phi % TAU) + TAU) % TAU;
  return phi;
}

/* ==========================================================================
   PATCH CORNERS IN LOCAL FRAME — [TL, TR, BR, BL]
   ========================================================================== */

function patchCornersLocal(quadIdx) {
  if (quadIdx < 0 || quadIdx >= quads.length) return null;
  const f = patchFrame(quadIdx);
  if (!f) return null;
  const q = quads[quadIdx];
  const world = quadCorners(q).map(c => surfacePoint(c.phi, c.s));
  return world.map(([wx, wy]) => {
    const dx = wx - f.Cx;
    const dy = wy - f.Cy;
    return [
      (dx * f.Vy - dy * f.Vx) / f.det,
      (f.Ux * dy - f.Uy * dx) / f.det,
    ];
  });
}

/* ==========================================================================
   HORIZON
   ========================================================================== */

function horizonLocal(qi) {
  if (qi < 0 || qi >= quads.length) return null;
  const q = quads[qi];
  const ds = q.s1 - q.s0;
  if (Math.abs(ds) < 1e-9) return null;
  const sAvg = (q.s0 + q.s1) / 2;
  return { vHat: (1 - sAvg) / ds };
}

function perspAt(qi, vHat) {
  const h = horizonLocal(qi);
  if (!h || h.vHat <= 1e-6) return 1;
  const p = (h.vHat - vHat) / h.vHat;
  return Math.max(0, p);
}

/* ==========================================================================
   SHAPE PERSPECTIVE PARAMETERS
   ========================================================================== */

function shapePerspCentre(sq) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return 1;
  return perspAt(qi, sq.v);
}

function shapeVMax(sq) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return 1;
  const f = patchFrame(qi);
  if (!f) return 1;
  const h = horizonLocal(qi);
  if (!h) return 1;
  return h.vHat * f.vLen;
}

/* ==========================================================================
   HORIZON CLIP
   ==========================================================================
   Sutherland-Hodgman against the half-plane v ≤ vMaxLocal. */

function _clipPolygonToVMax(corners, vMaxLocal) {
  const out = [];
  const n = corners.length;
  for (let i = 0; i < n; i++) {
    const A = corners[i];
    const B = corners[(i + 1) % n];
    const aIn = A[1] <= vMaxLocal;
    const bIn = B[1] <= vMaxLocal;
    if (aIn) out.push(A);
    if (aIn !== bIn) {
      const t = (vMaxLocal - A[1]) / (B[1] - A[1]);
      out.push([A[0] + (B[0] - A[0]) * t, vMaxLocal]);
    }
  }
  return out;
}

/* ==========================================================================
   CLAMP — v only
   ========================================================================== */

function clampCloneV(qi, vHat) {
  const h = horizonLocal(qi);
  if (!h) return vHat;
  const vMin = -WEDGE_BASE_REACH;
  const vMax = h.vHat + WEDGE_BASE_REACH;
  if (vMax <= vMin) return vMin;
  return Math.max(vMin, Math.min(vMax, vHat));
}

/* ==========================================================================
   SHAPE V-EXTENT (preserved, not on the render path)
   ==========================================================================
   Reports the shape's half-extent along v̂, in NORMALIZED v̂ units,
   accounting for the rotation and the aspect correction.  The slope
   is not folded in here: this is the footprint the shape would have
   if it were flat on the patch plane. */

function _vExtentNormFromDims(f, dims, theta) {
  const hwHat = (dims.w / 2) / f.uLen;
  const hhHat = (dims.h / 2) / f.vLen;
  const cosT = Math.abs(Math.cos(theta || 0));
  const sinT = Math.abs(Math.sin(theta || 0));
  return hwHat * sinT + hhHat * cosT;
}

function shapeVExtentNorm(sq) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return 0;
  const f = patchFrame(qi);
  if (!f) return 0;
  const dims = squareDims(sq);
  return _vExtentNormFromDims(f, dims, sq.theta || 0);
}

/* ==========================================================================
   SHAPE POSITION
   ========================================================================== */

function setClonePosition(sq, uLocal, vLocal) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return;
  const f = patchFrame(qi);
  if (!f) return;

  let uHat = uLocal / f.uLen;
  if (uHat >  U_LIMIT) uHat =  U_LIMIT;
  if (uHat < -U_LIMIT) uHat = -U_LIMIT;

  sq.u = uHat;
  sq.v = clampCloneV(qi, vLocal / f.vLen);
}

/* ==========================================================================
   LIFECYCLE
   ========================================================================== */

function addSquareAt(quadIdx, uLocal, vLocal) {
  if (quadIdx < 0 || quadIdx >= quads.length) return;
  const q = quads[quadIdx];
  const f = patchFrame(quadIdx);
  if (!f) return;

  const uHat = uLocal / f.uLen;
  const vHat = clampCloneV(quadIdx, vLocal / f.vLen);

  const id = nextSquareId++;
  floatSquares.push({
    id: id,
    name: "S" + id,
    quadId: q.id,
    u: uHat, v: vHat,
    scaleU: SHAPE_DEFAULT_SCALE,
    scaleV: SHAPE_DEFAULT_SCALE,
    theta: 0,
    slope: 0,
    visualBottom: false,
  });
  selectedSquare = floatSquares.length - 1;
  syncQuadList();
  draw();
}

function addSquareAtCenter(quadIdx) { addSquareAt(quadIdx, 0, 0); }

/* Duplicate a square at the EXACT same location as its source: same
   patch (quadId), same normalized (u, v), same scaleU / scaleV,
   same theta, same slope, same visualBottom.  The clone overlaps
   the source pixel-for-pixel until it is dragged away.  It receives
   a fresh id and default name, and becomes the new selection. */
function cloneSquare(idx) {
  if (idx < 0 || idx >= floatSquares.length) return;
  const src = floatSquares[idx];
  if (!src) return;

  const newId = nextSquareId++;
  floatSquares.push({
    id:     newId,
    name:   "S" + newId,
    quadId: src.quadId,
    u:      src.u,
    v:      src.v,
    scaleU: src.scaleU,
    scaleV: src.scaleV,
    theta:  src.theta || 0,
    slope:  src.slope || 0,
    visualBottom: !!src.visualBottom,
  });
  selectedSquare = floatSquares.length - 1;
  syncQuadList();
  draw();
}

function deleteSquare(idx) {
  if (idx < 0 || idx >= floatSquares.length) return;
  floatSquares.splice(idx, 1);
  if (selectedSquare === idx) selectedSquare = -1;
  else if (selectedSquare > idx) selectedSquare -= 1;
  syncQuadList();
  draw();
}

function deleteSquaresForQuad(quadId) {
  for (let i = floatSquares.length - 1; i >= 0; i--) {
    if (floatSquares[i].quadId === quadId) {
      floatSquares.splice(i, 1);
      if (selectedSquare === i) selectedSquare = -1;
      else if (selectedSquare > i) selectedSquare -= 1;
    }
  }
}

function clampShapeScales(sq) {
  sq.scaleU = Math.max(SHAPE_MIN_SCALE,
              Math.min(SHAPE_MAX_SCALE, sq.scaleU));
  sq.scaleV = Math.max(SHAPE_MIN_SCALE,
              Math.min(SHAPE_MAX_SCALE, sq.scaleV));
}

/* ==========================================================================
   GEOMETRY
   ==========================================================================
   A shape's drawn dimensions in the patch's world-local (u, v) units.

   The shape is a square in a REFERENCE frame, with half-extents

       refHW = SHAPE_REL_SIZE / 2 · scaleU
       refHH = SHAPE_REL_SIZE / 2 · scaleV · depthScale

   The reference offset (du, dv) maps to the patch's (û, v̂) through
   the per-patch diagonal (Ku, Kv), then to local (u, v) through
   (uLen, vLen).  See _shapeAspectScales for Ku and Kv.

   The world extents reported here are the shape's ACTUAL on-patch
   extents — SHAPE_REL_SIZE · scaleU · Ku in u and SHAPE_REL_SIZE ·
   scaleV · depthScale · Kv in v — which for the patch-relative
   aspect scaling is a fixed fraction of the patch's own uLen /
   vLen.  This is what the cone view draws.

   squareDims / squareCornersLocal / squareRotateHandleLocal are the
   FLAT-view variants (SHAPE_DEPTH_FLAT); the ...Cone siblings are
   the CONE-view variants (effectiveConeDepth()). */

function squareDims(sq) {
  return squareDimsWith(sq, SHAPE_DEPTH_FLAT);
}

function squareDimsCone(sq) {
  return squareDimsWith(sq, effectiveConeDepth());
}

function squareDimsWith(sq, depthScale) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return { w: 0, h: 0 };
  const q = quads[qi];
  if (!q) return { w: 0, h: 0 };
  const f = patchFrame(qi);
  if (!f) return { w: 0, h: 0 };
  const { Ku, Kv } = _shapeAspectScales(f);
  return {
    w: SHAPE_REL_SIZE * sq.scaleU * Ku,
    h: SHAPE_REL_SIZE * sq.scaleV * depthScale * Kv,
  };
}

/* The shape's intrinsic size in REFERENCE units, independent of the
   patch it sits on and of the cone's depth / half-angle.  These are
   what the panel's Square W / Square H fields read and write; see
   pg_panel.py. */

function squareWorldWidth(sq) {
  return SHAPE_REL_SIZE * sq.scaleU;
}

function squareWorldHeight(sq) {
  return SHAPE_REL_SIZE * sq.scaleV;
}

function squareCenterLocal(sq) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return null;
  const f = patchFrame(qi);
  if (!f) return null;
  return [sq.u * f.uLen, sq.v * f.vLen];
}
