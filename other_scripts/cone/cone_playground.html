/* The shape's four corners in the patch's local (u, v) frame.

   Rotation happens in the REFERENCE frame, where the shape is a
   square (at scaleU = scaleV = 1).  The reference offset is then
   mapped to (û, v̂) through (Ku, Kv) and to local through
   (uLen, vLen).  Because that map does not depend on θ, a 90°
   rotation in the reference frame is a 90° rotation of the drawn
   shape, so the set of local corners is the same at θ = 0° and 90°.

   Slope is not applied here.  The flat view (via these local
   corners) sees the un-tilted footprint; the cone view applies the
   tilt later, in projectShapePoint. */

function squareCornersLocal(sq) {
  return squareCornersLocalWith(sq, SHAPE_DEPTH_FLAT);
}

function squareCornersLocalCone(sq) {
  return squareCornersLocalWith(sq, effectiveConeDepth());
}

function squareCornersLocalWith(sq, depthScale) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return null;
  const f = patchFrame(qi);
  if (!f) return null;

  /* Reference half-extents. */
  const refHW = SHAPE_REL_SIZE / 2 * sq.scaleU;
  const refHH = SHAPE_REL_SIZE / 2 * sq.scaleV * depthScale;

  const cosT = Math.cos(sq.theta || 0);
  const sinT = Math.sin(sq.theta || 0);

  const rawCorners = [
    [-refHW, +refHH], [+refHW, +refHH], [+refHW, -refHH], [-refHW, -refHH],
  ];

  const { Ku, Kv } = _shapeAspectScales(f);

  return rawCorners.map(([du, dv]) => {
    const duR = du * cosT - dv * sinT;
    const dvR = du * sinT + dv * cosT;
    const uHat = sq.u + (duR * Ku) / f.uLen;
    const vHat = sq.v + (dvR * Kv) / f.vLen;
    return [uHat * f.uLen, vHat * f.vLen];
  });
}

/* The local (u, v) of the corner DIAGONALLY OPPOSITE the given
   corner — the anchor an anchored (default) corner drag keeps fixed.
   Same math as squareCornersLocalWith but at the opposite sign
   pair.  Corners are ordered [TL, TR, BR, BL], so the opposite of
   corner i is corner (i + 2) % 4.  depthScale is folded into the
   reference v half-extent, matching squareCornersLocalWith; pass
   effectiveConeDepth() from the cone band and SHAPE_DEPTH_FLAT
   from the flat band. */
function squareAnchorCornerLocal(sq, cornerIdx, depthScale) {
  const corners = squareCornersLocalWith(sq, depthScale);
  if (!corners || corners.length < 4) return null;
  const anchorIdx = (cornerIdx + 2) % 4;
  return corners[anchorIdx];
}

function squareCornersLocalUnrotated(sq) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return null;
  const f = patchFrame(qi);
  if (!f) return null;
  const uC = sq.u * f.uLen;
  const vC = sq.v * f.vLen;
  const dims = squareDims(sq);
  const hw = dims.w / 2;
  const hh = dims.h / 2;
  return [
    [uC - hw, vC + hh], [uC + hw, vC + hh],
    [uC + hw, vC - hh], [uC - hw, vC - hh],
  ];
}

function squareRotateHandleLocal(sq) {
  return squareRotateHandleLocalWith(sq, SHAPE_DEPTH_FLAT);
}

function squareRotateHandleLocalCone(sq) {
  return squareRotateHandleLocalWith(sq, effectiveConeDepth());
}

/* The rotate handle sits on the shape's +v̂ axis in the REFERENCE
   frame, at reference offset (0, refHH + ROTATE_HANDLE_OFFSET).  It
   rotates with the shape and maps through the same (Ku, Kv). */

function squareRotateHandleLocalWith(sq, depthScale) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return null;
  const f = patchFrame(qi);
  if (!f) return null;

  const refHH = SHAPE_REL_SIZE / 2 * sq.scaleV * depthScale;
  const k = refHH + ROTATE_HANDLE_OFFSET;
  const cosT = Math.cos(sq.theta || 0);
  const sinT = Math.sin(sq.theta || 0);

  const duR = -k * sinT;
  const dvR =  k * cosT;

  const { Ku, Kv } = _shapeAspectScales(f);
  const uHat = sq.u + (duR * Ku) / f.uLen;
  const vHat = sq.v + (dvR * Kv) / f.vLen;
  return [uHat * f.uLen, vHat * f.vLen];
}

/* ==========================================================================
   PROJECTION — shape-relative taper, WITH SLOPE
   ==========================================================================
   The single place slope is realised.  Given a point's local (u, v)
   on the patch plane, the projection proceeds in three steps:

     1.  Decompose the point's offset from the shape's centre along
         the reference V axis into an in-plane part and an
         out-of-plane part:

             dv          = vLocal - vC
             vInPlane    = vC + dv · cos(slope)
             hOut        =   - dv · sin(slope)

     2.  Project the in-plane point through the usual shape-relative
         perspective taper:

             p = pC - (vInPlane - vC) / vMax

     3.  Add the out-of-plane part as a screen-space offset along
         the direction the patch's outward surface normal projects
         to.  That direction is the radial direction at the patch's
         angular centre φc:  in screen space it is
         ( cos φc , -sin φc ), because screen y is flipped.

             px += hOut ·  cos(φc) · view.scale
             py += hOut · -sin(φc) · view.scale

   Positive slope drops the +v side (dv > 0) INTO the cone — the
   outward normal points away from the axis, so hOut < 0 for dv > 0
   moves the point toward the axis. */

function projectShapePoint(f, qi, uLocal, vLocal, vC, pC, vMax,
                           phiC, slope) {
  const dv   = vLocal - vC;
  const cosS = Math.cos(slope || 0);
  const sinS = Math.sin(slope || 0);

  const vInPlane = vC + dv * cosS;

  const [wx, wy] = frameToWorld(f, uLocal, vInPlane);
  const [sx, sy] = w2s(wx, wy);
  const [ax, ay] = w2s(cone.ax, cone.ay);
  const p  = pC - (vInPlane - vC) / vMax;
  let px = ax + p * (sx - ax);
  let py = ay + p * (sy - ay);

  const hN = -dv * sinS;
  if (hN !== 0) {
    px += hN *  Math.cos(phiC) * view.scale;
    py += hN * -Math.sin(phiC) * view.scale;
  }

  return [px, py];
}

function squareCornersScreen(sq) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return null;
  const f = patchFrame(qi);
  if (!f) return null;
  const local = squareCornersLocalCone(sq);
  if (!local) return null;

  const h = horizonLocal(qi);
  if (!h) return null;
  const vMaxLocal = h.vHat * f.vLen;
  const clipped = _clipPolygonToVMax(local, vMaxLocal);
  if (clipped.length < 3) return null;

  const vC    = sq.v * f.vLen;
  const pC    = shapePerspCentre(sq);
  const vMax  = shapeVMax(sq);
  const phiC  = _patchNormalPhi(qi);
  const slope = sq.slope || 0;

  return clipped.map(([u, v]) =>
    projectShapePoint(f, qi, u, v, vC, pC, vMax, phiC, slope));
}

function squareRotateHandleScreen(sq) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return null;
  const f = patchFrame(qi);
  if (!f) return null;

  if (!squareCornersScreen(sq)) return null;

  const hl = squareRotateHandleLocalCone(sq);
  if (!hl) return null;

  const h = horizonLocal(qi);
  if (!h) return null;

  const vMaxLocal = h.vHat * f.vLen;
  const HANDLE_GAP = 0.02 * f.vLen;
  const hv = Math.min(hl[1], vMaxLocal - HANDLE_GAP);

  const vC    = sq.v * f.vLen;
  const pC    = shapePerspCentre(sq);
  const vMax  = shapeVMax(sq);
  const phiC  = _patchNormalPhi(qi);
  const slope = sq.slope || 0;

  return projectShapePoint(f, qi, hl[0], hv, vC, pC, vMax, phiC, slope);
}

/* ==========================================================================
   PLANE INTERSECTION
   ==========================================================================
   When a shape is tilted out of its patch plane, its plane cuts the
   patch plane along a line: the pivot axis.  The projection tilts
   about local v = vC (the shape's centre along the patch's V axis),
   so the intersection segment is the piece of the line v = vC that
   lies inside the shape's own local quad.  It is drawn as a faint
   dashed hint so a tilted shape reads as "pivoted about this axis"
   rather than floating arbitrarily.  With slope = 0 the line is not
   drawn. */

function squarePlaneIntersectionLocal(sq) {
  const slope = sq.slope || 0;
  if (Math.abs(slope) < 1e-6) return null;

  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return null;
  const f = patchFrame(qi);
  if (!f) return null;

  const corners = squareCornersLocalCone(sq);
  if (!corners || corners.length < 3) return null;

  const vC = sq.v * f.vLen;

  /* Intersect the line v = vC with every edge of the quad. */
  const pts = [];
  const n = corners.length;
  for (let i = 0; i < n; i++) {
    const A = corners[i];
    const B = corners[(i + 1) % n];
    const da = A[1] - vC;
    const db = B[1] - vC;
    if (Math.abs(da) < 1e-9) pts.push([A[0], vC]);
    if (Math.abs(db) < 1e-9) pts.push([B[0], vC]);
    if (da * db < 0) {
      const t = da / (da - db);
      pts.push([A[0] + (B[0] - A[0]) * t, vC]);
    }
  }

  if (pts.length < 2) return null;

  /* The two most distant intersections are the chord endpoints. */
  let best  = [pts[0], pts[1]];
  let bestD = -1;
  for (let i = 0; i < pts.length; i++) {
    for (let j = i + 1; j < pts.length; j++) {
      const dx = pts[i][0] - pts[j][0];
      const dy = pts[i][1] - pts[j][1];
      const d  = dx * dx + dy * dy;
      if (d > bestD) { bestD = d; best = [pts[i], pts[j]]; }
    }
  }
  return best;
}

/* Cone-band screen endpoints.  Both lie at local v = vC, so the
   projection's slope term is zero there and they read as the same
   line the un-tilted shape would show: exactly the pivot. */
function squarePlaneIntersectionScreen(sq) {
  const local = squarePlaneIntersectionLocal(sq);
  if (!local) return null;

  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return null;
  const f = patchFrame(qi);
  if (!f) return null;
  const h = horizonLocal(qi);
  if (!h) return null;

  const vC    = sq.v * f.vLen;
  const pC    = shapePerspCentre(sq);
  const vMax  = shapeVMax(sq);
  const phiC  = _patchNormalPhi(qi);
  const slope = sq.slope || 0;

  return local.map(([u, v]) =>
    projectShapePoint(f, qi, u, v, vC, pC, vMax, phiC, slope));
}

/* Flat-band (phi, s) endpoints, using the same linear (u, v) →
   (phi, s) correspondence the shape's footprint itself uses. */
function squarePlaneIntersectionFlat(sq) {
  const local = squarePlaneIntersectionLocal(sq);
  if (!local) return null;

  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return null;
  const q = quads[qi];
  const f = patchFrame(qi);
  if (!f) return null;

  const phiC = (q.phi0 + q.phi1) / 2;
  const sC   = (q.s0   + q.s1)   / 2;
  const dPhi = q.phi1 - q.phi0;
  const dS   = q.s1   - q.s0;

  return local.map(([u, v]) => [
    phiC + (u / f.uLen) * dPhi,
    sC   + (v / f.vLen) * dS,
  ]);
}

/* ==========================================================================
   RENDERING
   ========================================================================== */

const HORIZON_REACH = 4000;

function drawHorizon(qi) {
  const f = patchFrame(qi);
  if (!f) return;
  const [ax, ay] = [cone.ax, cone.ay];
  const p1 = w2s(ax - HORIZON_REACH * f.Ux, ay - HORIZON_REACH * f.Uy);
  const p2 = w2s(ax + HORIZON_REACH * f.Ux, ay + HORIZON_REACH * f.Uy);
  ctx.save();
  ctx.strokeStyle = "rgba(120, 220, 255, 0.42)";
  ctx.lineWidth = 1.3;
  ctx.setLineDash([7, 6]);
  ctx.beginPath();
  ctx.moveTo(p1[0], p1[1]);
  ctx.lineTo(p2[0], p2[1]);
  ctx.stroke();
  ctx.setLineDash([]);
  const [axs, ays] = w2s(ax, ay);
  ctx.beginPath();
  ctx.arc(axs, ays, 7.5, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(120, 220, 255, 0.85)";
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.restore();
}

function drawBaseReach(qi) {
  const f = patchFrame(qi);
  if (!f) return;
  const vLocal = -WEDGE_BASE_REACH * f.vLen;
  const [px, py] = frameToWorld(f, 0, vLocal);
  const p1 = w2s(px - HORIZON_REACH * f.Ux, py - HORIZON_REACH * f.Uy);
  const p2 = w2s(px + HORIZON_REACH * f.Ux, py + HORIZON_REACH * f.Uy);
  ctx.save();
  ctx.strokeStyle = "rgba(120, 220, 255, 0.22)";
  ctx.lineWidth = 1.0;
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.moveTo(p1[0], p1[1]);
  ctx.lineTo(p2[0], p2[1]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawFloatSquares() {
  for (let i = 0; i < floatSquares.length; i++) {
    if (i === selectedSquare) continue;
    const sq = floatSquares[i];
    drawFloatSquare(sq, false, false);
    _withSquareMirror(sq, () => drawFloatSquare(sq, false, true));
  }
  if (selectedSquare >= 0 && selectedSquare < floatSquares.length) {
    const sq = floatSquares[selectedSquare];
    drawFloatSquare(sq, true, false);
    _withSquareMirror(sq, () => drawFloatSquare(sq, false, true));
  }
}

function _drawRotateHandle(sx, sy, hue) {
  ctx.beginPath();
  ctx.arc(sx, sy, 6.0, 0, Math.PI * 2);
  ctx.fillStyle = _huergbLight(hue);
  ctx.fill();
  ctx.strokeStyle = "#0a0e14";
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(sx, sy, 3.0, Math.PI * 0.15, Math.PI * 1.85);
  ctx.strokeStyle = "#0a0e14";
  ctx.lineWidth = 1.2;
  ctx.stroke();
}

function drawFloatSquare(sq, selected, isMirror) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return;
  const q = quads[qi];
  if (!q) return;
  const hue = patchHue(q);

  if (selected && !isMirror) {
    drawHorizon(qi);
    drawBaseReach(qi);
  }

  const pts = squareCornersScreen(sq);
  if (!pts || pts.length < 3) return;

  const fillAlpha   = isMirror ? 0.06 : (selected ? 0.30 : 0.12);
  const strokeAlpha = isMirror ? 0.55 : (selected ? 1.00 : 0.72);
  const lineW       = isMirror ? 1.0  : (selected ? 2.0  : 1.3);

  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = _huergb(hue, fillAlpha);
  ctx.fill();

  ctx.lineJoin = "round";
  ctx.strokeStyle = _huergb(hue, strokeAlpha);
  ctx.lineWidth = lineW;
  ctx.stroke();

  /* Intersection with the patch plane, when tilted. */
  if (sq.slope && Math.abs(sq.slope) > 1e-6) {
    const isect = squarePlaneIntersectionScreen(sq);
    if (isect) {
      ctx.save();
      ctx.setLineDash([4, 3]);
      ctx.strokeStyle = _huergb(hue,
        isMirror ? 0.32 : (selected ? 0.65 : 0.42));
      ctx.lineWidth   = 1.0;
      ctx.beginPath();
      ctx.moveTo(isect[0][0], isect[0][1]);
      ctx.lineTo(isect[1][0], isect[1][1]);
      ctx.stroke();
      ctx.restore();
    }
  }

  /* The mirror gets no corner or rotate handles — it is a visual
     clone, not a second editable object.  The mirror is still
     hit-testable through the Alt pass-through, which see: a click
     on it with Alt held targets the patch that square belongs to. */
  if (!selected || isMirror) return;

  for (const [sx, sy] of pts) {
    ctx.beginPath();
    ctx.arc(sx, sy, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = _huergbLight(hue);
    ctx.fill();
    ctx.strokeStyle = "#0a0e14";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  const rh = squareRotateHandleScreen(sq);
  if (rh) {
    let topIdx = 0;
    for (let k = 1; k < pts.length; k++) {
      if (pts[k][1] < pts[topIdx][1]) topIdx = k;
    }
    ctx.beginPath();
    ctx.moveTo(pts[topIdx][0], pts[topIdx][1]);
    ctx.lineTo(rh[0], rh[1]);
    ctx.strokeStyle = _huergb(hue, 0.45);
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.stroke();
    ctx.setLineDash([]);

    _drawRotateHandle(rh[0], rh[1], hue);
  }
}

/* ==========================================================================
   HIT TESTING — cone band
   ==========================================================================
   The per-square hit test body is factored into _squareHitTestOne so
   that the mirror hit test can reuse it inside _withSquareMirror:
   the square's geometry functions read its current state, so running
   the same body inside the mirror wrapper is what makes the mirror
   hit-testable without duplicating any of the math. */

const SQUARE_HANDLE_R   = 10;
const SQUARE_BODY_MIN_R = 8;

function _ptInQuadPx(px, py, poly) {
  let inside = false;
  const n = poly.length;
  for (let i = 0, j = n - 1; i < n; j = i++) {
    const xi = poly[i][0], yi = poly[i][1];
    const xj = poly[j][0], yj = poly[j][1];
    if (((yi > py) !== (yj > py)) &&
        (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) {
      inside = !inside;
    }
  }
  return inside;
}

/* The order in which squares are hit-tested: the selected square
   first, then every other square in declaration order.  Shared by
   the original and the mirror hit tests so both prefer the same
   square when two overlap. */
function _squareHitOrder() {
  const order = [];
  if (selectedSquare >= 0 && selectedSquare < floatSquares.length) {
    order.push(selectedSquare);
  }
  for (let i = 0; i < floatSquares.length; i++) {
    if (i !== selectedSquare) order.push(i);
  }
  return order;
}

/* Hit-test one square's CURRENT geometry.  The caller is
   responsible for having put the square into whichever state it
   wants tested — the plain hit test calls this directly, and the
   mirror hit test wraps the call in _withSquareMirror. */
function _squareHitTestOne(si, sx, sy) {
  const sq = floatSquares[si];
  if (!sq) return null;

  const pts = squareCornersScreen(sq);
  if (!pts || pts.length < 3) return null;

  const rh = squareRotateHandleScreen(sq);
  if (rh && Math.hypot(sx - rh[0], sy - rh[1]) < ROTATE_HANDLE_R) {
    return { kind: "rotate", squareIdx: si };
  }

  for (let ci = 0; ci < pts.length; ci++) {
    if (Math.hypot(sx - pts[ci][0], sy - pts[ci][1]) < SQUARE_HANDLE_R) {
      return { kind: "corner", squareIdx: si, cornerIdx: ci };
    }
  }

  if (_ptInQuadPx(sx, sy, pts)) return { kind: "body", squareIdx: si };

  let mx = 0, my = 0;
  for (const [x, y] of pts) { mx += x; my += y; }
  mx /= pts.length; my /= pts.length;
  if (Math.hypot(sx - mx, sy - my) < SQUARE_BODY_MIN_R) {
    return { kind: "body", squareIdx: si };
  }
  return null;
}

function squareHitTest(sx, sy) {
  for (const si of _squareHitOrder()) {
    const hit = _squareHitTestOne(si, sx, sy);
    if (hit) return hit;
  }
  return null;
}

/* Hit-test the mirror copies of every square.  Runs each square's
   own hit test inside _withSquareMirror, so it sees the mirrored
   geometry (shifted patch φ, and — when mirrorFlip is on — the
   negated θ, slope, and u).  Used only by the Alt pass-through:
   a click on a mirror square should grab the patch that square
   belongs to, the same way a click on the original does. */
function squareMirrorHitTest(sx, sy) {
  for (const si of _squareHitOrder()) {
    const sq = floatSquares[si];
    if (!sq) continue;
    let hit = null;
    _withSquareMirror(sq, () => {
      hit = _squareHitTestOne(si, sx, sy);
    });
    if (hit) return hit;
  }
  return null;
}

function findPatchAtScreen(sx, sy) {
  for (let qi = quads.length - 1; qi >= 0; qi--) {
    const q = quads[qi];
    const corners = quadCorners(q).map(c => {
      const [wx, wy] = surfacePoint(c.phi, c.s);
      return w2s(wx, wy);
    });
    if (_ptInQuadPx(sx, sy, corners)) return qi;
  }
  return -1;
}

/* ==========================================================================
   INVERSE #1 — shape-relative taper, EXACT (quadratic)
   ==========================================================================
   These solvers assume the shape is FLAT on the patch plane.  A
   tilted shape's corner drag therefore lands the corner at the
   un-tilted (u, v) of the cursor.  Reset slope to 0 for precise
   corner editing in the cone view. */

function cursorToLocalShapeRelativeExactWith(f, qi, vC, pC, vMax,
                                             sx, sy) {
  if (vMax < 1e-6) return screenToFrame(f, sx, sy);

  const A0 = pC + vC / vMax;
  const B0 = 1 / vMax;

  const [ax, ay] = w2s(cone.ax, cone.ay);
  const Sx = sx - ax;
  const Sy = sy - ay;

  const sc = view.scale;
  const sx0 = sc * f.Cx + view.tx;
  const sxu = sc * f.Ux;
  const sxv = sc * f.Vx;
  const sy0 = -sc * f.Cy + view.ty;
  const syu = -sc * f.Uy;
  const syv = -sc * f.Vy;

  const Dx0 = sx0 - ax;
  const Dxu = sxu;
  const Dxv = sxv;
  const Dy0 = sy0 - ay;
  const Dyu = syu;
  const Dyv = syv;

  const K  = Dyu * Sx - Dxu * Sy;
  const M0 = Dyu * Dx0 - Dxu * Dy0;
  const Mv = Dyu * Dxv - Dxu * Dyv;

  const aQuad = B0 * Mv;
  const bQuad = B0 * M0 - A0 * Mv;
  const cQuad = K - A0 * M0;

  let v = null;

  if (Math.abs(aQuad) < 1e-12) {
    if (Math.abs(bQuad) > 1e-12) v = -cQuad / bQuad;
  } else {
    const disc = bQuad * bQuad - 4 * aQuad * cQuad;
    if (disc >= 0) {
      const sq2 = Math.sqrt(disc);
      const r1 = (-bQuad - sq2) / (2 * aQuad);
      const r2 = (-bQuad + sq2) / (2 * aQuad);

      const valid = (r) => {
        if (!isFinite(r)) return false;
        if (r > vMax - 1e-3) return false;
        if (r < -50 * f.vLen) return false;
        const q = A0 - B0 * r;
        if (q <= 1e-6) return false;
        return true;
      };

      const r1ok = valid(r1);
      const r2ok = valid(r2);
      if (r1ok && r2ok) {
        v = Math.abs(r1 - vC) < Math.abs(r2 - vC) ? r1 : r2;
      } else if (r1ok) {
        v = r1;
      } else if (r2ok) {
        v = r2;
      }
    }
  }

  if (v === null || !isFinite(v)) return screenToFrame(f, sx, sy);

  const q = A0 - B0 * v;
  if (Math.abs(q) < 1e-9) return { u: 0, v };

  let u;
  if (Math.abs(Dxu) >= Math.abs(Dyu)) {
    if (Math.abs(Dxu) < 1e-9) return { u: 0, v };
    u = (Sx / q - Dx0 - Dxv * v) / Dxu;
  } else {
    if (Math.abs(Dyu) < 1e-9) return { u: 0, v };
    u = (Sy / q - Dy0 - Dyv * v) / Dyu;
  }
  return { u, v };
}

function cursorToLocalShapeRelativeExact(f, qi, sq, sx, sy) {
  const h = horizonLocal(qi);
  if (!h) return screenToFrame(f, sx, sy);
  const vMax = shapeVMax(sq);
  const vC = sq.v * f.vLen;
  const pC = shapePerspCentre(sq);
  return cursorToLocalShapeRelativeExactWith(f, qi, vC, pC, vMax, sx, sy);
}

/* ==========================================================================
   INVERSE #2 — full per-vertex quadratic (preserved)
   ========================================================================== */

function cursorToLocalFullPersp(f, qi, sx, sy) {
  const h = horizonLocal(qi);
  if (!h) return screenToFrame(f, sx, sy);
  const vMax = h.vHat * f.vLen;
  if (vMax < 1e-6) return screenToFrame(f, sx, sy);

  const [ax, ay] = w2s(cone.ax, cone.ay);
  const SX = sx - ax;
  const SY = sy - ay;

  const sc = view.scale;
  const A =  sc * (f.Cx - cone.ax);
  const B =  sc * f.Ux;
  const C =  sc * f.Vx;
  const D = -sc * (f.Cy - cone.ay);
  const E = -sc * f.Uy;
  const F = -sc * f.Vy;

  const P = E * SX - B * SY;
  const Q = E * A  - B * D;
  const R = E * C  - B * F;

  const a = -R / vMax;
  const b = R - Q / vMax;
  const c = Q - P;

  let v = null;
  if (Math.abs(a) < 1e-12) {
    if (Math.abs(b) > 1e-12) v = -c / b;
  } else {
    const disc = b * b - 4 * a * c;
    if (disc >= 0) {
      const sq = Math.sqrt(disc);
      const r1 = (-b - sq) / (2 * a);
      const r2 = (-b + sq) / (2 * a);
      const ok = (r) => isFinite(r)
                     && r < vMax - 1e-3
                     && r > -50 * f.vLen;
      const r1ok = ok(r1), r2ok = ok(r2);
      if (r1ok && r2ok) v = Math.abs(r1) < Math.abs(r2) ? r1 : r2;
      else if (r1ok) v = r1;
      else if (r2ok) v = r2;
    }
  }

  if (v === null || !isFinite(v)) return screenToFrame(f, sx, sy);

  const pEff = 1 - v / vMax;
  if (Math.abs(pEff) < 1e-9) return { u: 0, v };

  let u;
  if (Math.abs(B) >= Math.abs(E)) {
    if (Math.abs(B) < 1e-9) return { u: 0, v };
    u = (SX / pEff - A - C * v) / B;
  } else {
    u = (SY / pEff - D - F * v) / E;
  }
  return { u, v };
}

/* ==========================================================================
   INVERSE #3 — shape-relative, iterative (preserved)
   ========================================================================== */

function cursorToLocalWithPersp(f, qi, sq, sx, sy) {
  const pC = shapePerspCentre(sq);
  const vMax = shapeVMax(sq);
  const vC = sq.v * f.vLen;
  const [ax, ay] = w2s(cone.ax, cone.ay);

  let uCur = sq.u * f.uLen;
  let vCur = vC;

  for (let iter = 0; iter < 10; iter++) {
    const dv = vCur - vC;
    const p = pC - dv / vMax;
    const pAbs = Math.max(Math.abs(p), 1e-9);
    const invP = (p >= 0 ? 1 : -1) / pAbs;
    const unSx = ax + (sx - ax) * invP;
    const unSy = ay + (sy - ay) * invP;
    const lc = screenToFrame(f, unSx, unSy);
    const du = Math.abs(lc.u - uCur);
    const dvv = Math.abs(lc.v - vCur);
    uCur = lc.u;
    vCur = lc.v;
    if (du < 1e-4 && dvv < 1e-4) break;
  }
  return { u: uCur, v: vCur };
}

/* ==========================================================================
   SHARED EDIT OPERATIONS
   ========================================================================== */

/* Corner resize.

   DEFAULT BRANCH — anchored.  When anchorU / anchorV are supplied,
   the drag keeps the OPPOSITE corner fixed at (anchorU, anchorV)
   and moves only the two edges that meet at the dragged corner.
   The shape's centre shifts to the midpoint of the anchor and the
   cursor.  Both half-extents are clamped to SHAPE_MIN_SCALE, then
   the centre is recomputed from the clamped half-extents and the
   fixed anchor so the anchor stays exactly put even when the cursor
   lands on it.

   SHIFT BRANCH — centred.  When no anchor is supplied, the shape
   resizes about its own centre: the cursor's offset from the
   centre's stored (u, v) sets the new reference half-extents, and
   the centre itself does not move, so all four sides move
   symmetrically.

   The cursor's offset from the shape's centre is mapped to the
   REFERENCE frame by inverting the same map the renderer applies:

       local_u_offset = duR · Ku
       local_v_offset = dvR · Kv

   so duR = local_u_offset / Ku and dvR = local_v_offset / Kv.  The
   resulting duR, dvR are un-rotated to recover the reference half-
   extents, hence the new scaleU / scaleV.

   depthScale is the multiplier the height is drawn at:
   effectiveConeDepth() from the cone band, SHAPE_DEPTH_FLAT from the
   flat band.  It enters only through the reference height's
   normalizer, so the corner follows the cursor in the band the drag
   came from. */

function setShapeFromCornerLocal(sq, cornerIdx, cu, cv, depthScale,
                                 anchorU, anchorV) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return;
  const q = quads[qi];
  if (!q) return;
  const f = patchFrame(qi);
  if (!f) return;

  /* Cursor offset from the shape centre, in local (u, v). */
  const dx = cu - sq.u * f.uLen;
  const dy = cv - sq.v * f.vLen;

  /* Local → reference, via the inverse of (duR · Ku, dvR · Kv). */
  const { Ku, Kv } = _shapeAspectScales(f);
  const ox = dx / Ku;
  const oy = dy / Kv;

  /* Un-rotate, in the reference frame. */
  const cosT = Math.cos(sq.theta || 0);
  const sinT = Math.sin(sq.theta || 0);

  const signs = [[-1, +1], [+1, +1], [+1, -1], [-1, -1]][cornerIdx];
  const sx = signs[0], sy = signs[1];

  const refHWmin = SHAPE_MIN_SCALE * SHAPE_REL_SIZE / 2;
  const refHHmin = SHAPE_MIN_SCALE * SHAPE_REL_SIZE / 2 * depthScale;

  /* ---- anchored branch (default) -------------------------------
     The anchor is the OPPOSITE corner's local position, captured
     at drag start.  We solve for the new half-extents and centre
     from the anchor and the cursor alone; the shape's own rotation
     and the patch's (Ku, Kv) are the same maps the renderer uses,
     so the anchor stays exactly put.

     Derivation (theta = the shape's own theta, unchanged):

         pu = (cursor_u - anchor_u) / (2 * Ku)
         pv = (cursor_v - anchor_v) / (2 * Kv)

         sx*refHW = pu*cosT + pv*sinT
         sy*refHH = pv*cosT - pu*sinT

     so |. | gives the two positive half-extents.  The new centre
     is the midpoint of anchor and cursor in local coordinates. */

  if (anchorU !== undefined && anchorV !== undefined) {
    const midU = (anchorU + cu) / 2;
    const midV = (anchorV + cv) / 2;

    const pu = (cu - anchorU) / (2 * Ku);
    const pv = (cv - anchorV) / (2 * Kv);

    let refHW = pu * cosT + pv * sinT;
    let refHH = pv * cosT - pu * sinT;

    refHW = Math.max(Math.abs(refHW), refHWmin);
    refHH = Math.max(Math.abs(refHH), refHHmin);

    sq.scaleU = refHW / (SHAPE_REL_SIZE / 2);
    sq.scaleV = refHH / (SHAPE_REL_SIZE / 2 * depthScale);
    clampShapeScales(sq);

    /* Recompute the centre from the anchor using the (possibly
       clamped) half-extents and the dragged corner's reference
       sign pair, so the anchor stays exactly fixed even when a
       half-extent has been clamped to its minimum. */
    const duR = sx * refHW * cosT - sy * refHH * sinT;
    const dvR = sx * refHW * sinT + sy * refHH * cosT;
    const uHat = (anchorU + duR * Ku) / f.uLen;
    const vHat = (anchorV + dvR * Kv) / f.vLen;
    sq.u = uHat;
    sq.v = clampCloneV(qi, vHat);
    return;
  }

  /* ---- centred branch (Shift-held) -----------------------------
     The cursor's offset from the shape's centre sets the new
     reference half-extents; the centre is not moved, so all four
     sides move symmetrically. */

  const ux = ox * cosT + oy * sinT;
  const uy = oy * cosT - ox * sinT;

  const refHW = Math.max(sx * ux, refHWmin);
  const refHH = Math.max(sy * uy, refHHmin);

  sq.scaleU = refHW / (SHAPE_REL_SIZE / 2);
  sq.scaleV = refHH / (SHAPE_REL_SIZE / 2 * depthScale);
  clampShapeScales(sq);
}

/* Rotate-handle tracking.  The cursor's offset from the shape centre
   is mapped to the REFERENCE frame; the handle sits on the reference
   +v̂ axis, so the raw angle is atan2(−ox_ref, oy_ref). */

function setShapeRotationFromCursorLocal(sq, cu, cv, snap, startTheta) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return;
  const f = patchFrame(qi);
  if (!f) return;

  const { Ku, Kv } = _shapeAspectScales(f);
  const ox = (cu / f.uLen - sq.u) / Ku;
  const oy = (cv / f.vLen - sq.v) / Kv;

  if (Math.abs(ox) < 1e-9 && Math.abs(oy) < 1e-9) return;

  const thetaRaw = Math.atan2(-ox, oy);

  if (snap && typeof startTheta === "number") {
    let delta = thetaRaw - startTheta;
    while (delta >  Math.PI) delta -= 2 * Math.PI;
    while (delta < -Math.PI) delta += 2 * Math.PI;
    sq.theta = startTheta +
               Math.round(delta / ROTATE_JUMP_STEP) * ROTATE_JUMP_STEP;
    return;
  }

  sq.theta = thetaRaw;
}

/* ==========================================================================
   QUICK-ROTATE OPERATIONS
   ========================================================================== */

function alignShapeToAxis(sq) {
  const step = Math.PI / 4;
  const theta = sq.theta || 0;
  sq.theta = Math.round(theta / step) * step;
}

function alignSelectedShapeToAxis() {
  if (selectedSquare < 0 || selectedSquare >= floatSquares.length) {
    if (typeof flashStatus === "function") {
      flashStatus("No shape selected", "warn");
    }
    return false;
  }
  alignShapeToAxis(floatSquares[selectedSquare]);
  draw();
  return true;
}

/* ==========================================================================
   CONE-BAND EDIT WRAPPERS
   ==========================================================================
   resizeSquareFromCorner takes an optional anchor.  When both
   anchorU and anchorV are supplied, the resize is anchored on that
   fixed local point (the opposite corner) — the default behaviour.
   When they are not supplied, the resize is centred on the shape's
   own (u, v) — the Shift-held behaviour.  pg_dispatch reads Shift
   at each move event and passes the drag-start anchor when the
   anchored branch is active. */

function resizeSquareFromCorner(sq, cornerIdx, cursorWX, cursorWY,
                                 anchorU, anchorV) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return;
  const f = patchFrame(qi);
  if (!f) return;
  const [sx, sy] = w2s(cursorWX, cursorWY);
  const lc = cursorToLocalShapeRelativeExact(f, qi, sq, sx, sy);
  if (anchorU !== undefined && anchorV !== undefined) {
    setShapeFromCornerLocal(sq, cornerIdx, lc.u, lc.v,
                             effectiveConeDepth(), anchorU, anchorV);
  } else {
    setShapeFromCornerLocal(sq, cornerIdx, lc.u, lc.v,
                             effectiveConeDepth());
  }
}

function rotateSquareToCursor(sq, cursorWX, cursorWY, snap, startTheta) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return;
  const f = patchFrame(qi);
  if (!f) return;
  const [sx, sy] = w2s(cursorWX, cursorWY);
  const lc = cursorToLocalShapeRelativeExact(f, qi, sq, sx, sy);
  setShapeRotationFromCursorLocal(sq, lc.u, lc.v, snap, startTheta);
}

/* ==========================================================================
   FLAT-VIEW PROJECTION
   ==========================================================================
   The flat view ignores slope: it draws the shape's un-tilted (φ, s)
   footprint, so editing in that band stays exact. */

function squareFlatCorners(sq) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return null;
  const q = quads[qi];
  const f = patchFrame(qi);
  if (!f) return null;
  const locals = squareCornersLocal(sq);
  if (!locals) return null;
  const phiC = (q.phi0 + q.phi1) / 2;
  const sC   = (q.s0   + q.s1)   / 2;
  const dPhi = q.phi1 - q.phi0;
  const dS   = q.s1   - q.s0;
  return locals.map(([u, v]) => [
    phiC + (u / f.uLen) * dPhi,
    sC   + (v / f.vLen) * dS,
  ]);
}

function squareFlatCornersScreen(sq, shift) {
  const corners = squareFlatCorners(sq);
  if (!corners) return null;
  return corners.map(([phi, s]) => flatToScreen(phi + shift, s));
}

function squareFlatRotateHandleScreen(sq, shift) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return null;
  const q = quads[qi];
  const f = patchFrame(qi);
  if (!f) return null;
  const hl = squareRotateHandleLocal(sq);
  if (!hl) return null;

  const phiC = (q.phi0 + q.phi1) / 2;
  const sC   = (q.s0   + q.s1)   / 2;
  const dPhi = q.phi1 - q.phi0;
  const dS   = q.s1   - q.s0;
  const phi  = phiC + (hl[0] / f.uLen) * dPhi + (shift || 0);

  let s = sC + (hl[1] / f.vLen) * dS;

  const S_MAX = 1 - 0.02;
  if (s > S_MAX) s = S_MAX;

  return flatToScreen(phi, s);
}

/* ==========================================================================
   FLAT-VIEW EDIT WRAPPERS
   ==========================================================================
   flatResizeSquareFromCornerIdx mirrors resizeSquareFromCorner: when
   anchorU / anchorV are supplied the resize is anchored on that
   fixed local point (the opposite corner) — the default behaviour.
   When they are not supplied, the resize is centred on the shape's
   own (u, v) — the Shift-held behaviour.  The flat band uses
   SHAPE_DEPTH_FLAT for the depth multiplier, so the anchor is
   captured and used at the same scale. */

function flatCursorToShapeLocal(sq, sx, sy) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return null;
  const q = quads[qi];
  const f = patchFrame(qi);
  if (!f) return null;
  const { phi, s } = screenToFlat(sx, sy);
  const phiAdj = phi + _phiShiftForPatch(phi, q.phi0, q.phi1);
  const phiC = (q.phi0 + q.phi1) / 2;
  const sC   = (q.s0   + q.s1)   / 2;
  const dPhi = q.phi1 - q.phi0;
  const dS   = q.s1   - q.s0;
  if (Math.abs(dPhi) < 1e-9 || Math.abs(dS) < 1e-9) return null;
  const uHat = (phiAdj - phiC) / dPhi;
  const vHat = (s      - sC)   / dS;
  return { u: uHat * f.uLen, v: vHat * f.vLen };
}

function flatResizeSquareFromCornerIdx(sq, sx, sy, cornerIdx,
                                        anchorU, anchorV) {
  const lc = flatCursorToShapeLocal(sq, sx, sy);
  if (!lc) return;
  if (anchorU !== undefined && anchorV !== undefined) {
    setShapeFromCornerLocal(sq, cornerIdx, lc.u, lc.v, SHAPE_DEPTH_FLAT,
                             anchorU, anchorV);
  } else {
    setShapeFromCornerLocal(sq, cornerIdx, lc.u, lc.v, SHAPE_DEPTH_FLAT);
  }
}

function flatRotateSquareToCursor(sq, sx, sy, snap, startTheta) {
  const lc = flatCursorToShapeLocal(sq, sx, sy);
  if (!lc) return;
  setShapeRotationFromCursorLocal(sq, lc.u, lc.v, snap, startTheta);
}

function flatMoveSquareBody(sq, sx, sy) {
  const lc = flatCursorToShapeLocal(sq, sx, sy);
  if (!lc) return;
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return;
  setClonePosition(sq, lc.u, lc.v);
}

/* ==========================================================================
   FLAT-VIEW HIT TEST
   ==========================================================================
   Same split as the cone band: the per-square body lives in
   _squareFlatHitTestOne, so a mirror variant can run the exact same
   body inside _withSquareMirror. */

function _squareFlatHitTestOne(si, sx, sy) {
  const sq = floatSquares[si];
  if (!sq) return null;

  const corners = squareFlatCorners(sq);
  if (!corners) return null;
  const phis = corners.map(c => c[0]);
  const shifts = _phiCopies(Math.min(...phis), Math.max(...phis));

  for (const shift of shifts) {
    const rh = squareFlatRotateHandleScreen(sq, shift);
    if (rh && Math.hypot(sx - rh[0], sy - rh[1]) < ROTATE_HANDLE_R) {
      return { kind: "rotate", squareIdx: si };
    }
  }

  for (const shift of shifts) {
    const screen = corners.map(([phi, s]) =>
      flatToScreen(phi + shift, s));

    for (let ci = 0; ci < 4; ci++) {
      if (Math.hypot(sx - screen[ci][0], sy - screen[ci][1])
          < FLAT_HANDLE_R) {
        return { kind: "corner", squareIdx: si, cornerIdx: ci };
      }
    }

    if (_ptInQuadPx(sx, sy, screen)) {
      return { kind: "body", squareIdx: si };
    }
  }
  return null;
}

function squareFlatHitTest(sx, sy) {
  if (selectedQuad < 0 || selectedQuad >= quads.length) return null;
  const activeQ = quads[selectedQuad];
  for (let i = floatSquares.length - 1; i >= 0; i--) {
    if (floatSquares[i].quadId !== activeQ.id) continue;
    const hit = _squareFlatHitTestOne(i, sx, sy);
    if (hit) return hit;
  }
  return null;
}

/* Same shape as squareFlatHitTest, but each square is tested inside
   _withSquareMirror.  Only the selected patch's squares are
   considered — the flat band only draws the selected patch's mirror
   copies, so only those can be clicked. */
function squareFlatMirrorHitTest(sx, sy) {
  if (selectedQuad < 0 || selectedQuad >= quads.length) return null;
  const activeQ = quads[selectedQuad];
  for (let i = floatSquares.length - 1; i >= 0; i--) {
    const sq = floatSquares[i];
    if (sq.quadId !== activeQ.id) continue;
    let hit = null;
    _withSquareMirror(sq, () => {
      hit = _squareFlatHitTestOne(i, sx, sy);
    });
    if (hit) return hit;
  }
  return null;
}

/* ==========================================================================
   DISPLAY NAMES
   ========================================================================== */

function squareDisplayName(sq) {
  return (sq && sq.name) ? sq.name : ("S" + (sq ? sq.id : "?"));
}

/* ==========================================================================
   LABEL RENDERING
   ========================================================================== */

function _drawShapeLabel(sx, sy, text, color) {
  if (!text) return;
  ctx.save();
  ctx.font = "700 10px 'JetBrains Mono', 'Fira Code', monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const w = ctx.measureText(text).width;
  const padX = 6;
  const h = 14;

  ctx.fillStyle = "rgba(10, 14, 20, 0.86)";
  ctx.fillRect(sx - w / 2 - padX, sy - h / 2, w + 2 * padX, h);

  ctx.strokeStyle = color;
  ctx.lineWidth = 0.8;
  ctx.strokeRect(sx - w / 2 - padX + 0.4, sy - h / 2 + 0.4,
                 w + 2 * padX - 0.8, h - 0.8);

  ctx.fillStyle = color;
  ctx.fillText(text, sx, sy + 0.5);
  ctx.restore();
}

function _patchCentreScreenCone(q) {
  const pts = quadCorners(q).map(c => {
    const [wx, wy] = surfacePoint(c.phi, c.s);
    return w2s(wx, wy);
  });
  let cx = 0, cy = 0;
  for (const [x, y] of pts) { cx += x; cy += y; }
  return [cx / 4, cy / 4];
}

function _shapeCentreScreenCone(sq) {
  const pts = squareCornersScreen(sq);
  if (!pts || pts.length < 1) return null;
  let cx = 0, cy = 0;
  for (const [x, y] of pts) { cx += x; cy += y; }
  return [cx / pts.length, cy / pts.length];
}

function _patchCentreScreenFlat(q, shift) {
  const pts = quadCorners(q).map(c =>
    flatToScreen(c.phi + shift, c.s));
  let cx = 0, cy = 0;
  for (const [x, y] of pts) { cx += x; cy += y; }
  return [cx / 4, cy / 4];
}

function _shapeCentreScreenFlat(sq, shift) {
  const corners = squareFlatCorners(sq);
  if (!corners) return null;
  const pts = corners.map(([phi, s]) => flatToScreen(phi + shift, s));
  let cx = 0, cy = 0;
  for (const [x, y] of pts) { cx += x; cy += y; }
  return [cx / 4, cy / 4];
}

function drawShapeLabelsCone() {
  for (let qi = 0; qi < quads.length; qi++) {
    const q = quads[qi];
    const hue = patchHue(q);
    const [cx, cy] = _patchCentreScreenCone(q);
    _drawShapeLabel(cx, cy, q.name, _huergb(hue, 0.92));
  }

  for (let i = 0; i < floatSquares.length; i++) {
    const sq = floatSquares[i];
    const qi = quadIdxById(sq.quadId);
    const q = qi >= 0 ? quads[qi] : null;
    const hue = patchHue(q);
    const c = _shapeCentreScreenCone(sq);
    if (!c) continue;
    _drawShapeLabel(c[0], c[1], squareDisplayName(sq),
                    _huergb(hue, 0.95));
  }
}

function drawShapeLabelsFlat() {
  for (let qi = 0; qi < quads.length; qi++) {
    const q = quads[qi];
    const hue = patchHue(q);
    const shifts = _phiCopies(q.phi0, q.phi1);
    for (const shift of shifts) {
      const [cx, cy] = _patchCentreScreenFlat(q, shift);
      if (_flatInsideRect(cx, cy)) {
        _drawShapeLabel(cx, cy, q.name, _huergb(hue, 0.92));
        break;
      }
    }
  }

  if (selectedQuad < 0 || selectedQuad >= quads.length) return;
  const activeQ = quads[selectedQuad];
  const activeHue = patchHue(activeQ);

  for (let i = 0; i < floatSquares.length; i++) {
    const sq = floatSquares[i];
    if (sq.quadId !== activeQ.id) continue;

    const corners = squareFlatCorners(sq);
    if (!corners) continue;
    const phis = corners.map(c => c[0]);
    const shifts = _phiCopies(Math.min(...phis), Math.max(...phis));

    for (const shift of shifts) {
      const c = _shapeCentreScreenFlat(sq, shift);
      if (!c) continue;
      if (_flatInsideRect(c[0], c[1])) {
        _drawShapeLabel(c[0], c[1], squareDisplayName(sq),
                        _huergb(activeHue, 0.95));
        break;
      }
    }
  }
}

/* ==========================================================================
   VISUAL STATE EXPORT
   ========================================================================== */

function _round3(v) { return Math.round(v * 1000) / 1000; }

function _screenSideLengths(pts) {
  const out = [];
  for (let i = 0; i < 4; i++) {
    const a = pts[i];
    const b = pts[(i + 1) % 4];
    out.push(_round3(Math.hypot(b[0] - a[0], b[1] - a[1])));
  }
  return out;
}

function _worldSideLengths(pts) {
  const out = [];
  for (let i = 0; i < 4; i++) {
    const a = pts[i];
    const b = pts[(i + 1) % 4];
    out.push(_round3(Math.hypot(b[0] - a[0], b[1] - a[1])));
  }
  return out;
}

function buildVisualStateExport() {
  const out = {
    schemaVersion: 7,
    generatedAt:   new Date().toISOString(),

    cone: {
      ax:            _round3(cone.ax),
      ay:            _round3(cone.ay),
      depth:         _round3(cone.depth),
      halfAngleRad:  _round3(cone.halfAngle),
      halfAngleDeg:  _round3(cone.halfAngle * 180 / Math.PI),
      ringCount:     cone.ringCount,
      meridianCount: cone.meridianCount,
      R_world:       _round3(coneR()),
    },

    shapeDepthCone: SHAPE_DEPTH_CONE,
    shapeDepthFlat: SHAPE_DEPTH_FLAT,

    view: {
      scale: _round3(view.scale),
      tx:    _round3(view.tx),
      ty:    _round3(view.ty),
      zoom:  _round3(view.zoom),
    },

    layout: {
      coneH:     layout.coneH,
      dividerY:  layout.dividerY,
      reservedY: layout.reservedY,
      reservedH: layout.reservedH,
    },

    patches: [],
    shapes:  [],
  };

  for (const q of quads) {
    const qi = quads.indexOf(q);
    const f = patchFrame(qi);

    const entry = {
      id:   q.id,
      name: q.name,
      phi0: _round3(q.phi0),
      phi1: _round3(q.phi1),
      s0:   _round3(q.s0),
      s1:   _round3(q.s1),
    };

    if (f) {
      entry.frame = {
        Cx:   _round3(f.Cx),
        Cy:   _round3(f.Cy),
        Ux:   _round3(f.Ux),
        Uy:   _round3(f.Uy),
        Vx:   _round3(f.Vx),
        Vy:   _round3(f.Vy),
        uLen: _round3(f.uLen),
        vLen: _round3(f.vLen),
        det:  _round3(f.det),
      };

      entry.cornersScreenCone = quadCorners(q).map(c => {
        const [wx, wy] = surfacePoint(c.phi, c.s);
        const [sx, sy] = w2s(wx, wy);
        return [_round3(sx), _round3(sy)];
      });

      entry.cornersScreenFlat = quadCorners(q).map(c => {
        const [sx, sy] = flatToScreen(c.phi, c.s);
        return [_round3(sx), _round3(sy)];
      });
    }

    out.patches.push(entry);
  }

  for (let i = 0; i < floatSquares.length; i++) {
    const sq = floatSquares[i];
    const qi = quadIdxById(sq.quadId);
    if (qi < 0) continue;
    const f = patchFrame(qi);

    const entry = {
      id:     sq.id,
      name:   squareDisplayName(sq),
      quadId: sq.quadId,
      index:  i,
      u:      _round3(sq.u),
      v:      _round3(sq.v),
      scaleU: _round3(sq.scaleU),
      scaleV: _round3(sq.scaleV),
      thetaRad: _round3(sq.theta || 0),
      thetaDeg: _round3((sq.theta || 0) * 180 / Math.PI),
      slopeRad: _round3(sq.slope || 0),
      slopeDeg: _round3((sq.slope || 0) * 180 / Math.PI),
      visualBottom: !!sq.visualBottom,
    };

    if (!f) {
      out.shapes.push(entry);
      continue;
    }

    entry.uLen = _round3(f.uLen);
    entry.vLen = _round3(f.vLen);
    entry.extentVNorm = _round3(shapeVExtentNorm(sq));

    const local = squareCornersLocal(sq);
    const world = local.map(([u, v]) => frameToWorld(f, u, v));
    const dims  = squareDims(sq);

    entry.dims     = { w: _round3(dims.w), h: _round3(dims.h) };
    entry.dimsCone = (function () {
      const d = squareDimsCone(sq);
      return { w: _round3(d.w), h: _round3(d.h) };
    })();

    entry.cornersLocal = local.map(p =>
      [_round3(p[0]), _round3(p[1])]);
    entry.cornersWorld = world.map(p =>
      [_round3(p[0]), _round3(p[1])]);
    entry.worldSideLengths = _worldSideLengths(world);

    entry.perspCentre = _round3(shapePerspCentre(sq));
    entry.vMax        = _round3(shapeVMax(sq));

    const screenCone = squareCornersScreen(sq);
    if (screenCone) {
      entry.cornersScreenCone = screenCone.map(p =>
        [_round3(p[0]), _round3(p[1])]);
      entry.screenSideLengthsCone = _screenSideLengths(screenCone);
    }

    const flatCorners = squareFlatCorners(sq);
    if (flatCorners) {
      const screenFlat = flatCorners.map(([phi, s]) =>
        flatToScreen(phi, s));
      entry.cornersFlatParam = flatCorners.map(p =>
        [_round3(p[0]), _round3(p[1])]);
      entry.cornersScreenFlat = screenFlat.map(p =>
        [_round3(p[0]), _round3(p[1])]);
      entry.screenSideLengthsFlat = _screenSideLengths(screenFlat);
    }

    out.shapes.push(entry);
  }

  return out;
}

function exportVisualStateJSON() {
  const data = buildVisualStateExport();
  const text = JSON.stringify(data, null, 2);
  const url  = "data:application/json;charset=utf-8,"
             + encodeURIComponent(text);

  const a = document.createElement("a");
  a.href = url;
  a.download = "cone_visual_state.json";
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  if (typeof flashStatus === "function") {
    flashStatus("Exported " + quads.length + " patch(es) and " +
                floatSquares.length + " shape(s)", "ok");
  }
}

/* ==========================================================================
   .KRA EXPORT
   ========================================================================== */

function _hueToHex(h) {
  const to2 = (v) => Math.max(0, Math.min(255, Math.round(v)))
                        .toString(16).padStart(2, "0");
  return "#" + to2(h.r) + to2(h.g) + to2(h.b);
}

function _hueToHexLight(h) {
  const mix = (v) => Math.round(v * 0.5 + 255 * 0.5);
  const to2 = (v) => v.toString(16).padStart(2, "0");
  return "#" + to2(mix(h.r)) + to2(mix(h.g)) + to2(mix(h.b));
}

function _polygonCentroid(pts) {
  let cx = 0, cy = 0;
  for (const [x, y] of pts) { cx += x; cy += y; }
  return [cx / pts.length, cy / pts.length];
}

function _polygonArea(pts) {
  let area = 0;
  const n = pts.length;
  for (let i = 0; i < n; i++) {
    const a = pts[i];
    const b = pts[(i + 1) % n];
    area += a[0] * b[1] - b[0] * a[1];
  }
  return Math.abs(area) / 2;
}

function _unclippedProjectedCorners(sq) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return null;
  const f = patchFrame(qi);
  if (!f) return null;
  const local = squareCornersLocalCone(sq);
  if (!local) return null;

  const vC = sq.v * f.vLen;
  const pC = shapePerspCentre(sq);
  const vMax = shapeVMax(sq);
  const phiC = _patchNormalPhi(qi);
  const slope = sq.slope || 0;

  return local.map(([u, v]) =>
    projectShapePoint(f, qi, u, v, vC, pC, vMax, phiC, slope));
}

/* ==========================================================================
   READING DIRECTION — TWO SOURCES
   ==========================================================================
   The label's baseline runs along whichever edge of the drawn polygon
   is read as the shape's "bottom".  Two candidate edges exist, and
   the per-square `visualBottom` flag picks between them:

     visualBottom falsy  — the shape's own LONGEST edge in screen
                           space (_longestEdgeDir).  This is the
                           historical behaviour and the default.

     visualBottom truthy — the VISUAL BOTTOM of the scene: the edge
                           whose midpoint sits lowest on screen
                           (_bottomEdgeDir).

   Both helpers return a unit vector pointing along the chosen edge
   with bx >= 0, so the reading angle lies in [-90°, +90°].  See the
   module docstring, TEXT BOTTOM — TWO MODES. */

function _longestEdgeDir(pts) {
  let bestLen = 0, bx = 0, by = 0;
  const n = pts.length;
  for (let i = 0; i < n; i++) {
    const a = pts[i];
    const b = pts[(i + 1) % n];
    const dx = b[0] - a[0];
    const dy = b[1] - a[1];
    const len = Math.hypot(dx, dy);
    if (len > bestLen) {
      bestLen = len;
      bx = dx / len;
      by = dy / len;
    }
  }
  if (bestLen < 1e-6) return null;
  return [bx, by];
}

/* Direction of the shape's bottom edge as it appears on screen: the
   edge whose midpoint has the largest y, i.e. sits lowest on screen
   (screen y grows downward).  Returned as a unit vector from the
   edge's left endpoint to its right endpoint, so bx >= 0.  Works on
   any polygon — the shape is fed in its clipped form, so a shape
   that overhangs the horizon is judged on its drawn bottom edge,
   not on the invisible part beyond the clip. */
function _bottomEdgeDir(screenPts) {
  if (!screenPts || screenPts.length < 3) return null;
  const n = screenPts.length;
  let bestMidY = -Infinity;
  let bestI = -1;
  for (let i = 0; i < n; i++) {
    const a = screenPts[i];
    const b = screenPts[(i + 1) % n];
    const midY = (a[1] + b[1]) / 2;
    if (midY > bestMidY) {
      bestMidY = midY;
      bestI = i;
    }
  }
  if (bestI < 0) return null;
  let a = screenPts[bestI];
  let b = screenPts[(bestI + 1) % n];
  if (a[0] > b[0]) { const t = a; a = b; b = t; }
  const dx = b[0] - a[0];
  const dy = b[1] - a[1];
  const len = Math.hypot(dx, dy);
  if (len < 1e-6) return null;
  return [dx / len, dy / len];
}

function _shapeLabelScreenAngleDeg(sq, screenPts) {
  if (!screenPts || screenPts.length < 3) return 0;

  /* Per-square mode selector.  Undefined / false keeps the
     historical longest-edge behaviour; true switches to the visual
     bottom of the scene.  See the module docstring, TEXT BOTTOM —
     TWO MODES. */
  const useVisualBottom = !!(sq && sq.visualBottom);
  const baseDir = useVisualBottom
    ? _bottomEdgeDir(screenPts)
    : _longestEdgeDir(screenPts);
  if (!baseDir) return 0;

  let bx = baseDir[0];
  let by = baseDir[1];
  if (bx < 0) { bx = -bx; by = -by; }

  return Math.atan2(by, bx) * 180 / Math.PI;
}

function _shapeLabelFlatRotationDeg(sq, screenPts) {
  if (!screenPts || screenPts.length < 4) return 0;

  const ux = screenPts[1][0] - screenPts[0][0];
  const uy = screenPts[1][1] - screenPts[0][1];

  const vx = screenPts[3][0] - screenPts[0][0];
  const vy = screenPts[3][1] - screenPts[0][1];

  const angleU = Math.atan2(uy, ux) * 180 / Math.PI;
  const angleV = Math.atan2(vy, vx) * 180 / Math.PI;

  const target = _shapeLabelScreenAngleDeg(sq, screenPts);

  const candidates = [
    { r:   0, projected: angleU },
    { r:  90, projected: angleV },
    { r: 180, projected: angleU + 180 },
    { r: 270, projected: angleV + 180 },
  ];

  const angDiff = (a, b) => {
    let d = a - b;
    while (d >  180) d -= 360;
    while (d < -180) d += 360;
    return Math.abs(d);
  };

  let best = candidates[0];
  let bestD = angDiff(candidates[0].projected, target);
  for (let i = 1; i < candidates.length; i++) {
    const d = angDiff(candidates[i].projected, target);
    if (d < bestD) { bestD = d; best = candidates[i]; }
  }
  return best.r;
}

function _classifyCornersInReadingFrame(visualPts, readingAngleDeg) {
  const rad = readingAngleDeg * Math.PI / 180;
  const bx = Math.cos(rad);
  const by = Math.sin(rad);
  const dx = -by;
  const dy = bx;

  const coords = [];
  for (let i = 0; i < 4; i++) {
    const px = visualPts[i][0];
    const py = visualPts[i][1];
    coords.push({
      X: px * bx + py * by,
      Y: px * dx + py * dy,
    });
  }

  let tlI = 0, trI = 0, brI = 0, blI = 0;
  let bestTL = Infinity, bestTR = -Infinity;
  let bestBR = -Infinity, bestBL = Infinity;
  for (let i = 0; i < 4; i++) {
    const X = coords[i].X, Y = coords[i].Y;
    const sTL = X + Y;
    const sTR = X - Y;
    const sBR = X + Y;
    const sBL = X - Y;

    if (sTL < bestTL) { bestTL = sTL; tlI = i; }
    if (sTR > bestTR) { bestTR = sTR; trI = i; }
    if (sBR > bestBR) { bestBR = sBR; brI = i; }
    if (sBL < bestBL) { bestBL = sBL; blI = i; }
  }

  return { tl: tlI, tr: trI, br: brI, bl: blI };
}

function _flatAnchorFromVisual(visualPts, W, H, position,
                               padFrac, fontSize, textLen,
                               readingAngleDeg, flatRotationDeg) {
  if (!position || position === "center" ||
      !visualPts || visualPts.length < 4) {
    return { x: W / 2, y: H / 2 };
  }

  const pad = padFrac * Math.min(W, H);

  const textPixelLen = textLen * fontSize * 0.55;
  const textPixelH = fontSize;
  let textHalfW, textHalfH;
  if (flatRotationDeg === 90 || flatRotationDeg === 270) {
    textHalfW = textPixelH / 2;
    textHalfH = textPixelLen / 2;
  } else {
    textHalfW = textPixelLen / 2;
    textHalfH = textPixelH / 2;
  }

  const roles = _classifyCornersInReadingFrame(visualPts, readingAngleDeg);

  const flatCorners = [[0, 0], [W, 0], [W, H], [0, H]];

  function anchorForCorner(idx) {
    const fx = flatCorners[idx][0];
    const fy = flatCorners[idx][1];
    const dirX = (fx < W / 2) ? 1 : ((fx > W / 2) ? -1 : 0);
    const dirY = (fy < H / 2) ? 1 : ((fy > H / 2) ? -1 : 0);
    return {
      x: fx + dirX * (pad + textHalfW),
      y: fy + dirY * (pad + textHalfH),
    };
  }

  const aTL = anchorForCorner(roles.tl);
  const aTR = anchorForCorner(roles.tr);
  const aBR = anchorForCorner(roles.br);
  const aBL = anchorForCorner(roles.bl);

  if (position === "tl") return aTL;
  if (position === "tr") return aTR;
  if (position === "br") return aBR;
  if (position === "bl") return aBL;
  if (position === "top") {
    return { x: (aTL.x + aTR.x) / 2, y: (aTL.y + aTR.y) / 2 };
  }
  if (position === "bottom") {
    return { x: (aBL.x + aBR.x) / 2, y: (aBL.y + aBR.y) / 2 };
  }
  if (position === "left") {
    return { x: (aTL.x + aBL.x) / 2, y: (aTL.y + aBL.y) / 2 };
  }
  if (position === "right") {
    return { x: (aTR.x + aBR.x) / 2, y: (aTR.y + aBR.y) / 2 };
  }
  return { x: W / 2, y: H / 2 };
}

/* ==========================================================================
   POSITION-AWARE ALIGNMENT
   ==========================================================================
   _flatAnchorFromVisual returns the anchor of the text's visual CENTER
   for the requested position.  The alignment the daemon writes then
   determines where, along the reading direction, that anchor sits
   relative to the text's visual box:

       left    anchor at the box's -half-length end (start)
       center  anchor at the box's middle
       right   anchor at the box's +half-length end

   So the visual box keeps the same center regardless of alignment,
   and the anchor shifts along the reading direction by:

       left    -halfLen * (cos R, sin R)
       center   0
       right   +halfLen * (cos R, sin R)

   The alignment is chosen from the requested visual position: a text
   anchored at a right-hand corner or edge uses right alignment; at a
   left-hand corner or edge uses left; at the top, bottom, or center
   uses center. */

function _alignmentForPosition(position) {
    if (position === "tr" || position === "br" || position === "right") {
        return "right";
    }
    if (position === "top" || position === "bottom" || position === "center") {
        return "center";
    }
    return "left";
}

function _anchorForPosition(anchorCenter, flatRotation, textLen, fontSize,
                            position) {
    const alignment = _alignmentForPosition(position);
    const rad = flatRotation * Math.PI / 180;
    const halfLen = (textLen * fontSize * 0.55) / 2;

    let dx = 0, dy = 0;
    if (alignment === "left") {
        dx = -halfLen * Math.cos(rad);
        dy = -halfLen * Math.sin(rad);
    } else if (alignment === "right") {
        dx = halfLen * Math.cos(rad);
        dy = halfLen * Math.sin(rad);
    }

    return {
        x: anchorCenter.x + dx,
        y: anchorCenter.y + dy,
        alignment: alignment,
    };
}

/* ==========================================================================
   AFFINE DECOMPOSITION
   ==========================================================================
   Any invertible 2x2 matrix M can be written uniquely as

       M = R(theta) * Shx(k) * S(sx, sy)

   where R is a rotation, Shx is a horizontal shear (x gains k*y per
   unit y), and S is a diagonal scale.  Solving the components gives:

       sx        = sqrt(M00^2 + M10^2)
       sy        = det(M) / sx
       theta_rad = atan2(M10, M00)
       k         = (M01*M00 + M11*M10) / det(M)

   where M is given in column-vector form:

       M = [[M00, M01],
            [M10, M11]]

   Returns null for a degenerate matrix (|det| or |sx| too small). */

function _decomposeAffineLocal(M00, M01, M10, M11) {
  const det = M00 * M11 - M01 * M10;
  const sxRaw = Math.sqrt(M00 * M00 + M10 * M10);
  if (sxRaw < 1e-9 || Math.abs(det) < 1e-9) return null;

  const syRaw = det / sxRaw;
  const rotationRad = Math.atan2(M10, M00);
  const shear = (M01 * M00 + M11 * M10) / det;

  return {
    rotation_rad: rotationRad,
    rotation_deg: rotationRad * 180 / Math.PI,
    shear: shear,
    scale_x: sxRaw,
    scale_y: syRaw,
    det: det,
  };
}

/* ==========================================================================
   SQUARE MODE
   ==========================================================================
   Same structure as before, but each entry now also carries a
   `label` — the plain text to write into the vector shape — so the
   layer name (`name`) and the text content can differ.  The mirror
   pass uses `name + "_mirror"` for the layer and the original
   `label` for the text. */

function _kraShapeEntry(sq, options, nameSuffix) {
  const textPos   = options.text_position || "center";
  const padFrac   = (typeof options.text_padding === "number")
                      ? options.text_padding : 0.06;
  const colorMode = options.text_color_mode || "color";

  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return null;
  const q = quads[qi];
  if (!q) return null;

  const corners = _unclippedProjectedCorners(sq);
  if (!corners || corners.length < 4) return null;

  const lens = (function () {
    const n = corners.length;
    const s = [];
    for (let k = 0; k < n; k++) {
      const a = corners[k];
      const b = corners[(k + 1) % n];
      s.push(Math.hypot(b[0] - a[0], b[1] - a[1]));
    }
    return s;
  })();
  const W = (lens[0] + lens[2]) / 2;
  const H = (lens[1] + lens[3]) / 2;
  if (W <= 0.5 || H <= 0.5) return null;

  const hue = patchHue(q);
  const hex = _hueToHex(hue);
  const hexLight = _hueToHexLight(hue);

  const textColor = (colorMode === "black") ? "#000000" : hexLight;

  const screenCorners = squareCornersScreen(sq) || corners;
  const flatRotation = _shapeLabelFlatRotationDeg(sq, screenCorners);
  const readingAngle  = _shapeLabelScreenAngleDeg(sq, screenCorners);

  const label     = squareDisplayName(sq);
  const layerName = label + (nameSuffix || "");
  const fontNat   = Math.min(W, H) * 0.40;

  const anchorCenter = _flatAnchorFromVisual(
    screenCorners, W, H, textPos, padFrac, fontNat, label.length,
    readingAngle, flatRotation
  );
  const anchor = _anchorForPosition(
    anchorCenter, flatRotation, label.length, fontNat, textPos
  );

  return {
    name:            layerName,
    label:           label,
    points:          corners.map(([x, y]) => [x, y]),
    natural_w:       W,
    natural_h:       H,
    flat_rotation:   flatRotation,
    text_anchor:     anchor,
    fill:            hex,
    fill_opacity:    0.40,
    stroke:          hex,
    stroke_width:    2.0,
    stroke_opacity:  1.0,
    text_color:      textColor,
  };
}

function buildKraShapes(options) {
  options = options || {};
  const shapes = [];
  for (let i = 0; i < floatSquares.length; i++) {
    const sq = floatSquares[i];

    const e1 = _kraShapeEntry(sq, options, "");
    if (e1) shapes.push(e1);

    _withSquareMirror(sq, () => {
      const e2 = _kraShapeEntry(sq, options, "_mirror");
      if (e2) shapes.push(e2);
    });
  }
  return shapes;
}

/* ==========================================================================
   HOMOGRAPHY HELPERS
   ========================================================================== */

function _computeHomography(src, dst) {
  const A = [];
  const b = [];
  for (let i = 0; i < 4; i++) {
    const sx = src[i].x, sy = src[i].y;
    const dx = dst[i].x, dy = dst[i].y;
    A.push([sx, sy, 1, 0, 0, 0, -sx * dx, -sy * dx]);
    b.push(dx);
    A.push([0, 0, 0, sx, sy, 1, -sx * dy, -sy * dy]);
    b.push(dy);
  }
  const n = 8;
  for (let i = 0; i < n; i++) {
    let piv = i;
    for (let j = i + 1; j < n; j++) {
      if (Math.abs(A[j][i]) > Math.abs(A[piv][i])) piv = j;
    }
    const Atmp = A[i]; A[i] = A[piv]; A[piv] = Atmp;
    const btmp = b[i]; b[i] = b[piv]; b[piv] = btmp;
    for (let j = i + 1; j < n; j++) {
      const f = A[j][i] / A[i][i];
      for (let k = i; k < n; k++) A[j][k] -= f * A[i][k];
      b[j] -= f * b[i];
    }
  }
  const h = new Array(8).fill(0);
  for (let i = n - 1; i >= 0; i--) {
    let s = b[i];
    for (let k = i + 1; k < n; k++) s -= A[i][k] * h[k];
    h[i] = s / A[i][i];
  }
  return [
    [h[0], h[1], h[2]],
    [h[3], h[4], h[5]],
    [h[6], h[7], 1.0],
  ];
}

function _invert3x3(M) {
  const a = M[0][0], b = M[0][1], c = M[0][2];
  const d = M[1][0], e = M[1][1], f = M[1][2];
  const g = M[2][0], h = M[2][1], i = M[2][2];
  const A =  (e * i - f * h);
  const B = -(d * i - f * g);
  const C =  (d * h - e * g);
  const det = a * A + b * B + c * C;
  if (Math.abs(det) < 1e-15) return null;
  const inv = 1 / det;
  return [
    [A * inv,        (c * h - b * i) * inv, (b * f - c * e) * inv],
    [B * inv,        (a * i - c * g) * inv, (c * d - a * f) * inv],
    [C * inv,        (b * g - a * h) * inv, (a * e - b * d) * inv],
  ];
}

function _applyHomography(M, x, y) {
  const w = M[2][0] * x + M[2][1] * y + M[2][2];
  if (Math.abs(w) < 1e-15) return null;
  return {
    x: (M[0][0] * x + M[0][1] * y + M[0][2]) / w,
    y: (M[1][0] * x + M[1][1] * y + M[1][2]) / w,
  };
}

function _patchProjectiveJacobian(H, fx, fy) {
  const w = H[2][0] * fx + H[2][1] * fy + H[2][2];
  if (Math.abs(w) < 1e-12) return null;
  const x = (H[0][0] * fx + H[0][1] * fy + H[0][2]) / w;
  const y = (H[1][0] * fx + H[1][1] * fy + H[1][2]) / w;
  const invW = 1 / w;
  return {
    J11: (H[0][0] - x * H[2][0]) * invW,
    J21: (H[1][0] - y * H[2][0]) * invW,
    J12: (H[0][1] - x * H[2][1]) * invW,
    J22: (H[1][1] - y * H[2][1]) * invW,
  };
}

function _invert2x2(J) {
  const det = J.J11 * J.J22 - J.J12 * J.J21;
  if (Math.abs(det) < 1e-12) return null;
  return {
    i11:  J.J22 / det,
    i12: -J.J12 / det,
    i21: -J.J21 / det,
    i22:  J.J11 / det,
  };
}

function _squareCornersInPatchUV(sq) {
  const refHW = SHAPE_REL_SIZE / 2 * sq.scaleU;
  const refHH = SHAPE_REL_SIZE / 2 * sq.scaleV;
  const cosT  = Math.cos(sq.theta || 0);
  const sinT  = Math.sin(sq.theta || 0);
  const raw = [
    [-refHW, +refHH],
    [+refHW, +refHH],
    [+refHW, -refHH],
    [-refHW, -refHH],
  ];
  return raw.map(([du, dv]) => {
    const duR = du * cosT - dv * sinT;
    const dvR = du * sinT + dv * cosT;
    return {
      u: sq.u + duR / SHAPE_U_REF,
      v: sq.v + dvR / SHAPE_V_REF,
    };
  });
}

function _bilinearInterpQuad(corners, u, v) {
  const TL = corners[0], TR = corners[1], BR = corners[2], BL = corners[3];
  const w00 = (1 - u) * (1 - v);
  const w10 = u * (1 - v);
  const w11 = u * v;
  const w01 = (1 - u) * v;
  return {
    u: w00 * TL.u + w10 * TR.u + w11 * BR.u + w01 * BL.u,
    v: w00 * TL.v + w10 * TR.v + w11 * BR.v + w01 * BL.v,
  };
}

/* ==========================================================================
   PATCH MODE — one group + one mask per patch
   ==========================================================================
   The per-patch body is extracted into _buildOnePatchKraPatch so it
   can be called twice: once on the patch as stored, and once with
   the patch's φ shifted and each square flipped to emit the mirror
   group.  The mirror group's name carries a `_mirror` suffix so
   Krita's name lookup cannot collide the two. */

function _projectedPatchCorners(q) {
  const corners = quadCorners(q);
  return corners.map(c => {
    const [wx, wy] = surfacePoint(c.phi, c.s);
    return w2s(wx, wy);
  });
}

function _patchFlatDimensions(projCorners) {
  const d01 = Math.hypot(projCorners[1][0] - projCorners[0][0],
                          projCorners[1][1] - projCorners[0][1]);
  const d32 = Math.hypot(projCorners[2][0] - projCorners[3][0],
                          projCorners[2][1] - projCorners[3][1]);
  const d03 = Math.hypot(projCorners[3][0] - projCorners[0][0],
                          projCorners[3][1] - projCorners[0][1]);
  const d12 = Math.hypot(projCorners[2][0] - projCorners[1][0],
                          projCorners[2][1] - projCorners[1][1]);
  return {
    w: (d01 + d32) / 2,
    h: (d03 + d12) / 2,
  };
}

function _buildOnePatchKraPatch(q, options, nameSuffix, isMirror) {
  const colorMode = options.text_color_mode || "color";
  const textPos   = options.text_position || "center";
  const padFrac   = (typeof options.text_padding === "number")
                      ? options.text_padding : 0.06;
  const drawRects = options.draw_rectangles !== false;

  const sqsOnPatch = [];
  for (let i = 0; i < floatSquares.length; i++) {
    if (floatSquares[i].quadId === q.id) sqsOnPatch.push(floatSquares[i]);
  }
  if (sqsOnPatch.length === 0) return null;

  const projCorners = _projectedPatchCorners(q);
  const dims = _patchFlatDimensions(projCorners);
  if (dims.w <= 0.5 || dims.h <= 0.5) return null;

  const patchH = _computeHomography(
    [{x: 0, y: 0}, {x: dims.w, y: 0},
     {x: dims.w, y: dims.h}, {x: 0, y: dims.h}],
    [{x: projCorners[0][0], y: projCorners[0][1]},
     {x: projCorners[1][0], y: projCorners[1][1]},
     {x: projCorners[2][0], y: projCorners[2][1]},
     {x: projCorners[3][0], y: projCorners[3][1]}]
  );
  const patchHinv = _invert3x3(patchH);
  if (!patchHinv) return null;

  const hue = patchHue(q);
  const hex = _hueToHex(hue);
  const hexLight = _hueToHexLight(hue);
  const textColor = (colorMode === "black") ? "#000000" : hexLight;

  const rects = [];
  const pending = [];
  let bbMinX = 0, bbMinY = 0, bbMaxX = dims.w, bbMaxY = dims.h;

  const flip = isMirror && (q.mirrorFlip !== false);

  for (const sq of sqsOnPatch) {
    const theta0 = sq.theta || 0;
    const slope0 = sq.slope || 0;
    const u0     = sq.u;
    if (flip) {
      sq.theta = -theta0;
      sq.slope = -slope0;
      sq.u     = -u0;
    }
    try {
      const unclipped = _unclippedProjectedCorners(sq);
      if (!unclipped || unclipped.length < 4) continue;
      const screenCorners = squareCornersScreen(sq) || unclipped;

      const lens = (function () {
        const n = unclipped.length;
        const s = [];
        for (let k = 0; k < n; k++) {
          const a = unclipped[k];
          const b = unclipped[(k + 1) % n];
          s.push(Math.hypot(b[0] - a[0], b[1] - a[1]));
        }
        return s;
      })();
      const W_sq = (lens[0] + lens[2]) / 2;
      const H_sq = (lens[1] + lens[3]) / 2;
      if (W_sq <= 0.5 || H_sq <= 0.5) continue;

      const label     = squareDisplayName(sq);
      const layerName = label + (nameSuffix || "");

      if (drawRects) {
        rects.push({
          name: layerName,
          points: screenCorners.map(([x, y]) => [x, y]),
          fill: hex, fill_opacity: 0.40,
          stroke: hex, stroke_width: 2.0, stroke_opacity: 1.0,
        });
      }

      const flatRotSq = _shapeLabelFlatRotationDeg(sq, screenCorners);
      const readAngSq = _shapeLabelScreenAngleDeg(sq, screenCorners);
      const fontNat = Math.min(W_sq, H_sq) * 0.40;

      const anchorCenterFlatSq = _flatAnchorFromVisual(
        screenCorners, W_sq, H_sq, textPos, padFrac,
        fontNat, label.length, readAngSq, flatRotSq
      );
      const anchorFlatSq = _anchorForPosition(
        anchorCenterFlatSq, flatRotSq, label.length, fontNat, textPos
      );

      const sqH = _computeHomography(
        [{x: 0, y: 0}, {x: W_sq, y: 0},
         {x: W_sq, y: H_sq}, {x: 0, y: H_sq}],
        [{x: unclipped[0][0], y: unclipped[0][1]},
         {x: unclipped[1][0], y: unclipped[1][1]},
         {x: unclipped[2][0], y: unclipped[2][1]},
         {x: unclipped[3][0], y: unclipped[3][1]}]
      );

      const desiredScreen = _applyHomography(
        sqH, anchorFlatSq.x, anchorFlatSq.y
      );
      if (!desiredScreen ||
          !isFinite(desiredScreen.x) || !isFinite(desiredScreen.y)) continue;

      const flatPatch = _applyHomography(
        patchHinv, desiredScreen.x, desiredScreen.y
      );
      if (!flatPatch ||
          !isFinite(flatPatch.x) || !isFinite(flatPatch.y)) continue;

      const px = flatPatch.x;
      const py = flatPatch.y;

      const J = _patchProjectiveJacobian(patchH, px, py);
      if (!J) continue;

      const det = J.J11 * J.J22 - J.J12 * J.J21;
      let localScale = Math.sqrt(Math.abs(det));
      if (localScale < 1e-3) localScale = 1.0;

      const font_px = Math.max(6, fontNat / localScale);

      let flatRotation = 0;
      const Jinv = _invert2x2(J);
      if (Jinv) {
        const rad = readAngSq * Math.PI / 180;
        const cosT = Math.cos(rad);
        const sinT = Math.sin(rad);
        const flatDx = Jinv.i11 * cosT + Jinv.i12 * sinT;
        const flatDy = Jinv.i21 * cosT + Jinv.i22 * sinT;
        if (Math.abs(flatDx) > 1e-12 || Math.abs(flatDy) > 1e-12) {
          flatRotation = Math.atan2(flatDy, flatDx) * 180 / Math.PI;
        }
      }

      pending.push({
        label:  label,
        text:   label,
        px, py,
        font_px,
        rotation: flatRotation,
        alignment: anchorFlatSq.alignment,
      });

      const rad = flatRotation * Math.PI / 180;
      const cosR = Math.cos(rad);
      const sinR = Math.sin(rad);
      const h2 = font_px / 2;
      const textLenPx = label.length * font_px * 0.55;

      let extStart, extEnd;
      if (anchorFlatSq.alignment === "right") {
        extStart = textLenPx; extEnd = 0;
      } else if (anchorFlatSq.alignment === "center") {
        extStart = textLenPx / 2; extEnd = textLenPx / 2;
      } else {
        extStart = 0; extEnd = textLenPx;
      }

      const localCorners = [
        [-extStart, -h2], [extEnd, -h2],
        [ extEnd,   h2], [-extStart, h2],
      ];
      for (const [lx, ly] of localCorners) {
        const rx = lx * cosR - ly * sinR;
        const ry = lx * sinR + ly * cosR;
        bbMinX = Math.min(bbMinX, px + rx);
        bbMaxX = Math.max(bbMaxX, px + rx);
        bbMinY = Math.min(bbMinY, py + ry);
        bbMaxY = Math.max(bbMaxY, py + ry);
      }
    } finally {
      sq.theta = theta0;
      sq.slope = slope0;
      sq.u     = u0;
    }
  }

  if (pending.length === 0) return null;

  const MARGIN = 4;
  bbMinX -= MARGIN; bbMinY -= MARGIN;
  bbMaxX += MARGIN; bbMaxY += MARGIN;

  const offX = bbMinX;
  const offY = bbMinY;
  const Wshift = bbMaxX - bbMinX;
  const Hshift = bbMaxY - bbMinY;

  const texts = [];
  for (const p of pending) {
    texts.push({
      text: p.text,
      x: p.px - offX,
      y: p.py - offY,
      font_px: p.font_px,
      flat_rotation: p.rotation,
      alignment: p.alignment,
      color: textColor,
    });
  }

  const srcPts = [[0, 0], [Wshift, 0], [Wshift, Hshift], [0, Hshift]];
  const unshiftedCorners = [
    [bbMinX, bbMinY], [bbMaxX, bbMinY],
    [bbMaxX, bbMaxY], [bbMinX, bbMaxY],
  ];
  const dstPts = unshiftedCorners.map(([fx, fy]) => {
    const p = _applyHomography(patchH, fx, fy);
    return p ? [p.x, p.y] : [0, 0];
  });

  return {
    name: q.name + (nameSuffix || ""),
    src_pts: srcPts,
    dst_pts: dstPts,
    texts: texts,
    rects: rects,
  };
}

function buildKraPatches(options) {
  options = options || {};
  const patches = [];

  for (let qi = 0; qi < quads.length; qi++) {
    const q = quads[qi];

    const p1 = _buildOnePatchKraPatch(q, options, "", false);
    if (p1) patches.push(p1);

    if (q.mirror) {
      const angle = (typeof q.mirrorAngle === "number")
                      ? q.mirrorAngle : Math.PI;
      const phi0 = q.phi0, phi1 = q.phi1;
      q.phi0 = phi0 + angle;
      q.phi1 = phi1 + angle;
      try {
        const p2 = _buildOnePatchKraPatch(q, options, "_mirror", true);
        if (p2) patches.push(p2);
      } finally {
        q.phi0 = phi0;
        q.phi1 = phi1;
      }
    }
  }
  return patches;
}

/* ==========================================================================
   TEXT MODE — one group + one mask per text
   ========================================================================== */

function _kraTextEntry(sq, options, nameSuffix) {
  const colorMode = options.text_color_mode || "color";
  const textPos   = options.text_position || "center";
  const padFrac   = (typeof options.text_padding === "number")
                      ? options.text_padding : 0.06;
  const drawRects = options.draw_rectangles !== false;

  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return null;
  const q = quads[qi];
  if (!q) return null;

  const unclipped = _unclippedProjectedCorners(sq);
  if (!unclipped || unclipped.length < 4) return null;

  const screenCorners = squareCornersScreen(sq) || unclipped;

  const lens = (function () {
    const n = unclipped.length;
    const s = [];
    for (let k = 0; k < n; k++) {
      const a = unclipped[k];
      const b = unclipped[(k + 1) % n];
      s.push(Math.hypot(b[0] - a[0], b[1] - a[1]));
    }
    return s;
  })();
  const W_sq = (lens[0] + lens[2]) / 2;
  const H_sq = (lens[1] + lens[3]) / 2;
  if (W_sq <= 0.5 || H_sq <= 0.5) return null;

  const hue = patchHue(q);
  const hex = _hueToHex(hue);
  const hexLight = _hueToHexLight(hue);
  const textColor = (colorMode === "black") ? "#000000" : hexLight;

  const label     = squareDisplayName(sq);
  const layerName = label + (nameSuffix || "");

  let rect = null;
  if (drawRects) {
    rect = {
      name: layerName,
      points: screenCorners.map(([x, y]) => [x, y]),
      fill: hex, fill_opacity: 0.40,
      stroke: hex, stroke_width: 2.0, stroke_opacity: 1.0,
    };
  }

  const flatRotation = _shapeLabelFlatRotationDeg(sq, screenCorners);
  const readingAngle = _shapeLabelScreenAngleDeg(sq, screenCorners);
  const fontNat = Math.min(W_sq, H_sq) * 0.40;

  const anchorCenter = _flatAnchorFromVisual(
    screenCorners, W_sq, H_sq, textPos, padFrac,
    fontNat, label.length, readingAngle, flatRotation
  );
  const anchor = _anchorForPosition(
    anchorCenter, flatRotation, label.length, fontNat, textPos
  );

  const srcPts = [[0, 0], [W_sq, 0], [W_sq, H_sq], [0, H_sq]];
  const dstPts = unclipped.map(([x, y]) => [x, y]);

  const item = {
    name: layerName,
    label: label,
    src_w: W_sq,
    src_h: H_sq,
    text_x: anchor.x,
    text_y: anchor.y,
    font_px: Math.max(6, fontNat),
    rotation: flatRotation,
    alignment: anchor.alignment,
    color: textColor,
    src_pts: srcPts,
    dst_pts: dstPts,
  };

  return { item, rect };
}

function buildKraTexts(options) {
  options = options || {};
  const items = [];
  const rects = [];

  for (let i = 0; i < floatSquares.length; i++) {
    const sq = floatSquares[i];

    const e1 = _kraTextEntry(sq, options, "");
    if (e1) { items.push(e1.item); if (e1.rect) rects.push(e1.rect); }

    _withSquareMirror(sq, () => {
      const e2 = _kraTextEntry(sq, options, "_mirror");
      if (e2) { items.push(e2.item); if (e2.rect) rects.push(e2.rect); }
    });
  }
  return { items: items, rects: rects };
}

/* ==========================================================================
   TEXT-SHEAR MODE — no masks; one layer per text
   ==========================================================================
   No transform masks.  Each text lives on its own vector layer as a
   plain shape.  The warp is encoded entirely in primitives the shape
   itself carries:

     - position: SVG x, y
     - font size: SVG font-size, set to fontNat directly
     - rotation, shear, scale_x, scale_y: one QTransform via
       setTransformation

   For each square the JS computes the local Jacobian J of the
   square's homography at the text's anchor, composes it with the
   text's own flat rotation R to get the total warp M = J · R,
   decomposes M into R(θ) · Shx(k) · S(sx, sy), and normalizes the
   scales so the larger of |sx|, |sy| is 1.  That way the text's
   on-screen bounding box fits in a fontNat × fontNat square: the
   longer dimension reaches fontNat, the shorter is proportionally
   smaller, and nothing overflows.  Rotation and shear are invariant
   under the normalization, so the shape of the text is preserved. */

function _kraShearTextEntry(sq, options, nameSuffix) {
  const colorMode = options.text_color_mode || "color";
  const textPos   = options.text_position || "center";
  const padFrac   = (typeof options.text_padding === "number")
                      ? options.text_padding : 0.06;
  const drawRects = options.draw_rectangles !== false;

  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return null;
  const q = quads[qi];
  if (!q) return null;

  const unclipped = _unclippedProjectedCorners(sq);
  if (!unclipped || unclipped.length < 4) return null;
  const screenCorners = squareCornersScreen(sq) || unclipped;

  const lens = (function () {
    const n = unclipped.length;
    const s = [];
    for (let k = 0; k < n; k++) {
      const a = unclipped[k];
      const b = unclipped[(k + 1) % n];
      s.push(Math.hypot(b[0] - a[0], b[1] - a[1]));
    }
    return s;
  })();
  const W_sq = (lens[0] + lens[2]) / 2;
  const H_sq = (lens[1] + lens[3]) / 2;
  if (W_sq <= 0.5 || H_sq <= 0.5) return null;

  const hue = patchHue(q);
  const hex = _hueToHex(hue);
