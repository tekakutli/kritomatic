<body>

<div id="ui">
  <h3>Cone interior
    <button id="collapseBtn" title="Collapse (H)"
      style="margin-left:auto; width:auto; padding:0 6px;
             height:20px; font-size:11px; line-height:1;">−</button>
  </h3>

  <div class="field">
    <label>Depth</label>
    <input type="range" id="depthSlider"
           min="3" max="40" step="0.5" value="15">
    <span class="val" id="depthVal">15.0</span>
  </div>
  <div class="field">
    <label>Half-angle</label>
    <input type="range" id="angleSlider"
           min="10" max="60" step="1" value="30">
    <span class="val" id="angleVal">30°</span>
  </div>
  <div class="field">
    <label>Rings</label>
    <input type="range" id="ringsSlider"
           min="4" max="40" step="1" value="14">
    <span class="val" id="ringsVal">14</span>
  </div>
  <div class="field">
    <label>Meridians</label>
    <input type="range" id="meridiansSlider"
           min="4" max="48" step="1" value="24">
    <span class="val" id="meridiansVal">24</span>
  </div>
  <div class="field">
    <label>Shape depth</label>
    <input type="range" id="shapeDepthSlider"
           min="0.05" max="2.00" step="0.05" value="0.75">
    <span class="val" id="shapeDepthVal">0.75</span>
  </div>

  <hr>

  <div class="field" style="margin-bottom:2px;">
    <label>Patches</label>
    <button id="addQuadBtn" style="flex:1 1 auto;">+ Patch</button>
  </div>
  <div id="quadList" class="quadList"></div>

  <div class="field" style="margin-top:8px; margin-bottom:2px;">
    <label>Squares</label>
    <button id="addSquareBtn" style="flex:1 1 auto;">+ Square</button>
  </div>
  <div id="squareList" class="quadList"></div>
  <div style="font-size:9px; color:#5a6774;
              padding:2px 0; letter-spacing:0.06em;">
    shift+click a patch to drop one there
  </div>

  <hr>

  <div class="row">
    <button id="resetBtn">Reset</button>
    <button id="centerBtn">Center apex</button>
  </div>
  <div class="row">
    <button id="exportBtn">Export visual state</button>
  </div>

  <div id="status">drag apex to tilt · scroll to change depth</div>
</div>

<button id="restoreBtn" title="Show panel (H)">☰ Show panel</button>

<canvas id="c"></canvas>
<script>
"use strict";

/* ==========================================================================
   CANVAS
   ========================================================================== */

const canvas = document.getElementById("c");
const ctx    = canvas.getContext("2d");
let dpr = window.devicePixelRatio || 1;

/* ==========================================================================
   LAYOUT
   ========================================================================== */

const layout = {
  coneH:     0,
  dividerY:  0,
  reservedY: 0,
  reservedH: 0,
};

/* ==========================================================================
   VIEW
   ========================================================================== */

const view = {
  scale: 20, tx: 0, ty: 0,
  zoom: 1, panX: 0, panY: 0,
};

function w2s(x, y) { return [x * view.scale + view.tx,
                             -y * view.scale + view.ty]; }
function s2w(sx, sy) { return [(sx - view.tx) / view.scale,
                               -(sy - view.ty) / view.scale]; }

/* ==========================================================================
   CONE
   ========================================================================== */

const cone = {
  ax: 0, ay: 0,
  depth: 15,
  halfAngle: Math.PI / 6,
  ringCount: 14,
  meridianCount: 24,
};

function clampApex() {
  const R = cone.depth * Math.tan(cone.halfAngle);
  const maxR = R * 0.98;
  const dr = Math.hypot(cone.ax, cone.ay);
  if (dr > maxR && dr > 1e-9) {
    const s = maxR / dr;
    cone.ax *= s;
    cone.ay *= s;
  }
}

function coneR() { return cone.depth * Math.tan(cone.halfAngle); }

function surfacePoint(phi, s) {
  const R = coneR();
  const r = (1 - s) * R;
  return [s * cone.ax + r * Math.cos(phi),
          s * cone.ay + r * Math.sin(phi)];
}

/* ==========================================================================
   PATCH MODEL
   ==========================================================================
   Every patch:  [phi0, phi1] × [s0, s1].  Corner order:

       0   (phi0, s1)   top-left    near apex
       1   (phi1, s1)   top-right   near apex
       2   (phi1, s0)   bottom-right near base
       3   (phi0, s0)   bottom-left  near base

   The lateral edges lie on meridians; every meridian ends at the
   apex, so both lateral edges point at the peak.  S_MAX < 1 keeps a
   patch from collapsing into the apex. */

const S_MIN = 0.00;
const S_MAX = 0.90;

/* Shape editing of patches is locked away.  Set true to re-enable
   corner / edge / body dragging on patches in either band; the
   underlying drag math is unaffected by this flag and would take
   over on the very next click. */
const PATCH_SHAPE_EDIT_ENABLED = false;

const quads = [];
let nextQuadId = 1;
let selectedQuad = -1;

function quadCorners(q) {
  return [
    { phi: q.phi0, s: q.s1 },
    { phi: q.phi1, s: q.s1 },
    { phi: q.phi1, s: q.s0 },
    { phi: q.phi0, s: q.s0 },
  ];
}

function addQuad() {
  const id  = nextQuadId++;
  const idx = quads.length;
  const dPhi = 0.36;

  let phiCenter = Math.PI / 2 + idx * 0.70;
  phiCenter = ((phiCenter % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  if (phiCenter - dPhi < 0)           phiCenter = dPhi;
  if (phiCenter + dPhi > 2 * Math.PI) phiCenter = 2 * Math.PI - dPhi;

  quads.push({
    id, name: "Q" + id,
    phi0: phiCenter - dPhi,
    phi1: phiCenter + dPhi,
    s0: 0.22,
    s1: 0.72,
  });
  selectedQuad = quads.length - 1;
  syncQuadList();
  draw();
}

function deleteQuad(idx) {
  if (idx < 0 || idx >= quads.length) return;
  const removed = quads.splice(idx, 1)[0];
  if (typeof deleteSquaresForQuad === "function") {
    deleteSquaresForQuad(removed.id);
  }
  if (selectedQuad >= quads.length) selectedQuad = quads.length - 1;
  syncQuadList();
  draw();
}

/* ==========================================================================
   INVERSE PROJECTION — cursor world point → (phi, s) on the surface
   ==========================================================================
   For fixed s, the closest surface point to T is on the ring at that
   s, with squared distance expressed as a quadratic in s:

       A·s² + B·s + C = 0
       A = |apex|² − R²
       B = −2 · (apex·T − R²)
       C = |T|² − R²

   Two real roots: the one nearer the caller's current s wins, so a
   drag stays on one branch of the surface.  No real root: forty-step
   sample over [S_MIN, S_MAX]. */
function projectToConeSurface(wx, wy, currentS) {
  const Px = cone.ax, Py = cone.ay;
  const R  = coneR();
  const R2 = R * R;
  const p2 = Px * Px + Py * Py;
  const t2 = wx * wx + wy * wy;
  const pt = Px * wx + Py * wy;

  const A = p2 - R2;
  const B = -2 * (pt - R2);
  const C = t2 - R2;

  const roots = [];
  if (Math.abs(A) < 1e-6) {
    if (Math.abs(B) > 1e-9) roots.push(-C / B);
  } else {
    const disc = B * B - 4 * A * C;
    if (disc >= 0) {
      const sq = Math.sqrt(disc);
      roots.push((-B - sq) / (2 * A));
      roots.push((-B + sq) / (2 * A));
    }
  }

  let bestS = null, bestDelta = Infinity;
  for (const s of roots) {
    if (s < S_MIN - 0.01 || s > S_MAX + 0.01) continue;
    const c = Math.max(S_MIN, Math.min(S_MAX, s));
    const d = Math.abs(c - currentS);
    if (d < bestDelta) { bestDelta = d; bestS = c; }
  }

  if (bestS === null) {
    bestDelta = Infinity;
    for (let i = 0; i <= 40; i++) {
      const s = S_MIN + (S_MAX - S_MIN) * i / 40;
      const cx = s * Px, cy = s * Py;
      const r  = (1 - s) * R;
      const d  = Math.abs(Math.hypot(wx - cx, wy - cy) - r);
      if (d < bestDelta) { bestDelta = d; bestS = s; }
    }
    if (bestS === null) bestS = Math.max(S_MIN, Math.min(S_MAX, currentS));
  }

  const cx = bestS * Px, cy = bestS * Py;
  const dx = wx - cx, dy = wy - cy;
  const phi = (Math.abs(dx) < 1e-9 && Math.abs(dy) < 1e-9)
              ? 0 : Math.atan2(dy, dx);
  return { phi, s: bestS };
}

/* ==========================================================================
   TRANSIENT STATE
   ==========================================================================
   Five drag modes, mutually exclusive at any moment:

       dragApex        apex tilt / depth pull from the cone band
       dragQuadVertex  a patch's corner, either band (gated)
       dragSquare      a floating square from the cone band
       flatDrag        a patch's corner/edge/body from the flat band
                       (gated)
       flatSquareDrag  a floating square from the flat band */

const state = {
  dragApex:       null,
  dragQuadVertex: null,
  dragSquare:     null,
  flatDrag:       null,
  flatSquareDrag: null,
  dragPatchBody:  null,
  mouse: { sx: 0, sy: 0, inside: false },
};

/* ==========================================================================
   RESIZE / FIT
   ========================================================================== */

function resize() {
  dpr = window.devicePixelRatio || 1;
  const cw = window.innerWidth;
  const ch = window.innerHeight;

  canvas.width  = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width  = cw + "px";
  canvas.style.height = ch + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  layout.coneH     = Math.round(ch * 0.58);
  layout.dividerY  = layout.coneH;
  layout.reservedY = layout.coneH + 4;
  layout.reservedH = ch - layout.reservedY;

  fitView();
  draw();
}
window.addEventListener("resize", resize);

function fitView() {
  view.scale = 20 * view.zoom;
  view.tx = window.innerWidth / 2 + view.panX;
  view.ty = layout.coneH / 2 + view.panY;
}

function resetView() {
  view.zoom = 1; view.panX = 0; view.panY = 0;
  cone.ax = 0; cone.ay = 0;
  cone.depth = 15;
  cone.halfAngle = Math.PI / 6;
  cone.ringCount = 14;
  cone.meridianCount = 24;
  syncPanelSliders();
  fitView();
  draw();
}

function drawConeView() {
  const cw = window.innerWidth;
  const ch = layout.coneH;

  const R_world = cone.depth * Math.tan(cone.halfAngle);
  const [Bx, By] = w2s(0, 0);
  const [Ax, Ay] = w2s(cone.ax, cone.ay);
  const Rs = R_world * view.scale;

  /* depth gradient */
  const apexDist  = Math.hypot(Ax - Bx, Ay - By);
  const gradientR = Math.max(apexDist + Rs, 40);
  const bg = ctx.createRadialGradient(Ax, Ay, 0, Ax, Ay, gradientR);
  bg.addColorStop(0.00, "#05080c");
  bg.addColorStop(0.32, "#070c12");
  bg.addColorStop(0.68, "#0a1018");
  bg.addColorStop(1.00, "#0e1622");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, cw, ch);

  /* meridians */
  const M = cone.meridianCount;
  ctx.lineCap = "round";
  for (let i = 0; i < M; i++) {
    const phi = i * 2 * Math.PI / M;
    const [ex, ey] = w2s(R_world * Math.cos(phi),
                         R_world * Math.sin(phi));
    const lg = ctx.createLinearGradient(Ax, Ay, ex, ey);
    lg.addColorStop(0.00, "rgba(0, 229, 255, 0.00)");
    lg.addColorStop(0.10, "rgba(0, 229, 255, 0.09)");
    lg.addColorStop(0.60, "rgba(0, 229, 255, 0.20)");
    lg.addColorStop(1.00, "rgba(0, 229, 255, 0.40)");
    ctx.beginPath(); ctx.moveTo(Ax, Ay); ctx.lineTo(ex, ey);
    ctx.strokeStyle = lg; ctx.lineWidth = 0.9; ctx.stroke();
  }

  /* rings */
  const N = cone.ringCount;
  for (let k = 0; k <= N; k++) {
    const s = k / N;
    const [cx, cy] = w2s(s * cone.ax, s * cone.ay);
    const rs = (1 - s) * R_world * view.scale;
    if (rs < 0.5) continue;
    const u = 1 - s;
    const alpha = 0.10 + 0.55 * u * u;
    ctx.beginPath(); ctx.arc(cx, cy, rs, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(0, 229, 255, " + alpha.toFixed(3) + ")";
    ctx.lineWidth = (k === 0) ? 2.0 : 0.9;
    ctx.stroke();
  }

  /* axis */
  if (apexDist > 6) {
    ctx.save();
    ctx.setLineDash([5, 4]);
    ctx.strokeStyle = "rgba(255, 43, 214, 0.45)";
    ctx.lineWidth = 1.0;
    ctx.beginPath(); ctx.moveTo(Bx, By); ctx.lineTo(Ax, Ay); ctx.stroke();
    ctx.restore();
  }

  /* base direction tick */
  if (Rs > 20) {
    ctx.beginPath();
    ctx.arc(Bx, By, Rs, -Math.PI / 2 - 0.15, -Math.PI / 2 + 0.15);
    ctx.strokeStyle = "rgba(255, 43, 214, 0.9)";
    ctx.lineWidth = 2.4; ctx.stroke();
  }

  /* base centre dot */
  ctx.beginPath(); ctx.arc(Bx, By, 2.2, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(220, 230, 242, 0.55)"; ctx.fill();

  /* patches — unselected first, selected on top */
  for (let i = 0; i < quads.length; i++) {
    if (i === selectedQuad) continue;
    drawQuadPatch(quads[i], false);
  }
  if (selectedQuad >= 0 && selectedQuad < quads.length) {
    drawQuadPatch(quads[selectedQuad], true);
  }

  /* floating squares on the patches' planes */
  drawFloatSquares();

  /* apex marker */
  const haloR = 22;
  const halo = ctx.createRadialGradient(Ax, Ay, 0, Ax, Ay, haloR);
  halo.addColorStop(0.0, "rgba(255, 230, 0, 0.34)");
  halo.addColorStop(1.0, "rgba(255, 230, 0, 0.00)");
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(Ax, Ay, haloR, 0, Math.PI * 2); ctx.fill();

  ctx.beginPath(); ctx.arc(Ax, Ay, 5.5, 0, Math.PI * 2);
  ctx.fillStyle = "#ffe600"; ctx.fill();
  ctx.strokeStyle = "#0a0e14"; ctx.lineWidth = 2; ctx.stroke();

  /* corner caption */
  ctx.save();
  ctx.font = "700 10px 'JetBrains Mono', 'Fira Code', monospace";
  ctx.fillStyle = "#5a6774";
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  const halfDeg = Math.round(cone.halfAngle * 180 / Math.PI);
  const tiltDeg = Math.atan2(Math.hypot(cone.ax, cone.ay), cone.depth)
                  * 180 / Math.PI;
  ctx.fillText(
    "APEX (" + cone.ax.toFixed(1) + ", " + cone.ay.toFixed(1) + ")" +
    "   TILT " + tiltDeg.toFixed(1) + "\u00B0" +
    "   DEPTH " + cone.depth.toFixed(1) +
    "   HALF-ANGLE " + halfDeg + "\u00B0" +
    "   PATCHES " + quads.length +
    "   SQUARES " + floatSquares.length,
    14, 14);
  ctx.restore();
}

function drawQuadPatch(q, selected) {
  const pts = quadCorners(q).map(c => {
    const [wx, wy] = surfacePoint(c.phi, c.s);
    return w2s(wx, wy);
  });

  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = selected
    ? "rgba(255, 200, 90, 0.10)"
    : "rgba(255, 200, 90, 0.04)";
  ctx.fill();

  ctx.lineJoin = "round";
  ctx.strokeStyle = selected
    ? "rgba(255, 220, 130, 0.60)"
    : "rgba(255, 200, 90, 0.28)";
  ctx.lineWidth = selected ? 1.5 : 1.0;
  ctx.stroke();

  /* Corner markers are the visual affordance for a corner drag.
     They appear only when the drag path behind them is live. */
  if (!PATCH_SHAPE_EDIT_ENABLED) return;

  const rDot = selected ? 5.2 : 3.0;
  for (const [sx, sy] of pts) {
    ctx.beginPath(); ctx.arc(sx, sy, rDot, 0, Math.PI * 2);
    ctx.fillStyle = selected ? "#ffe680" : "rgba(255, 210, 100, 0.80)";
    ctx.fill();
    ctx.strokeStyle = "#0a0e14"; ctx.lineWidth = 1.5; ctx.stroke();
  }
}

/* ==========================================================================
   FLAT VIEW
   ========================================================================== */

const FLAT_PHI_MIN  = 0;
const FLAT_PHI_MAX  = 2 * Math.PI;
const FLAT_PHI_SPAN = FLAT_PHI_MAX - FLAT_PHI_MIN;
const FLAT_S_MIN    = 0;
const FLAT_S_MAX    = 1;

const QUAD_MIN_SIZE_PHI = 0.06;
const QUAD_MIN_SIZE_S   = 0.04;

/* ==========================================================================
   PHI-WRAP HELPERS
   ========================================================================== */

function _phiCopies(phi0, phi1) {
  const kMin = Math.floor((FLAT_PHI_MIN - phi1) / FLAT_PHI_SPAN);
  const kMax = Math.ceil ((FLAT_PHI_MAX - phi0) / FLAT_PHI_SPAN);
  const out = [];
  for (let k = kMin; k <= kMax; k++) out.push(k * FLAT_PHI_SPAN);
  return out;
}

function _phiShiftForPatch(phiCursor, phi0, phi1) {
  const phiMid = (phi0 + phi1) / 2;
  return Math.round((phiMid - phiCursor) / FLAT_PHI_SPAN) * FLAT_PHI_SPAN;
}

function flatRect() {
  const W = window.innerWidth;
  const H = layout.reservedH;
  const MARGIN_X = 44;
  const TOP_PAD  = 26;
  const BOT_PAD  = 26;
  const maxW = W - 2 * MARGIN_X;
  const maxH = H - TOP_PAD - BOT_PAD - 4;

  const w = Math.min(maxW, maxH * 2.5);
  const h = Math.min(maxH, w / 2.5);
  const x0 = (W - w) / 2;
  const y0 = layout.reservedY + TOP_PAD + (maxH - h) / 2;
  return { x0, y0, w, h };
}

function flatToScreen(phi, s) {
  const r = flatRect();
  const u = (phi - FLAT_PHI_MIN) / (FLAT_PHI_MAX - FLAT_PHI_MIN);
  const v = s;
  return [r.x0 + u * r.w, r.y0 + (1 - v) * r.h];
}

function screenToFlat(sx, sy) {
  const r = flatRect();
  return {
    phi: FLAT_PHI_MIN +
         (sx - r.x0) / r.w * (FLAT_PHI_MAX - FLAT_PHI_MIN),
    s:   1 - (sy - r.y0) / r.h,
  };
}

function _flatInsideRect(sx, sy) {
  const r = flatRect();
  return sx >= r.x0 && sx <= r.x0 + r.w &&
         sy >= r.y0 && sy <= r.y0 + r.h;
}

function drawFlatView() {
  const cw = window.innerWidth;
  ctx.fillStyle = "#060a10";
  ctx.fillRect(0, layout.reservedY, cw, layout.reservedH);

  const r = flatRect();

  /* ---- static chrome: grid, frame, captions --------------------- */
  ctx.save();

  const N_RINGS = 6;
  for (let k = 1; k < N_RINGS; k++) {
    const s = k / N_RINGS;
    const [sx0, sy] = flatToScreen(FLAT_PHI_MIN, s);
    const [sx1]     = flatToScreen(FLAT_PHI_MAX, s);
    ctx.strokeStyle = "rgba(0, 229, 255, " + (0.03 + s * 0.09) + ")";
    ctx.lineWidth = 0.7;
    ctx.beginPath(); ctx.moveTo(sx0, sy); ctx.lineTo(sx1, sy); ctx.stroke();
  }

  const N_MERID = 12;
  for (let k = 0; k <= N_MERID; k++) {
    const phi = FLAT_PHI_MIN +
                (FLAT_PHI_MAX - FLAT_PHI_MIN) * k / N_MERID;
    const [sx, sy0] = flatToScreen(phi, FLAT_S_MAX);
    const [,   sy1] = flatToScreen(phi, FLAT_S_MIN);
    ctx.strokeStyle = "rgba(0, 229, 255, 0.05)";
    ctx.lineWidth = 0.7;
    ctx.beginPath(); ctx.moveTo(sx, sy0); ctx.lineTo(sx, sy1); ctx.stroke();
  }

  ctx.strokeStyle = "#1e2836";
  ctx.lineWidth = 1;
  ctx.strokeRect(r.x0 + 0.5, r.y0 + 0.5, r.w - 1, r.h - 1);

  {
    const [sx0, sy] = flatToScreen(FLAT_PHI_MIN, 1);
    const [sx1]     = flatToScreen(FLAT_PHI_MAX, 1);
    ctx.strokeStyle = "rgba(255, 43, 214, 0.55)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sx0, sy); ctx.lineTo(sx1, sy); ctx.stroke();
  }

  {
    const [sxL, sy0] = flatToScreen(FLAT_PHI_MIN, FLAT_S_MAX);
    const [,   sy1]  = flatToScreen(FLAT_PHI_MIN, FLAT_S_MIN);
    const [sxR]      = flatToScreen(FLAT_PHI_MAX, 0);
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = "rgba(255, 43, 214, 0.30)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sxL, sy0); ctx.lineTo(sxL, sy1);
    ctx.moveTo(sxR, sy0); ctx.lineTo(sxR, sy1);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();

  /* captions */
  ctx.save();
  ctx.font = "700 9px 'JetBrains Mono', 'Fira Code', monospace";

  ctx.fillStyle = "#3d4756";
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillText("UNFOLDED CONE  \u00B7  PARAMETER SPACE",
               r.x0, r.y0 - 16);

  ctx.textAlign = "right"; ctx.fillStyle = "#5a6774";
  ctx.fillText("\u03C6 = 0", r.x0 - 6, r.y0);
  ctx.textAlign = "left";
  ctx.fillText("\u03C6 = 2\u03C0", r.x0 + r.w + 6, r.y0);

  ctx.textAlign = "left"; ctx.textBaseline = "bottom";
  ctx.fillStyle = "#3d4756";
  ctx.fillText("s = 0  \u00B7  base", r.x0, r.y0 + r.h + 14);

  ctx.textBaseline = "top";
  ctx.fillStyle = "rgba(255, 43, 214, 0.75)";
  ctx.fillText("s = 1  \u00B7  apex", r.x0, r.y0 + 4);
  ctx.restore();

  /* ---- patches and shapes, together, clipped to the sheet ------- */

  ctx.save();
  ctx.beginPath();
  ctx.rect(r.x0, r.y0, r.w, r.h);
  ctx.clip();

  for (let i = 0; i < quads.length; i++) {
    if (i === selectedQuad) continue;
    drawFlatQuad(quads[i], false);
  }
  if (selectedQuad >= 0 && selectedQuad < quads.length) {
    drawFlatQuad(quads[selectedQuad], true);
  }

  if (selectedQuad >= 0 && selectedQuad < quads.length) {
    const activeQ = quads[selectedQuad];

    for (let i = 0; i < floatSquares.length; i++) {
      const sq = floatSquares[i];
      if (sq.quadId !== activeQ.id) continue;

      const corners = squareFlatCorners(sq);
      if (!corners) continue;

      const phis = corners.map(c => c[0]);
      const shifts = _phiCopies(Math.min(...phis), Math.max(...phis));
      const isSel = (i === selectedSquare);

      for (const shift of shifts) {
        const screen = corners.map(([phi, s]) =>
          flatToScreen(phi + shift, s));

        ctx.beginPath();
        ctx.moveTo(screen[0][0], screen[0][1]);
        for (let k = 1; k < 4; k++) {
          ctx.lineTo(screen[k][0], screen[k][1]);
        }
        ctx.closePath();
        ctx.fillStyle = isSel
          ? "rgba(120, 220, 255, 0.30)"
          : "rgba(120, 220, 255, 0.16)";
        ctx.fill();

        ctx.lineJoin = "round";
        ctx.strokeStyle = isSel
          ? "rgba(180, 240, 255, 1.00)"
          : "rgba(140, 225, 255, 0.78)";
        ctx.lineWidth = isSel ? 1.8 : 1.2;
        ctx.stroke();

        if (isSel) {
          for (const [hx, hy] of screen) {
            ctx.beginPath();
            ctx.arc(hx, hy, 4.2, 0, Math.PI * 2);
            ctx.fillStyle = "#b8ecff";
            ctx.fill();
            ctx.strokeStyle = "#0a0e14";
            ctx.lineWidth = 1.4;
            ctx.stroke();
          }
        }
      }

      /* Rotate handle drawn once, at the shape's primary position. */
      if (isSel) {
        const rh = squareFlatRotateHandleScreen(sq);
        if (rh) {
          ctx.beginPath();
          ctx.arc(rh[0], rh[1], 6.0, 0, Math.PI * 2);
          ctx.fillStyle = "#b8ecff";
          ctx.fill();
          ctx.strokeStyle = "#0a0e14";
          ctx.lineWidth = 1.6;
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(rh[0], rh[1], 3.0, Math.PI * 0.15, Math.PI * 1.85);
          ctx.strokeStyle = "#0a0e14";
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
      }
    }
  }

  ctx.restore();
}

function drawFlatQuad(q, selected) {
  const shifts = _phiCopies(q.phi0, q.phi1);
  for (const shift of shifts) {
    drawFlatQuadShifted(q, selected, shift);
  }
}

function drawFlatQuadShifted(q, selected, shift) {
  const pts = quadCorners(q).map(c =>
    flatToScreen(c.phi + shift, c.s));

  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < 4; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = selected
    ? "rgba(255, 200, 90, 0.10)"
    : "rgba(255, 200, 90, 0.04)";
  ctx.fill();

  ctx.lineJoin = "round";
  ctx.strokeStyle = selected
    ? "rgba(255, 220, 130, 0.60)"
    : "rgba(255, 200, 90, 0.28)";
  ctx.lineWidth = selected ? 1.5 : 1.0;
  ctx.stroke();

  if (!PATCH_SHAPE_EDIT_ENABLED) return;

  const rDot = selected ? 5.0 : 2.5;
  for (const [sx, sy] of pts) {
    ctx.beginPath(); ctx.arc(sx, sy, rDot, 0, Math.PI * 2);
    ctx.fillStyle = selected ? "#ffe680" : "rgba(255, 210, 100, 0.75)";
    ctx.fill();
    ctx.strokeStyle = "#0a0e14"; ctx.lineWidth = 1.5; ctx.stroke();
  }
}

/* ---- Hit testing ------------------------------------------------ */

const FLAT_HANDLE_R = 10;
const FLAT_EDGE_R   = 6;

function _flatPtSegDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const l2 = dx * dx + dy * dy;
  if (l2 < 1e-9) return Math.hypot(px - ax, py - ay);
  let t = ((px - ax) * dx + (py - ay) * dy) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}

function _flatPtInQuad(px, py, c) {
  let inside = false;
  for (let i = 0, j = 3; i < 4; j = i++) {
    const xi = c[i][0], yi = c[i][1];
    const xj = c[j][0], yj = c[j][1];
    if (((yi > py) !== (yj > py)) &&
        (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) {
      inside = !inside;
    }
  }
  return inside;
}

function flatHitTest(sx, sy) {
  if (!_flatInsideRect(sx, sy)) return null;

  const order = [];
  if (selectedQuad >= 0 && selectedQuad < quads.length) {
    order.push(selectedQuad);
  }
  for (let i = 0; i < quads.length; i++) {
    if (i !== selectedQuad) order.push(i);
  }

  for (const qi of order) {
    const q = quads[qi];
    const shifts = _phiCopies(q.phi0, q.phi1);

    for (const shift of shifts) {
      const corners = quadCorners(q).map(c =>
        flatToScreen(c.phi + shift, c.s));

      for (let ci = 0; ci < 4; ci++) {
        const [csx, csy] = corners[ci];
        if (Math.hypot(sx - csx, sy - csy) < FLAT_HANDLE_R) {
          return { kind: "corner", quadIdx: qi, cornerIdx: ci };
        }
      }

      const edges = [
        { name: "top",    a: corners[0], b: corners[1] },
        { name: "right",  a: corners[1], b: corners[2] },
        { name: "bottom", a: corners[2], b: corners[3] },
        { name: "left",   a: corners[3], b: corners[0] },
      ];
      let bestEdge = null, bestD = FLAT_EDGE_R;
      for (const e of edges) {
        const d = _flatPtSegDist(sx, sy, e.a[0], e.a[1], e.b[0], e.b[1]);
        if (d < bestD) { bestD = d; bestEdge = e.name; }
      }
      if (bestEdge) return { kind: "edge", quadIdx: qi, edge: bestEdge };

      if (_flatPtInQuad(sx, sy, corners)) {
        return { kind: "body", quadIdx: qi };
      }
    }
  }
  return null;
}

/* ---- Drag application ------------------------------------------- */

function flatMoveCorner(q, cornerIdx, phi, s) {
  if (cornerIdx === 0) {
    q.phi0 = Math.max(FLAT_PHI_MIN,
                      Math.min(phi, q.phi1 - QUAD_MIN_SIZE_PHI));
    q.s1   = Math.min(FLAT_S_MAX,
                      Math.max(s, q.s0 + QUAD_MIN_SIZE_S));
  } else if (cornerIdx === 1) {
    q.phi1 = Math.min(FLAT_PHI_MAX,
                      Math.max(phi, q.phi0 + QUAD_MIN_SIZE_PHI));
    q.s1   = Math.min(FLAT_S_MAX,
                      Math.max(s, q.s0 + QUAD_MIN_SIZE_S));
  } else if (cornerIdx === 2) {
    q.phi1 = Math.min(FLAT_PHI_MAX,
                      Math.max(phi, q.phi0 + QUAD_MIN_SIZE_PHI));
    q.s0   = Math.max(FLAT_S_MIN,
                      Math.min(s, q.s1 - QUAD_MIN_SIZE_S));
  } else if (cornerIdx === 3) {
    q.phi0 = Math.max(FLAT_PHI_MIN,
                      Math.min(phi, q.phi1 - QUAD_MIN_SIZE_PHI));
    q.s0   = Math.max(FLAT_S_MIN,
                      Math.min(s, q.s1 - QUAD_MIN_SIZE_S));
  }
}

function flatMoveEdge(q, edge, phi, s) {
  if (edge === "top") {
    q.s1 = Math.min(FLAT_S_MAX, Math.max(s, q.s0 + QUAD_MIN_SIZE_S));
  } else if (edge === "bottom") {
    q.s0 = Math.max(FLAT_S_MIN, Math.min(s, q.s1 - QUAD_MIN_SIZE_S));
  } else if (edge === "left") {
    q.phi0 = Math.max(FLAT_PHI_MIN,
                      Math.min(phi, q.phi1 - QUAD_MIN_SIZE_PHI));
  } else if (edge === "right") {
    q.phi1 = Math.min(FLAT_PHI_MAX,
                      Math.max(phi, q.phi0 + QUAD_MIN_SIZE_PHI));
  }
}

function flatMoveBody(q, dPhi, dS) {
  q.phi0 += dPhi;
  q.phi1 += dPhi;

  let ns0 = q.s0 + dS, ns1 = q.s1 + dS;
  if (ns0 < FLAT_S_MIN) { ns1 += FLAT_S_MIN - ns0; ns0 = FLAT_S_MIN; }
  if (ns1 > FLAT_S_MAX) { ns0 -= ns1 - FLAT_S_MAX; ns1 = FLAT_S_MAX; }
  if (ns0 < FLAT_S_MIN) ns0 = FLAT_S_MIN;

  q.s0 = ns0; q.s1 = ns1;
}

/* ==========================================================================
   STATE
   ========================================================================== */

const floatSquares = [];
let nextSquareId = 1;
let selectedSquare = -1;

const SHAPE_DEFAULT_SCALE = 0.75;
const SHAPE_MIN_SCALE     = 0.03;
const SHAPE_MAX_SCALE     = 3.00;

/* One depth multiplier, both views. */
let SHAPE_DEPTH = 0.75;

/* Full perspective, always. */
const SHAPE_PERSP_STRENGTH = 1;

const WEDGE_BASE_REACH = 2.50;

const ROTATE_HANDLE_OFFSET = 0.25;
const ROTATE_HANDLE_R      = 10;

/* ==========================================================================
   PATCH FRAME
   ========================================================================== */

function patchFrame(quadIdx) {
  if (quadIdx < 0 || quadIdx >= quads.length) return null;
  const q = quads[quadIdx];
  const c = quadCorners(q).map(v => surfacePoint(v.phi, v.s));
  const C0 = c[0], C1 = c[1], C2 = c[2], C3 = c[3];

  const Cx = (C0[0] + C1[0] + C2[0] + C3[0]) / 4;
  const Cy = (C0[1] + C1[1] + C2[1] + C3[1]) / 4;

  let Ux = (C1[0] + C2[0]) / 2 - (C0[0] + C3[0]) / 2;
  let Uy = (C1[1] + C2[1]) / 2 - (C0[1] + C3[1]) / 2;

  let Vx = (C0[0] + C1[0]) / 2 - (C3[0] + C2[0]) / 2;
  let Vy = (C0[1] + C1[1]) / 2 - (C3[1] + C2[1]) / 2;

  const uLen = Math.hypot(Ux, Uy) || 1;
  const vLen = Math.hypot(Vx, Vy) || 1;

  Ux /= uLen; Uy /= uLen;
  Vx /= vLen; Vy /= vLen;

  const det = Ux * Vy - Uy * Vx;
  if (Math.abs(det) < 1e-9) return null;

  return { Cx, Cy, Ux, Uy, Vx, Vy, det, uLen, vLen };
}

function frameToWorld(f, u, v) {
  return [f.Cx + u * f.Ux + v * f.Vx,
          f.Cy + u * f.Uy + v * f.Vy];
}

function frameToScreen(f, u, v) {
  const [wx, wy] = frameToWorld(f, u, v);
  return w2s(wx, wy);
}

function screenToFrame(f, sx, sy) {
  const [wx, wy] = s2w(sx, sy);
  const dx = wx - f.Cx;
  const dy = wy - f.Cy;
  return {
    u: (dx * f.Vy - dy * f.Vx) / f.det,
    v: (f.Ux * dy - f.Uy * dx) / f.det,
  };
}

function quadIdxById(id) {
  for (let i = 0; i < quads.length; i++) {
    if (quads[i].id === id) return i;
  }
  return -1;
}

/* ==========================================================================
   PATCH CORNERS IN LOCAL FRAME — [TL, TR, BR, BL]
   ========================================================================== */

function patchCornersLocal(quadIdx) {
  if (quadIdx < 0 || quadIdx >= quads.length) return null;
  const f = patchFrame(quadIdx);
  if (!f) return null;
  const q = quads[quadIdx];
  const world = quadCorners(q).map(c => surfacePoint(c.phi, c.s));
  return world.map(([wx, wy]) => {
    const dx = wx - f.Cx;
    const dy = wy - f.Cy;
    return [
      (dx * f.Vy - dy * f.Vx) / f.det,
      (f.Ux * dy - f.Uy * dx) / f.det,
    ];
  });
}

/* ==========================================================================
   HORIZON
   ========================================================================== */

function horizonLocal(qi) {
  if (qi < 0 || qi >= quads.length) return null;
  const q = quads[qi];
  const ds = q.s1 - q.s0;
  if (Math.abs(ds) < 1e-9) return null;
  const sAvg = (q.s0 + q.s1) / 2;
  return { vHat: (1 - sAvg) / ds };
}

function perspAt(qi, vHat) {
  const h = horizonLocal(qi);
  if (!h || h.vHat <= 1e-6) return 1;
  const p = (h.vHat - vHat) / h.vHat;
  return Math.max(0, p);
}

/* ==========================================================================
   CLAMP — v only
   ========================================================================== */

function clampCloneV(qi, vHat) {
  const h = horizonLocal(qi);
  if (!h) return vHat;
  const vMin = -WEDGE_BASE_REACH;
  const vMax = h.vHat;
  if (vMax <= vMin) return vMin;
  return Math.max(vMin, Math.min(vMax, vHat));
}

function setClonePosition(sq, uLocal, vLocal) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return;
  const f = patchFrame(qi);
  if (!f) return;
  sq.u = uLocal / f.uLen;
  sq.v = clampCloneV(qi, vLocal / f.vLen);
}

/* ==========================================================================
   LIFECYCLE
   ========================================================================== */

function addSquareAt(quadIdx, uLocal, vLocal) {
  if (quadIdx < 0 || quadIdx >= quads.length) return;
  const q = quads[quadIdx];
  const f = patchFrame(quadIdx);
  if (!f) return;
  const uHat = uLocal / f.uLen;
  const vHat = clampCloneV(quadIdx, vLocal / f.vLen);
  floatSquares.push({
    id: nextSquareId++,
    quadId: q.id,
    u: uHat, v: vHat,
    scaleU: SHAPE_DEFAULT_SCALE,
    scaleV: SHAPE_DEFAULT_SCALE,
    theta: 0,
  });
  selectedSquare = floatSquares.length - 1;
  syncQuadList();
  draw();
}

function addSquareAtCenter(quadIdx) { addSquareAt(quadIdx, 0, 0); }

function deleteSquare(idx) {
  if (idx < 0 || idx >= floatSquares.length) return;
  floatSquares.splice(idx, 1);
  if (selectedSquare === idx) selectedSquare = -1;
  else if (selectedSquare > idx) selectedSquare -= 1;
  syncQuadList();
  draw();
}

function deleteSquaresForQuad(quadId) {
  for (let i = floatSquares.length - 1; i >= 0; i--) {
    if (floatSquares[i].quadId === quadId) {
      floatSquares.splice(i, 1);
      if (selectedSquare === i) selectedSquare = -1;
      else if (selectedSquare > i) selectedSquare -= 1;
    }
  }
}

function clampShapeScales(sq) {
  sq.scaleU = Math.max(SHAPE_MIN_SCALE,
              Math.min(SHAPE_MAX_SCALE, sq.scaleU));
  sq.scaleV = Math.max(SHAPE_MIN_SCALE,
              Math.min(SHAPE_MAX_SCALE, sq.scaleV));
}

/* ==========================================================================
   GEOMETRY
   ========================================================================== */

function squareDims(sq) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return { w: 0, h: 0 };
  const f = patchFrame(qi);
  if (!f) return { w: 0, h: 0 };
  return { w: sq.scaleU * f.uLen,
           h: sq.scaleV * f.uLen * SHAPE_DEPTH };
}

function squareCenterLocal(sq) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return null;
  const f = patchFrame(qi);
  if (!f) return null;
  return [sq.u * f.uLen, sq.v * f.vLen];
}

function squareCornersLocal(sq) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return null;
  const f = patchFrame(qi);
  if (!f) return null;

  const uC = sq.u * f.uLen;
  const vC = sq.v * f.vLen;
  const dims = squareDims(sq);
  const hw = dims.w / 2;
  const hh = dims.h / 2;

  const cosT = Math.cos(sq.theta || 0);
  const sinT = Math.sin(sq.theta || 0);

  const raw = [
    [-hw, +hh], [+hw, +hh], [+hw, -hh], [-hw, -hh],
  ];
  return raw.map(([dx, dy]) => {
    const rx = dx * cosT - dy * sinT;
    const ry = dx * sinT + dy * cosT;
    return [uC + rx, vC + ry];
  });
}

function squareRotateHandleLocal(sq) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return null;
  const f = patchFrame(qi);
  if (!f) return null;
  const uC = sq.u * f.uLen;
  const vC = sq.v * f.vLen;
  const dims = squareDims(sq);
  const k = dims.h / 2 + ROTATE_HANDLE_OFFSET * f.uLen;
  const cosT = Math.cos(sq.theta || 0);
  const sinT = Math.sin(sq.theta || 0);
  return [uC + (-k * sinT), vC + (+k * cosT)];
}

/* ==========================================================================
   PROJECTION — full per-vertex perspective
   ========================================================================== */

function planePointToScreen(f, qi, lu, lv) {
  const [wx, wy] = frameToWorld(f, lu, lv);
  const [sx, sy] = w2s(wx, wy);
  const [ax, ay] = w2s(cone.ax, cone.ay);
  const vHat = lv / f.vLen;
  const p = perspAt(qi, vHat);
  return [ax + p * (sx - ax), ay + p * (sy - ay)];
}

/* ==========================================================================
   SHAPE RENDERING — CONE BAND
   ========================================================================== */

function squareCornersScreen(sq) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return null;
  const f = patchFrame(qi);
  if (!f) return null;
  const local = squareCornersLocal(sq);
  if (!local) return null;
  return local.map(([u, v]) => planePointToScreen(f, qi, u, v));
}

function squareRotateHandleScreen(sq) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return null;
  const f = patchFrame(qi);
  if (!f) return null;
  const hl = squareRotateHandleLocal(sq);
  if (!hl) return null;
  return planePointToScreen(f, qi, hl[0], hl[1]);
}

/* ==========================================================================
   RENDERING
   ========================================================================== */

const HORIZON_REACH = 4000;

function drawHorizon(qi) {
  const f = patchFrame(qi);
  if (!f) return;
  const [ax, ay] = [cone.ax, cone.ay];
  const p1 = w2s(ax - HORIZON_REACH * f.Ux, ay - HORIZON_REACH * f.Uy);
  const p2 = w2s(ax + HORIZON_REACH * f.Ux, ay + HORIZON_REACH * f.Uy);
  ctx.save();
  ctx.strokeStyle = "rgba(120, 220, 255, 0.42)";
  ctx.lineWidth = 1.3;
  ctx.setLineDash([7, 6]);
  ctx.beginPath();
  ctx.moveTo(p1[0], p1[1]);
  ctx.lineTo(p2[0], p2[1]);
  ctx.stroke();
  ctx.setLineDash([]);
  const [axs, ays] = w2s(ax, ay);
  ctx.beginPath();
  ctx.arc(axs, ays, 7.5, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(120, 220, 255, 0.85)";
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.restore();
}

function drawBaseReach(qi) {
  const f = patchFrame(qi);
  if (!f) return;
  const vLocal = -WEDGE_BASE_REACH * f.vLen;
  const [px, py] = frameToWorld(f, 0, vLocal);
  const p1 = w2s(px - HORIZON_REACH * f.Ux, py - HORIZON_REACH * f.Uy);
  const p2 = w2s(px + HORIZON_REACH * f.Ux, py + HORIZON_REACH * f.Uy);
  ctx.save();
  ctx.strokeStyle = "rgba(120, 220, 255, 0.22)";
  ctx.lineWidth = 1.0;
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.moveTo(p1[0], p1[1]);
  ctx.lineTo(p2[0], p2[1]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawFloatSquares() {
  for (let i = 0; i < floatSquares.length; i++) {
    if (i === selectedSquare) continue;
    drawFloatSquare(floatSquares[i], false);
  }
  if (selectedSquare >= 0 && selectedSquare < floatSquares.length) {
    drawFloatSquare(floatSquares[selectedSquare], true);
  }
}

function _drawRotateHandle(sx, sy) {
  ctx.beginPath();
  ctx.arc(sx, sy, 6.0, 0, Math.PI * 2);
  ctx.fillStyle = "#b8ecff";
  ctx.fill();
  ctx.strokeStyle = "#0a0e14";
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(sx, sy, 3.0, Math.PI * 0.15, Math.PI * 1.85);
  ctx.strokeStyle = "#0a0e14";
  ctx.lineWidth = 1.2;
  ctx.stroke();
}

function drawFloatSquare(sq, selected) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return;
  if (selected) {
    drawHorizon(qi);
    drawBaseReach(qi);
  }
  const pts = squareCornersScreen(sq);
  if (!pts) return;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < 4; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = selected
    ? "rgba(120, 220, 255, 0.30)"
    : "rgba(120, 220, 255, 0.12)";
  ctx.fill();
  ctx.lineJoin = "round";
  ctx.strokeStyle = selected
    ? "rgba(180, 240, 255, 1.00)"
    : "rgba(140, 225, 255, 0.72)";
  ctx.lineWidth = selected ? 2.0 : 1.3;
  ctx.stroke();
  if (!selected) return;
  for (const [sx, sy] of pts) {
    ctx.beginPath();
    ctx.arc(sx, sy, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = "#b8ecff";
    ctx.fill();
    ctx.strokeStyle = "#0a0e14";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  const rh = squareRotateHandleScreen(sq);
  if (rh) _drawRotateHandle(rh[0], rh[1]);
}

/* ==========================================================================
   HIT TESTING — cone band
   ========================================================================== */

const SQUARE_HANDLE_R   = 10;
const SQUARE_BODY_MIN_R = 8;

function _ptInQuadPx(px, py, poly) {
  let inside = false;
  for (let i = 0, j = 3; i < 4; j = i++) {
    const xi = poly[i][0], yi = poly[i][1];
    const xj = poly[j][0], yj = poly[j][1];
    if (((yi > py) !== (yj > py)) &&
        (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) {
      inside = !inside;
    }
  }
  return inside;
}

function squareHitTest(sx, sy) {
  const order = [];
  if (selectedSquare >= 0 && selectedSquare < floatSquares.length) {
    order.push(selectedSquare);
  }
  for (let i = 0; i < floatSquares.length; i++) {
    if (i !== selectedSquare) order.push(i);
  }
  for (const si of order) {
    const sq = floatSquares[si];
    const pts = squareCornersScreen(sq);
    if (!pts) continue;
    const rh = squareRotateHandleScreen(sq);
    if (rh && Math.hypot(sx - rh[0], sy - rh[1]) < ROTATE_HANDLE_R) {
      return { kind: "rotate", squareIdx: si };
    }
    for (let ci = 0; ci < 4; ci++) {
      if (Math.hypot(sx - pts[ci][0], sy - pts[ci][1]) < SQUARE_HANDLE_R) {
        return { kind: "corner", squareIdx: si, cornerIdx: ci };
      }
    }
    if (_ptInQuadPx(sx, sy, pts)) return { kind: "body", squareIdx: si };
    const mx = (pts[0][0] + pts[1][0] + pts[2][0] + pts[3][0]) / 4;
    const my = (pts[0][1] + pts[1][1] + pts[2][1] + pts[3][1]) / 4;
    if (Math.hypot(sx - mx, sy - my) < SQUARE_BODY_MIN_R) {
      return { kind: "body", squareIdx: si };
    }
  }
  return null;
}

function findPatchAtScreen(sx, sy) {
  for (let qi = quads.length - 1; qi >= 0; qi--) {
    const q = quads[qi];
    const corners = quadCorners(q).map(c => {
      const [wx, wy] = surfacePoint(c.phi, c.s);
      return w2s(wx, wy);
    });
    if (_ptInQuadPx(sx, sy, corners)) return qi;
  }
  return -1;
}

/* ==========================================================================
   INVERSE OF THE PER-VERTEX PROJECTION
   ========================================================================== */

function cursorToLocalWithPersp(f, qi, sx, sy) {
  const h = horizonLocal(qi);
  if (!h) return screenToFrame(f, sx, sy);
  const vMax = h.vHat * f.vLen;
  if (vMax < 1e-6) return screenToFrame(f, sx, sy);

  const [ax, ay] = w2s(cone.ax, cone.ay);
  const SX = sx - ax;
  const SY = sy - ay;

  const sc = view.scale;
  const A =  sc * (f.Cx - cone.ax);
  const B =  sc * f.Ux;
  const C =  sc * f.Vx;
  const D = -sc * (f.Cy - cone.ay);
  const E = -sc * f.Uy;
  const F = -sc * f.Vy;

  const P = E * SX - B * SY;
  const Q = E * A  - B * D;
  const R = E * C  - B * F;

  const a = -R / vMax;
  const b = R - Q / vMax;
  const c = Q - P;

  let v = null;
  if (Math.abs(a) < 1e-12) {
    if (Math.abs(b) > 1e-12) v = -c / b;
  } else {
    const disc = b * b - 4 * a * c;
    if (disc >= 0) {
      const sq = Math.sqrt(disc);
      const r1 = (-b - sq) / (2 * a);
      const r2 = (-b + sq) / (2 * a);
      const ok = (r) => isFinite(r)
                     && r < vMax - 1e-3
                     && r > -50 * f.vLen;
      const r1ok = ok(r1), r2ok = ok(r2);
      if (r1ok && r2ok) v = Math.abs(r1) < Math.abs(r2) ? r1 : r2;
      else if (r1ok) v = r1;
      else if (r2ok) v = r2;
    }
  }

  if (v === null || !isFinite(v)) return screenToFrame(f, sx, sy);

  const pEff = 1 - v / vMax;
  if (Math.abs(pEff) < 1e-9) return { u: 0, v };

  let u;
  if (Math.abs(B) >= Math.abs(E)) {
    if (Math.abs(B) < 1e-9) return { u: 0, v };
    u = (SX / pEff - A - C * v) / B;
  } else {
    u = (SY / pEff - D - F * v) / E;
  }
  return { u, v };
}

/* ==========================================================================
   SHARED EDIT OPERATIONS
   ========================================================================== */

function setShapeFromCornerLocal(sq, cornerIdx, cu, cv) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return;
  const f = patchFrame(qi);
  if (!f) return;
  const c = squareCenterLocal(sq);
  if (!c) return;
  const [uC, vC] = c;
  const ox = cu - uC;
  const oy = cv - vC;
  const cosT = Math.cos(sq.theta || 0);
  const sinT = Math.sin(sq.theta || 0);
  const ux = ox * cosT + oy * sinT;
  const uy = -ox * sinT + oy * cosT;
  const signs = [[-1, +1], [+1, +1], [+1, -1], [-1, -1]][cornerIdx];
  const sx = signs[0], sy = signs[1];
  const wMin = SHAPE_MIN_SCALE * f.uLen;
  const hMin = SHAPE_MIN_SCALE * f.uLen * SHAPE_DEPTH;
  const w = Math.max(2 * sx * ux, wMin);
  const h = Math.max(2 * sy * uy, hMin);
  sq.scaleU = w / f.uLen;
  sq.scaleV = h / (f.uLen * SHAPE_DEPTH);
  clampShapeScales(sq);
}

function setShapeRotationFromCursorLocal(sq, cu, cv, snap) {
  const c = squareCenterLocal(sq);
  if (!c) return;
  const ox = cu - c[0];
  const oy = cv - c[1];
  if (Math.abs(ox) < 1e-6 && Math.abs(oy) < 1e-6) return;
  let theta = Math.atan2(-ox, oy);
  if (snap) {
    const step = Math.PI / 12;
    theta = Math.round(theta / step) * step;
  }
  sq.theta = theta;
}

/* ==========================================================================
   CONE-BAND EDIT WRAPPERS
   ========================================================================== */

function resizeSquareFromCorner(sq, cornerIdx, cursorWX, cursorWY) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return;
  const f = patchFrame(qi);
  if (!f) return;
  const [sx, sy] = w2s(cursorWX, cursorWY);
  const lc = cursorToLocalWithPersp(f, qi, sx, sy);
  setShapeFromCornerLocal(sq, cornerIdx, lc.u, lc.v);
}

function rotateSquareToCursor(sq, cursorWX, cursorWY, snap) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return;
  const f = patchFrame(qi);
  if (!f) return;
  const [sx, sy] = w2s(cursorWX, cursorWY);
  const lc = cursorToLocalWithPersp(f, qi, sx, sy);
  setShapeRotationFromCursorLocal(sq, lc.u, lc.v, snap);
}

/* ==========================================================================
   FLAT-VIEW PROJECTION
   ========================================================================== */

function squareFlatCorners(sq) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return null;
  const q = quads[qi];
  const f = patchFrame(qi);
  if (!f) return null;
  const locals = squareCornersLocal(sq);
  if (!locals) return null;
  const phiC = (q.phi0 + q.phi1) / 2;
  const sC   = (q.s0   + q.s1)   / 2;
  const dPhi = q.phi1 - q.phi0;
  const dS   = q.s1   - q.s0;
  return locals.map(([u, v]) => [
    phiC + (u / f.uLen) * dPhi,
    sC   + (v / f.vLen) * dS,
  ]);
}

function squareFlatCornersScreen(sq, shift) {
  const corners = squareFlatCorners(sq);
  if (!corners) return null;
  return corners.map(([phi, s]) => flatToScreen(phi + shift, s));
}

function squareFlatRotateHandleScreen(sq) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return null;
  const q = quads[qi];
  const f = patchFrame(qi);
  if (!f) return null;
  const hl = squareRotateHandleLocal(sq);
  if (!hl) return null;
  const phiC = (q.phi0 + q.phi1) / 2;
  const sC   = (q.s0   + q.s1)   / 2;
  const dPhi = q.phi1 - q.phi0;
  const dS   = q.s1   - q.s0;
  const phi = phiC + (hl[0] / f.uLen) * dPhi;
  const s   = sC   + (hl[1] / f.vLen) * dS;
  return flatToScreen(phi, s);
}

/* ==========================================================================
   FLAT-VIEW EDIT WRAPPERS
   ========================================================================== */

function flatCursorToShapeLocal(sq, sx, sy) {
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return null;
  const q = quads[qi];
  const f = patchFrame(qi);
  if (!f) return null;
  const { phi, s } = screenToFlat(sx, sy);
  const phiAdj = phi + _phiShiftForPatch(phi, q.phi0, q.phi1);
  const phiC = (q.phi0 + q.phi1) / 2;
  const sC   = (q.s0   + q.s1)   / 2;
  const dPhi = q.phi1 - q.phi0;
  const dS   = q.s1   - q.s0;
  if (Math.abs(dPhi) < 1e-9 || Math.abs(dS) < 1e-9) return null;
  const uHat = (phiAdj - phiC) / dPhi;
  const vHat = (s      - sC)   / dS;
  return { u: uHat * f.uLen, v: vHat * f.vLen };
}

function flatResizeSquareFromCornerIdx(sq, sx, sy, cornerIdx) {
  const lc = flatCursorToShapeLocal(sq, sx, sy);
  if (!lc) return;
  setShapeFromCornerLocal(sq, cornerIdx, lc.u, lc.v);
}

function flatRotateSquareToCursor(sq, sx, sy, snap) {
  const lc = flatCursorToShapeLocal(sq, sx, sy);
  if (!lc) return;
  setShapeRotationFromCursorLocal(sq, lc.u, lc.v, snap);
}

function flatMoveSquareBody(sq, sx, sy) {
  const lc = flatCursorToShapeLocal(sq, sx, sy);
  if (!lc) return;
  const qi = quadIdxById(sq.quadId);
  if (qi < 0) return;
  setClonePosition(sq, lc.u, lc.v);
}

/* ==========================================================================
   FLAT-VIEW HIT TEST
   ========================================================================== */

function squareFlatHitTest(sx, sy) {
  if (selectedQuad < 0 || selectedQuad >= quads.length) return null;
  const activeQ = quads[selectedQuad];
  for (let i = floatSquares.length - 1; i >= 0; i--) {
    const sq = floatSquares[i];
    if (sq.quadId !== activeQ.id) continue;
    const rh = squareFlatRotateHandleScreen(sq);
    if (rh && Math.hypot(sx - rh[0], sy - rh[1]) < ROTATE_HANDLE_R) {
      return { kind: "rotate", squareIdx: i };
    }
    const corners = squareFlatCorners(sq);
    if (!corners) continue;
    const phis = corners.map(c => c[0]);
    const shifts = _phiCopies(Math.min(...phis), Math.max(...phis));
    for (const shift of shifts) {
      const screen = corners.map(([phi, s]) =>
        flatToScreen(phi + shift, s));
      for (let ci = 0; ci < 4; ci++) {
        if (Math.hypot(sx - screen[ci][0], sy - screen[ci][1])
            < FLAT_HANDLE_R) {
          return { kind: "corner", squareIdx: i, cornerIdx: ci };
        }
      }
      if (_ptInQuadPx(sx, sy, screen)) {
        return { kind: "body", squareIdx: i };
      }
    }
  }
  return null;
}

/* ==========================================================================
   VISUAL STATE EXPORT
   ========================================================================== */

function _round3(v) { return Math.round(v * 1000) / 1000; }

function _screenSideLengths(pts) {
  const out = [];
  for (let i = 0; i < 4; i++) {
    const a = pts[i];
    const b = pts[(i + 1) % 4];
    out.push(_round3(Math.hypot(b[0] - a[0], b[1] - a[1])));
  }
  return out;
}

function _worldSideLengths(pts) {
  const out = [];
  for (let i = 0; i < 4; i++) {
    const a = pts[i];
    const b = pts[(i + 1) % 4];
    out.push(_round3(Math.hypot(b[0] - a[0], b[1] - a[1])));
  }
  return out;
}

function buildVisualStateExport() {
  const out = {
    schemaVersion: 2,
    generatedAt:   new Date().toISOString(),

    cone: {
      ax:            _round3(cone.ax),
      ay:            _round3(cone.ay),
      depth:         _round3(cone.depth),
      halfAngleRad:  _round3(cone.halfAngle),
      halfAngleDeg:  _round3(cone.halfAngle * 180 / Math.PI),
      ringCount:     cone.ringCount,
      meridianCount: cone.meridianCount,
      R_world:       _round3(coneR()),
    },

    shapeDepth:     SHAPE_DEPTH,
    perspStrength:  SHAPE_PERSP_STRENGTH,

    view: {
      scale: _round3(view.scale),
      tx:    _round3(view.tx),
      ty:    _round3(view.ty),
      zoom:  _round3(view.zoom),
    },

    layout: {
      coneH:     layout.coneH,
      dividerY:  layout.dividerY,
      reservedY: layout.reservedY,
      reservedH: layout.reservedH,
    },

    patches: [],
    shapes:  [],
  };

  for (const q of quads) {
    const qi = quads.indexOf(q);
    const f = patchFrame(qi);

    const entry = {
      id:   q.id,
      name: q.name,
      phi0: _round3(q.phi0),
      phi1: _round3(q.phi1),
      s0:   _round3(q.s0),
      s1:   _round3(q.s1),
    };

    if (f) {
      entry.frame = {
        Cx:   _round3(f.Cx),
        Cy:   _round3(f.Cy),
        Ux:   _round3(f.Ux),
        Uy:   _round3(f.Uy),
        Vx:   _round3(f.Vx),
        Vy:   _round3(f.Vy),
        uLen: _round3(f.uLen),
        vLen: _round3(f.vLen),
        det:  _round3(f.det),
      };

      entry.cornersScreenCone = quadCorners(q).map(c => {
        const [wx, wy] = surfacePoint(c.phi, c.s);
        const [sx, sy] = w2s(wx, wy);
        return [_round3(sx), _round3(sy)];
      });

      entry.cornersScreenFlat = quadCorners(q).map(c => {
        const [sx, sy] = flatToScreen(c.phi, c.s);
        return [_round3(sx), _round3(sy)];
      });
    }

    out.patches.push(entry);
  }

  for (let i = 0; i < floatSquares.length; i++) {
    const sq = floatSquares[i];
    const qi = quadIdxById(sq.quadId);
    if (qi < 0) continue;
    const f = patchFrame(qi);

    const entry = {
      id:     sq.id,
      quadId: sq.quadId,
      index:  i,
      u:      _round3(sq.u),
      v:      _round3(sq.v),
      scaleU: _round3(sq.scaleU),
      scaleV: _round3(sq.scaleV),
      thetaRad: _round3(sq.theta || 0),
      thetaDeg: _round3((sq.theta || 0) * 180 / Math.PI),
    };

    if (!f) {
      out.shapes.push(entry);
      continue;
    }

    entry.uLen = _round3(f.uLen);
    entry.vLen = _round3(f.vLen);

    /* ---- The one array both views read ------------------------ */

    const local = squareCornersLocal(sq);
    const world = local.map(([u, v]) => frameToWorld(f, u, v));
    const dims  = squareDims(sq);

    entry.dims = { w: _round3(dims.w), h: _round3(dims.h) };
    entry.cornersLocal = local.map(p =>
      [_round3(p[0]), _round3(p[1])]);
    entry.cornersWorld = world.map(p =>
      [_round3(p[0]), _round3(p[1])]);
    entry.worldSideLengths = _worldSideLengths(world);

    /* ---- Cone-band projection --------------------------------- */

    const screenCone = squareCornersScreen(sq);
    if (screenCone) {
      entry.cornersScreenCone = screenCone.map(p =>
        [_round3(p[0]), _round3(p[1])]);
      entry.screenSideLengthsCone = _screenSideLengths(screenCone);
    }

    /* ---- Flat-band projection --------------------------------- */

    const flatCorners = squareFlatCorners(sq);
    if (flatCorners) {
      const screenFlat = flatCorners.map(([phi, s]) =>
        flatToScreen(phi, s));
      entry.cornersFlatParam = flatCorners.map(p =>
        [_round3(p[0]), _round3(p[1])]);
      entry.cornersScreenFlat = screenFlat.map(p =>
        [_round3(p[0]), _round3(p[1])]);
      entry.screenSideLengthsFlat = _screenSideLengths(screenFlat);
    }

    out.shapes.push(entry);
  }

  return out;
}

function exportVisualStateJSON() {
  const data = buildVisualStateExport();
  const text = JSON.stringify(data, null, 2);
  const url  = "data:application/json;charset=utf-8,"
             + encodeURIComponent(text);

  const a = document.createElement("a");
  a.href = url;
  a.download = "cone_visual_state.json";
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  if (typeof flashStatus === "function") {
    flashStatus("Exported " + quads.length + " patch(es) and " +
                floatSquares.length + " shape(s)", "ok");
  }
}

/* ==========================================================================
   SLIDER SYNC
   ========================================================================== */

function syncPanelSliders() {
  const d  = document.getElementById("depthSlider");
  const a  = document.getElementById("angleSlider");
  const r  = document.getElementById("ringsSlider");
  const m  = document.getElementById("meridiansSlider");
  const sd = document.getElementById("shapeDepthSlider");
  if (d)  d.value  = cone.depth;
  if (a)  a.value  = Math.round(cone.halfAngle * 180 / Math.PI);
  if (r)  r.value  = cone.ringCount;
  if (m)  m.value  = cone.meridianCount;
  if (sd) sd.value = SHAPE_DEPTH;
  updatePanelLabels();
}

function updatePanelLabels() {
  const dv  = document.getElementById("depthVal");
  const av  = document.getElementById("angleVal");
  const rv  = document.getElementById("ringsVal");
  const mv  = document.getElementById("meridiansVal");
  const sdv = document.getElementById("shapeDepthVal");
  if (dv)  dv.textContent  = cone.depth.toFixed(1);
  if (av)  av.textContent  =
    Math.round(cone.halfAngle * 180 / Math.PI) + "\u00B0";
  if (rv)  rv.textContent  = String(cone.ringCount);
  if (mv)  mv.textContent  = String(cone.meridianCount);
  if (sdv) sdv.textContent = SHAPE_DEPTH.toFixed(2);
}

/* ==========================================================================
   PATCH LIST
   ========================================================================== */

function syncQuadList() {
  syncSquareList();
  const list = document.getElementById("quadList");
  if (!list) return;
  list.innerHTML = "";
  if (quads.length === 0) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "no patches yet";
    list.appendChild(e);
    return;
  }
  for (let i = 0; i < quads.length; i++) {
    const q   = quads[i];
    const row = document.createElement("div");
    row.className = "quadRow" + (i === selectedQuad ? " selected" : "");
    row.dataset.idx = String(i);
    const sw = document.createElement("span");
    sw.className = "quadSwatch";
    row.appendChild(sw);
    const lb = document.createElement("span");
    lb.className = "quadLabel";
    lb.textContent = q.name;
    row.appendChild(lb);
    const del = document.createElement("button");
    del.className = "quadDel";
    del.textContent = "\u00D7";
    del.title = "Delete patch";
    del.addEventListener("click", (e) => {
      e.stopPropagation();
      deleteQuad(i);
    });
    row.appendChild(del);
    row.addEventListener("click", () => {
      selectedQuad = i;
      syncQuadList();
      draw();
    });
    list.appendChild(row);
  }
}

/* ==========================================================================
   SQUARE LIST
   ========================================================================== */

function syncSquareList() {
  const list = document.getElementById("squareList");
  if (!list) return;
  list.innerHTML = "";
  if (selectedQuad < 0 || selectedQuad >= quads.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "select a patch";
    list.appendChild(e);
    return;
  }
  const activeQ = quads[selectedQuad];
  const rows = [];
  for (let i = 0; i < floatSquares.length; i++) {
    if (floatSquares[i].quadId === activeQ.id) {
      rows.push({ sq: floatSquares[i], idx: i });
    }
  }
  if (rows.length === 0) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "no squares on " + activeQ.name + " yet";
    list.appendChild(e);
    return;
  }
  for (const { sq, idx } of rows) {
    const row = document.createElement("div");
    row.className = "quadRow squareRow"
                  + (idx === selectedSquare ? " selected" : "");
    row.dataset.idx = String(idx);
    const sw = document.createElement("span");
    sw.className = "quadSwatch";
    row.appendChild(sw);
    const lb = document.createElement("span");
    lb.className = "quadLabel";
    lb.textContent = "S" + sq.id;
    row.appendChild(lb);
    const del = document.createElement("button");
    del.className = "quadDel";
    del.textContent = "\u00D7";
    del.title = "Delete square";
    del.addEventListener("click", (e) => {
      e.stopPropagation();
      deleteSquare(idx);
    });
    row.appendChild(del);
    row.addEventListener("click", () => {
      selectedSquare = idx;
      syncQuadList();
      draw();
    });
    list.appendChild(row);
  }
}

/* ==========================================================================
   STATUS FLASH
   ========================================================================== */

let _statusTimer = null;
function flashStatus(msg, cls) {
  const el = document.getElementById("status");
  if (!el) return;
  el.textContent = msg;
  el.className = cls || "";
  if (_statusTimer) clearTimeout(_statusTimer);
  _statusTimer = setTimeout(() => {
    _statusTimer = null;
    el.textContent = "";
    el.className = "";
  }, 1800);
}

/* ==========================================================================
   BINDINGS
   ========================================================================== */

(function installPanel() {
  const d  = document.getElementById("depthSlider");
  const a  = document.getElementById("angleSlider");
  const r  = document.getElementById("ringsSlider");
  const m  = document.getElementById("meridiansSlider");
  const sd = document.getElementById("shapeDepthSlider");

  const resetBtn  = document.getElementById("resetBtn");
  const centerBtn = document.getElementById("centerBtn");
  const addBtn    = document.getElementById("addQuadBtn");
  const addSqBtn  = document.getElementById("addSquareBtn");
  const exportBtn = document.getElementById("exportBtn");

  if (d) d.addEventListener("input", () => {
    cone.depth = parseFloat(d.value);
    clampApex();
    updatePanelLabels();
    draw();
  });
  if (a) a.addEventListener("input", () => {
    cone.halfAngle = parseFloat(a.value) * Math.PI / 180;
    clampApex();
    updatePanelLabels();
    draw();
  });
  if (r) r.addEventListener("input", () => {
    cone.ringCount = parseInt(r.value, 10);
    updatePanelLabels();
    draw();
  });
  if (m) m.addEventListener("input", () => {
    cone.meridianCount = parseInt(m.value, 10);
    updatePanelLabels();
    draw();
  });
  if (sd) sd.addEventListener("input", () => {
    SHAPE_DEPTH = parseFloat(sd.value);
    updatePanelLabels();
    draw();
  });

  if (resetBtn)  resetBtn.addEventListener("click", resetView);
  if (centerBtn) centerBtn.addEventListener("click", () => {
    cone.ax = 0;
    cone.ay = 0;
    draw();
  });
  if (addBtn)   addBtn.addEventListener("click", addQuad);
  if (addSqBtn) addSqBtn.addEventListener("click", () => {
    if (selectedQuad < 0 || selectedQuad >= quads.length) return;
    addSquareAtCenter(selectedQuad);
  });
  if (exportBtn) {
    exportBtn.addEventListener("click", exportVisualStateJSON);
  }

  window.addEventListener("keydown", (e) => {
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
    if (e.key === "Delete" || e.key === "Backspace") {
      if (selectedSquare >= 0) {
        e.preventDefault();
        deleteSquare(selectedSquare);
      }
    }
  });
})();

/* ==========================================================================
   DRAW
   ========================================================================== */

function draw() {
  const cw = window.innerWidth;
  const ch = window.innerHeight;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#0a0e14";
  ctx.fillRect(0, 0, cw, ch);

  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, cw, layout.coneH); ctx.clip();
  drawConeView();
  ctx.restore();

  ctx.fillStyle = "#dce6f2";
  ctx.fillRect(0, layout.dividerY,     cw, 1);
  ctx.fillStyle = "#1e2836";
  ctx.fillRect(0, layout.dividerY + 2, cw, 1);

  drawFlatView();

  const M = 6;
  ctx.strokeStyle = "#1e2836";
  ctx.lineWidth = 0.8;
  ctx.strokeRect(M + 0.5, M + 0.5, cw - 2 * M - 1, ch - 2 * M - 1);

  updateStatus();
}

/* ==========================================================================
   STATUS
   ========================================================================== */

function updateStatus() {
  const el = document.getElementById("status");
  if (!el) return;

  if (!state.mouse.inside) {
    el.textContent =
      "drag apex to tilt \u00B7 scroll to change depth \u00B7 " +
      "shift+click a patch to drop a shape \u00B7 " +
      "drag corners, rotate handle, or interior to edit";
    el.className = "";
    return;
  }

  if (state.mouse.sy >= layout.dividerY) {
    const p = screenToFlat(state.mouse.sx, state.mouse.sy);
    el.textContent =
      "flat   \u03C6 = " + p.phi.toFixed(2) +
      "   s = " + p.s.toFixed(3);
    el.className = "ok";
    return;
  }

  const [wx, wy] = s2w(state.mouse.sx, state.mouse.sy);
  const tiltDeg = Math.atan2(Math.hypot(cone.ax, cone.ay), cone.depth)
                  * 180 / Math.PI;

  let drag = "";
  const ds = state.dragSquare || state.flatSquareDrag;
  if (state.dragQuadVertex) {
    drag = "   \u00B7  shaping " + quads[state.dragQuadVertex.quadIdx].name;
  } else if (ds) {
    const sq = floatSquares[ds.squareIdx];
    if (sq) {
      /* Show the dimensions as the ACTIVE band renders them.
         state.dragSquare is a cone-band drag, so it uses the cone
         depth; state.flatSquareDrag is a flat-band drag, so it
         uses the flat depth. */
      const inFlat = !!state.flatSquareDrag;
      const depth  = inFlat ? SHAPE_DEPTH_FLAT : SHAPE_DEPTH_CONE;
      const dims   = squareDims(sq, depth);
      const deg    = Math.round((sq.theta || 0) * 180 / Math.PI);
      drag = "   \u00B7  shape #" + sq.id +
             "  W " + dims.w.toFixed(2) +
             "  H " + dims.h.toFixed(2) +
             "  \u2220 " + deg + "\u00B0";
    }
  } else if (state.dragPatchBody) {
    drag = "   \u00B7  moving " +
           quads[state.dragPatchBody.quadIdx].name;
  } else if (state.flatDrag &&
             state.flatDrag.mode === "body") {
    drag = "   \u00B7  moving " +
           quads[state.flatDrag.quadIdx].name;
  }

  el.textContent =
    "cursor (" + wx.toFixed(1) + ", " + wy.toFixed(1) + ")" +
    "   apex (" + cone.ax.toFixed(1) + ", " + cone.ay.toFixed(1) + ")" +
    "   tilt " + tiltDeg.toFixed(1) + "\u00B0" +
    "   depth " + cone.depth.toFixed(1) +
    drag;
  el.className = "ok";
}

/* ==========================================================================
   HIT TEST — 3D patch corner
   ========================================================================== */

function findQuadVertexAt(sx, sy) {
  const R_HIT = 12;
  let best = null, bestD = R_HIT;

  const order = [];
  if (selectedQuad >= 0 && selectedQuad < quads.length) {
    order.push(selectedQuad);
  }
  for (let i = 0; i < quads.length; i++) {
    if (i !== selectedQuad) order.push(i);
  }

  for (const qi of order) {
    const corners = quadCorners(quads[qi]);
    for (let ci = 0; ci < 4; ci++) {
      const c = corners[ci];
      const [wx, wy]   = surfacePoint(c.phi, c.s);
      const [vsx, vsy] = w2s(wx, wy);
      const d = Math.hypot(sx - vsx, sy - vsy);
      if (d < bestD) {
        bestD = d;
        best = { quadIdx: qi, cornerIdx: ci };
      }
    }
  }
  return best;
}

/* ==========================================================================
   EVENTS
   ========================================================================== */

canvas.addEventListener("mousedown", (e) => {
  if (e.button !== 0) return;
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;

  /* ---- cone band ------------------------------------------------ */
  if (sy < layout.dividerY) {

    /* 1. shift+click drops a shape on the patch under the cursor */
    if (e.shiftKey) {
      const patchIdx = findPatchAtScreen(sx, sy);
      if (patchIdx >= 0) {
        const f = patchFrame(patchIdx);
        if (f) {
          const lc = screenToFrame(f, sx, sy);
          addSquareAt(patchIdx, lc.u, lc.v);
          if (patchIdx !== selectedQuad) {
            selectedQuad = patchIdx;
            syncQuadList();
          }
          draw();
          return;
        }
      }
    }

    /* 2. shape hit — rotate / corner / body */
    const sqHit = squareHitTest(sx, sy);
    if (sqHit) {
      const sq = floatSquares[sqHit.squareIdx];
      const qi = quadIdxById(sq.quadId);
      if (qi >= 0 && qi !== selectedQuad) {
        selectedQuad = qi;
        syncQuadList();
      }
      selectedSquare = sqHit.squareIdx;

      /* Persp is captured once here and reused for every frame of
         the gesture.  Without the freeze, the shape's own persp
         would change mid-drag and the deltas would come out of two
         different scalings. */
      const frozenPersp = shapePersp(sq);

      if (sqHit.kind === "rotate") {
        state.dragSquare = {
          mode: "rotate",
          squareIdx: sqHit.squareIdx,
          persp: frozenPersp,
        };
      } else if (sqHit.kind === "corner") {
        state.dragSquare = {
          mode: "corner",
          squareIdx: sqHit.squareIdx,
          cornerIdx: sqHit.cornerIdx,
          persp: frozenPersp,
        };
      } else {
        const f = qi >= 0 ? patchFrame(qi) : null;
        const c = squareCenterLocal(sq);
        if (f && c) {
          const lc = cursorToLocalWithShapePersp(
            f, qi, sx, sy, frozenPersp);
          state.dragSquare = {
            mode: "body",
            squareIdx: sqHit.squareIdx,
            startCursorU: lc.u,
            startCursorV: lc.v,
            startCenterU: c[0],
            startCenterV: c[1],
            persp: frozenPersp,
          };
        }
      }
      canvas.style.cursor = "grabbing";
      draw();
      return;
    }

    /* 3. patch corner — shape the patch (gated) */
    if (PATCH_SHAPE_EDIT_ENABLED) {
      const vHit = findQuadVertexAt(sx, sy);
      if (vHit) {
        if (vHit.quadIdx !== selectedQuad) {
          selectedQuad = vHit.quadIdx;
          syncQuadList();
        }
        selectedSquare = -1;
        state.dragQuadVertex = vHit;
        canvas.style.cursor = "grabbing";
        draw();
        return;
      }
    }

    /* 4. patch body — translate the patch */
    const patchHit = findPatchAtScreen(sx, sy);
    if (patchHit >= 0) {
      const q = quads[patchHit];
      if (patchHit !== selectedQuad) {
        selectedQuad = patchHit;
        syncQuadList();
      }
      selectedSquare = -1;

      const [wx, wy] = s2w(sx, sy);
      const p0 = projectToConeSurface(wx, wy, (q.s0 + q.s1) / 2);
      state.dragPatchBody = {
        quadIdx: patchHit,
        lastPhi: p0.phi,
        lastS:   p0.s,
      };
      canvas.style.cursor = "grabbing";
      draw();
      return;
    }

    /* 5. else — tilt the apex */
    selectedSquare = -1;
    state.dragApex = {
      startSx: sx, startSy: sy,
      startAx: cone.ax, startAy: cone.ay,
    };
    canvas.style.cursor = "grabbing";
    return;
  }

  /* ---- flat band ------------------------------------------------ */

  /* 1. shape first */
  const sqFlatHit = squareFlatHitTest(sx, sy);
  if (sqFlatHit) {
    const sq = floatSquares[sqFlatHit.squareIdx];
    const qi = quadIdxById(sq.quadId);
    if (qi >= 0 && qi !== selectedQuad) {
      selectedQuad = qi;
      syncQuadList();
    }
    selectedSquare = sqFlatHit.squareIdx;

    if (sqFlatHit.kind === "rotate") {
      state.flatSquareDrag = {
        mode: "rotate",
        squareIdx: sqFlatHit.squareIdx,
      };
    } else if (sqFlatHit.kind === "corner") {
      state.flatSquareDrag = {
        mode: "corner",
        squareIdx: sqFlatHit.squareIdx,
        cornerIdx: sqFlatHit.cornerIdx,
      };
    } else {
      const lc = flatCursorToShapeLocal(sq, sx, sy);
      if (lc) {
        state.flatSquareDrag = {
          mode: "body",
          squareIdx: sqFlatHit.squareIdx,
          startCursorU: lc.u,
          startCursorV: lc.v,
          startCenterU: sq.u,
          startCenterV: sq.v,
        };
      }
    }
    canvas.style.cursor = "grabbing";
    draw();
    return;
  }

  /* 2. patch */
  const hHit = flatHitTest(sx, sy);
  if (!hHit) {
    selectedQuad = -1;
    selectedSquare = -1;
    syncQuadList();
    draw();
    return;
  }
  if (hHit.quadIdx !== selectedQuad) {
    selectedQuad = hHit.quadIdx;
    syncQuadList();
  }
  selectedSquare = -1;

  const p = screenToFlat(sx, sy);

  let flatDrag = {
    mode: "body",
    quadIdx: hHit.quadIdx,
    lastPhi: p.phi,
    lastS: p.s,
  };

  if (PATCH_SHAPE_EDIT_ENABLED) {
    if (hHit.kind === "corner") {
      flatDrag = {
        mode: "corner",
        quadIdx: hHit.quadIdx,
        cornerIdx: hHit.cornerIdx,
      };
    } else if (hHit.kind === "edge") {
      flatDrag = {
        mode: "edge",
        quadIdx: hHit.quadIdx,
        edge: hHit.edge,
      };
    }
  }

  state.flatDrag = flatDrag;
  canvas.style.cursor = "grabbing";
  draw();
});

window.addEventListener("mousemove", (e) => {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  state.mouse.sx = sx; state.mouse.sy = sy;
  state.mouse.inside = (sx >= 0 && sy >= 0 &&
                        sx < window.innerWidth &&
                        sy < window.innerHeight);

  if (state.dragQuadVertex) {
    const { quadIdx, cornerIdx } = state.dragQuadVertex;
    const q = quads[quadIdx];
    const corner = quadCorners(q)[cornerIdx];
    const [wx, wy] = s2w(sx, sy);
    const np = projectToConeSurface(wx, wy, corner.s);
    flatMoveCorner(q, cornerIdx, np.phi, np.s);
  } else if (state.dragSquare) {
    const ds = state.dragSquare;
    const sq = floatSquares[ds.squareIdx];
    if (!sq) {
      state.dragSquare = null;
    } else {
      const qi = quadIdxById(sq.quadId);
      const f = qi >= 0 ? patchFrame(qi) : null;
      if (f) {
        if (ds.mode === "body") {
          const lc = cursorToLocalWithShapePersp(f, qi, sx, sy, ds.persp);
          const newU = ds.startCenterU + (lc.u - ds.startCursorU);
          const newV = ds.startCenterV + (lc.v - ds.startCursorV);
          setClonePosition(sq, newU, newV);
        } else if (ds.mode === "corner") {
          const [wx, wy] = s2w(sx, sy);
          resizeSquareFromCorner(sq, ds.cornerIdx, wx, wy, ds.persp);
        } else if (ds.mode === "rotate") {
          const [wx, wy] = s2w(sx, sy);
          rotateSquareToCursor(sq, wx, wy, e.shiftKey, ds.persp);
        }
      }
    }
  } else if (state.dragApex) {
    const dSx = sx - state.dragApex.startSx;
    const dSy = sy - state.dragApex.startSy;
    cone.ax = state.dragApex.startAx + dSx / view.scale;
    cone.ay = state.dragApex.startAy - dSy / view.scale;
    clampApex();
  } else if (state.dragPatchBody) {
    const dp = state.dragPatchBody;
    const q = quads[dp.quadIdx];
    if (!q) {
      state.dragPatchBody = null;
    } else {
      const [wx, wy] = s2w(sx, sy);
      const p = projectToConeSurface(wx, wy, dp.lastS);

      let dPhi = p.phi - dp.lastPhi;
      if (dPhi >  Math.PI) dPhi -= 2 * Math.PI;
      if (dPhi < -Math.PI) dPhi += 2 * Math.PI;

      const dS = p.s - dp.lastS;

      flatMoveBody(q, dPhi, dS);
      dp.lastPhi = p.phi;
      dp.lastS   = p.s;
    }
  } else if (state.flatSquareDrag) {
    const fsd = state.flatSquareDrag;
    const sq = floatSquares[fsd.squareIdx];
    if (!sq) {
      state.flatSquareDrag = null;
    } else {
      if (fsd.mode === "body") {
        const lc = flatCursorToShapeLocal(sq, sx, sy);
        if (lc) {
          const qi = quadIdxById(sq.quadId);
          const f  = qi >= 0 ? patchFrame(qi) : null;
          if (f) {
            const uWorld =
              fsd.startCenterU * f.uLen + (lc.u - fsd.startCursorU);
            const vWorld =
              fsd.startCenterV * f.vLen + (lc.v - fsd.startCursorV);
            setClonePosition(sq, uWorld, vWorld);
          }
        }
      } else if (fsd.mode === "corner") {
        flatResizeSquareFromCornerIdx(sq, sx, sy, fsd.cornerIdx);
      } else if (fsd.mode === "rotate") {
        flatRotateSquareToCursor(sq, sx, sy, e.shiftKey);
      }
    }
  } else if (state.flatDrag) {
    const fd = state.flatDrag;
    const q  = quads[fd.quadIdx];
    const p  = screenToFlat(sx, sy);
    if (fd.mode === "corner") {
      flatMoveCorner(q, fd.cornerIdx, p.phi, p.s);
    } else if (fd.mode === "edge") {
      flatMoveEdge(q, fd.edge, p.phi, p.s);
    } else if (fd.mode === "body") {
      flatMoveBody(q, p.phi - fd.lastPhi, p.s - fd.lastS);
      fd.lastPhi = p.phi;
      fd.lastS   = p.s;
    }
  }
  draw();
});

window.addEventListener("mouseup", () => {
  if (state.dragQuadVertex || state.dragApex ||
      state.flatDrag || state.dragSquare || state.flatSquareDrag ||
      state.dragPatchBody) {
    state.dragQuadVertex = null;
    state.dragApex       = null;
    state.flatDrag       = null;
    state.dragSquare     = null;
    state.flatSquareDrag = null;
    state.dragPatchBody  = null;
    canvas.style.cursor  = "crosshair";
  }
});

canvas.addEventListener("wheel", (e) => {
  const rect = canvas.getBoundingClientRect();
  const sy = e.clientY - rect.top;
  if (sy >= layout.dividerY) return;
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.08 : 1 / 1.08;
  cone.depth = Math.max(3, Math.min(40, cone.depth * factor));
  clampApex();
  syncPanelSliders();
  draw();
}, { passive: false });

canvas.style.cursor = "crosshair";

(function installShellControls() {
  const ui          = document.getElementById("ui");
  const restoreBtn  = document.getElementById("restoreBtn");
  const collapseBtn = document.getElementById("collapseBtn");

  const collapse = () => {
    ui.classList.add("collapsed");
    restoreBtn.classList.add("visible");
  };
  const restore = () => {
    ui.classList.remove("collapsed");
    restoreBtn.classList.remove("visible");
  };

  collapseBtn.addEventListener("click", collapse);
  restoreBtn.addEventListener("click", restore);

  window.addEventListener("keydown", (e) => {
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
    if (e.key === "h" || e.key === "H") {
      if (ui.classList.contains("collapsed")) restore();
      else                                     collapse();
    }
  });
})();

syncPanelSliders();
syncQuadList();
resize();
</script>
